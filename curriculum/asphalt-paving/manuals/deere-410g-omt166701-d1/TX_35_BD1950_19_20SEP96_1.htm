<h3>Using a Sight Gauge for Trenching</h3>
 
<p>
Drive two stakes in ground, 9 m (30 ft) (A) apart, in line with desired trench location. Use stakes as a sight gauge. Use of a sight gauge is recommended especially if machine is moved off course often.
</p>
