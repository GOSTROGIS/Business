<h3>Fuel Level Gauge</h3>
 
<p>
The fuel gauge shows the level of fuel in the tank. Fuel level gauge needle will enter red zone (A) when fuel level in tank is low.
</p>
<p>
Always fill the fuel tank at the end of the day to minimize condensation in the fuel tank.
</p>
