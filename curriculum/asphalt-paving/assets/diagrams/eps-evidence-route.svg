<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
  <title id="title">End Product Specification: two responsibilities</title>
  <desc id="desc">In historical clause 502.03.01, the contractor is responsible for quality control of construction processes. The Ministry performs specified quality-audit sampling and testing of the end product to determine acceptance or rejection and payment adjustment. Confirm the actual contract and edition for a current job.</desc>
  <defs>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1A1512" opacity=".035"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1A1512" stroke-width="1.6"/></marker>
  </defs>
  <rect width="1080" height="680" rx="22" fill="#F7F4F1"/>
  <rect width="1080" height="680" rx="22" fill="url(#grain)"/>
  <path d="M32 34H1048" stroke="#D2181F" stroke-width="6"/>
  <g font-family="Arial, sans-serif" fill="#1A1512">
    <text x="40" y="74" font-size="17" font-weight="700" letter-spacing="2">READ THE TRADE TERM</text>
    <text x="40" y="124" font-size="42" font-weight="700">End Product Specification</text>
    <rect x="895" y="88" width="145" height="45" rx="22" fill="#FFBC00"/>
    <text x="967" y="118" font-size="23" text-anchor="middle" font-weight="700">EPS</text>
    <text x="40" y="163" font-size="21" fill="#625D58">Two responsibilities in the 2006 definition • clause 502.03.01</text>
    <rect x="40" y="200" width="480" height="270" rx="16" fill="#fff" stroke="#D7CEC6"/>
    <rect x="560" y="200" width="480" height="270" rx="16" fill="#fff" stroke="#D7CEC6"/>
    <path d="M58 201H502" stroke="#D2181F" stroke-width="5"/>
    <path d="M578 201H1022" stroke="#FFBC00" stroke-width="5"/>
    <circle cx="86" cy="249" r="22" fill="#D2181F"/>
    <text x="86" y="257" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">1</text>
    <text x="124" y="258" font-size="29" font-weight="700">Contractor</text>
    <circle cx="606" cy="249" r="22" fill="#FFBC00"/>
    <text x="606" y="257" text-anchor="middle" font-size="21" font-weight="700">2</text>
    <text x="644" y="258" font-size="29" font-weight="700">Ministry</text>
    <text x="70" y="310" font-size="25" font-weight="700">Quality control</text>
    <text x="590" y="310" font-size="25" font-weight="700">Quality audit</text>
    <g fill="none" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="74" y="342" width="56" height="75" rx="5"/>
      <path d="M90 342v-8h24v8M86 363l5 5 10-12M108 362h11M86 386l5 5 10-12M108 385h11M85 405h34"/>
      <path d="M599 348h49M608 348v22l-15 33q-4 11 7 11h34q11 0 7-11l-15-33v-22M603 392h30"/>
      <circle cx="644" cy="400" r="17" fill="#fff"/>
      <path d="m656 413 15 15M637 400l5 5 9-11"/>
    </g>
    <text x="153" y="365" font-size="22">Controls the quality of</text>
    <text x="153" y="399" font-size="22">construction processes.</text>
    <text x="690" y="357" font-size="21">Performs specified</text>
    <text x="690" y="388" font-size="21">sampling and testing</text>
    <text x="690" y="419" font-size="21">of the end product.</text>
    <path d="M800 473v35" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="518" width="1000" height="92" rx="12" fill="#1A1512"/>
    <rect x="40" y="518" width="8" height="92" rx="4" fill="#FFBC00"/>
    <text x="68" y="554" font-size="19" font-weight="700" fill="#FFBC00">WHAT THE QUALITY-AUDIT EVIDENCE IS USED TO DETERMINE</text>
    <text x="68" y="588" font-size="24" fill="#fff">Acceptance or rejection, and payment adjustment.</text>
    <text x="40" y="650" font-size="19" fill="#625D58">For a current job: confirm the actual contract, applicable specification and edition.</text>
  </g>
</svg>
