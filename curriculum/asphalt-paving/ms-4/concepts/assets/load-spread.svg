oke-width="5"/><path d="M450 244L438 263" fill="none" stroke="#625D58" stroke-width="5"/><path d="M470 244L458 263" fill="none" stroke="#625D58" stroke-width="5"/><path d="M490 244L478 263" fill="none" stroke="#625D58" stroke-width="5"/><path d="M510 244L498 263" fill="none" stroke="#625D58" stroke-width="5"/><path d="M440 205L440 291" fill="none" stroke="#D2181F" stroke-width="7" marker-end="url(#arrow)"/><text x="560" y="267" font-size="29" fill="#1A1512" font-weight="700" text-anchor="start">Wheel load</text><path d="M550 277L484 289" fill="none" stroke="#625D58" stroke-width="2"/><rect x="115" y="427" width="650" height="122" rx="0" fill="#1A1512" stroke="#1A1512"/><rect x="115" y="427" width="650" height="122" fill="url(#asphalt)"/><rect x="115" y="549" width="650" height="111" rx="0" fill="#ded4c4" stroke="#ded4c4"/><rect x="115" y="549" width="650" height="111" fill="url(#stone)"/><path d="M403 427H477L660 549H220Z" fill="#FFBC00" opacity=".7"/><path d="M260 555L260 610" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M350 555L350 610" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 555L440 610" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M530 555L530 610" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 555L620 610" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="455" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Pavement</text><text x="810" y="486" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">structure</text><path d="M795 478L710 478" fill="none" stroke="#625D58" stroke-width="2"/><text x="810" y="588" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Prepared</text><text x="810" y="619" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">subgrade</text><path d="M795 607L710 607" fill="none" strok