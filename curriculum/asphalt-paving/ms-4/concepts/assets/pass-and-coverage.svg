<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A pass is not a coverage</title><desc id="desc">A pass counts a roller crossing over one point. Coverage concerns the full mat width. A point may receive two passes while the full width has received only one complete coverage. Three coloured bands are conceptual, not an operating pattern.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1A1512" stroke-width="1.6"/></marker><pattern id="stone" width="56" height="40" patternUnits="userSpaceOnUse"><path d="m4 12 13-6 14 10-7 13-18-3zM38 28l9-6 8 7-5 9-12-2z" fill="none" stroke="#625D58" stroke-width="2"/></pattern><pattern id="asphalt" width="45" height="34" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="3" fill="#fff" opacity=".5"/><path d="m23 13 8-5 7 9-10 6z" fill="#fff" opacity=".25"/></pattern></defs><rect width="1200" height="800" rx="24" fill="#F7F4F1"/><g font-family="Arial,sans-serif"><path d="M40 35H1160" stroke="#D2181F" stroke-width="6"/><text x="40" y="76" font-size="16" fill="#625D58" font-weight="700" text-anchor="start">ACCESS IS4S · ASPHALT FOUNDATIONS</text><text x="40" y="129" font-size="40" fill="#1A1512" font-weight="700" text-anchor="start">A pass is not a coverage</text><text x="40" y="168" font-size="22" fill="#625D58" font-weight="400" text-anchor="start">Name the area you are counting before interpreting a roller record.</text><rect x="40" y="200" width="540" height="300" rx="12" fill="white" stroke="#d7cec6"/><rect x="610" y="200" width="550" height="300" rx="12" fill="white" stroke="#d7cec6"/><text x="70" y="245" font-size="29" fill="#D2181F" font-weight="700" text-anchor="start">PASS</text><text x="70" y="283" font-size="24" fill="#1A1512" font-weight="400" text-anchor="start">One crossing over one point</text><text x="70" y="314" font-size="24" fill="#1A1512" font-weight="400" text-anchor="start">on the mat.</text><rect x="80" y="350" width="450" height="95" rx="4" fill="#e5ded5" stroke="#1A1512"/><path d="M105 397L505 397" fill="none" stroke="#1A1512" stroke-width="5" marker-end="url(#arrow)"/><circle cx="310" cy="397" r="12" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><text x="310" y="477" font-size="19" fill="#1A1512" font-weight="400" text-anchor="middle">Point P · count a crossing here</text><text x="640" y="245" font-size="29" fill="#D2181F" font-weight="700" text-anchor="start">COVERAGE</text><text x="640" y="283" font-size="24" fill="#1A1512" font-weight="400" text-anchor="start">Enough rolling to cover</text><text x="640" y="314" font-size="24" fill="#1A1512" font-weight="400" text-anchor="start">the complete width of the mat.</text><rect x="655" y="346" width="450" height="32" rx="2" fill="#fff0c4" stroke="#1A1512"/><text x="880" y="370" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">✓</text><rect x="655" y="383" width="450" height="32" rx="2" fill="#ffdc75" stroke="#1A1512"/><text x="880" y="407" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">✓</text><rect x="655" y="420" width="450" height="32" rx="2" fill="#FFBC00" stroke="#1A1512"/><text x="880" y="444" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">✓</text><text x="880" y="477" font-size="18" fill="#1A1512" font-weight="400" text-anchor="middle">All three schematic bands are included</text><rect x="40" y="525" width="1120" height="175" rx="12" fill="#1A1512" stroke="#1A1512"/><text x="68" y="565" font-size="19" fill="#FFBC00" font-weight="700" text-anchor="start">TWO RECORDS CAN BOTH BE TRUE</text><text x="68" y="611" font-size="30" fill="white" font-weight="700" text-anchor="start">Point P: two passes.</text><text x="625" y="611" font-size="30" fill="white" font-weight="700" text-anchor="start">Whole mat: one coverage.</text><text x="68" y="660" font-size="23" fill="white" font-weight="400" text-anchor="start">Extra travel over one part does not prove a second complete coverage.</text><path d="M40 727H1160" stroke="#d7cec6"/><text x="40" y="763" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Adapted concept · schematic bands are not a prescribed rolling pattern or roller width.</text></g></svg>