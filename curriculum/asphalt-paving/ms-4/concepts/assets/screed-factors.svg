<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A free-floating screed responds to a system</title><desc id="desc">A simplified free-floating screed with five named factors: angle of attack, head of material, forward motion or paving speed, screed weight, and HMA stability influenced by temperature and gradation. No control setting or adjustment is specified.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1A1512" stroke-width="1.6"/></marker><pattern id="stone" width="56" height="40" patternUnits="userSpaceOnUse"><path d="m4 12 13-6 14 10-7 13-18-3zM38 28l9-6 8 7-5 9-12-2z" fill="none" stroke="#625D58" stroke-width="2"/></pattern><pattern id="asphalt" width="45" height="34" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="3" fill="#fff" opacity=".5"/><path d="m23 13 8-5 7 9-10 6z" fill="#fff" opacity=".25"/></pattern></defs><rect width="1200" height="800" rx="24" fill="#F7F4F1"/><g font-family="Arial,sans-serif"><path d="M40 35H1160" stroke="#D2181F" stroke-width="6"/><text x="40" y="76" font-size="16" fill="#625D58" font-weight="700" text-anchor="start">ACCESS IS4S · ASPHALT FOUNDATIONS</text><text x="40" y="129" font-size="40" fill="#1A1512" font-weight="700" text-anchor="start">A free-floating screed responds to a system</text><text x="40" y="168" font-size="22" fill="#625D58" font-weight="400" text-anchor="start">Recognize the five interacting factors before discussing a changed result.</text><rect x="40" y="200" width="1120" height="500" rx="12" fill="white" stroke="#d7cec6"/><rect x="70" y="230" width="350" height="99" rx="12" fill="#fff5d6" stroke="#d7cec6"/><text x="92" y="267" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">1 · Angle of attack</text><text x="92" y="300" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Screed angle to the paving grade.</text><rect x="780" y="230" width="350" height="99" rx="12" fill="#fff5d6" stroke="#d7cec6"/><text x="802" y="267" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">2 · Head of material</text><text x="802" y="300" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Mixture in front of the screed.</text><rect x="70" y="570" width="350" height="98" rx="12" fill="#fff5d6" stroke="#d7cec6"/><text x="92" y="607" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">4 · Screed weight</text><text x="92" y="640" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">The screed assembly’s weight.</text><rect x="780" y="570" width="350" height="98" rx="12" fill="#fff5d6" stroke="#d7cec6"/><text x="802" y="607" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">5 · HMA stability</text><text x="802" y="640" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Temperature and gradation matter.</text><rect x="430" y="226" width="340" height="91" rx="12" fill="#1A1512" stroke="#1A1512"/><text x="450" y="261" font-size="25" fill="white" font-weight="700" text-anchor="start">3 · Forward motion</text><text x="450" y="294" font-size="21" fill="#FFBC00" font-weight="400" text-anchor="start">Paving speed</text><path d="M470 347L730 347" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="377" font-size="18" fill="#625D58" font-weight="400" text-anchor="middle">Travel direction</text><rect x="160" y="506" width="850" height="28" rx="0" fill="#625D58" stroke="#625D58"/><path d="M670 505Q730 405 805 506Z" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><path d="M405 496 665 468 668 492 405 519Z" fill="#D2181F" stroke="#1A1512" stroke-width="3"/><path d="M510 472V408H620V476M545 408 900 381" fill="none" stroke="#1A1512" stroke-width="7"/><path d="M570 379L570 438" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><text x="250" y="476" font-size="22" fill="#1A1512" font-weight="700" text-anchor="start">Mat</text><path d="M294 329L405 496" fill="none" stroke="#625D58" stroke-width="2"/><path d="M923 329L760 456" fill="none" stroke="#625D58" stroke-width="2"/><path d="M297 570L552 432" fill="none" stroke="#625D58" stroke-width="2"/><path d="M885 570L789 506" fill="none" stroke="#625D58" stroke-width="2"/><path d="M40 727H1160" stroke="#d7cec6"/><text x="40" y="763" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Conceptual redraw · arrows identify relationships, not adjustment instructions or setting values.</text></g></svg>