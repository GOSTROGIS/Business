<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Follow the mixture through the paver</title><desc id="desc">Mixture enters the hopper, travels rearward on slat conveyors, is distributed laterally by augers and passes beneath the screed to form the mat. The diagram names functions without prescribing controls or settings.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1A1512" stroke-width="1.6"/></marker><pattern id="stone" width="56" height="40" patternUnits="userSpaceOnUse"><path d="m4 12 13-6 14 10-7 13-18-3zM38 28l9-6 8 7-5 9-12-2z" fill="none" stroke="#625D58" stroke-width="2"/></pattern><pattern id="asphalt" width="45" height="34" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="3" fill="#fff" opacity=".5"/><path d="m23 13 8-5 7 9-10 6z" fill="#fff" opacity=".25"/></pattern></defs><rect width="1200" height="800" rx="24" fill="#F7F4F1"/><g font-family="Arial,sans-serif"><path d="M40 35H1160" stroke="#D2181F" stroke-width="6"/><text x="40" y="76" font-size="16" fill="#625D58" font-weight="700" text-anchor="start">ACCESS IS4S · ASPHALT FOUNDATIONS</text><text x="40" y="129" font-size="40" fill="#1A1512" font-weight="700" text-anchor="start">Follow the mixture through the paver</text><text x="40" y="168" font-size="22" fill="#625D58" font-weight="400" text-anchor="start">Four trade words connect receiving, conveying, distributing and placing.</text><rect x="40" y="200" width="1120" height="500" rx="12" fill="white" stroke="#d7cec6"/><text x="76" y="239" font-size="17" fill="#625D58" font-weight="700" text-anchor="start">FRONT · RECEIVING</text><text x="858" y="239" font-size="17" fill="#625D58" font-weight="700" text-anchor="start">REAR · PLACING</text><path d="M85 310H315L278 435H127Z" fill="#FFBC00" stroke="#1A1512" stroke-width="4"/><path d="m125 330 16-7 16 14-10 15-18-4z" fill="#1A1512"/><path d="m165 346 16-7 16 14-10 15-18-4z" fill="#1A1512"/><path d="m203 327 16-7 16 14-10 15-18-4z" fill="#1A1512"/><path d="m245 353 16-7 16 14-10 15-18-4z" fill="#1A1512"/><path d="m155 385 16-7 16 14-10 15-18-4z" fill="#1A1512"/><path d="m226 392 16-7 16 14-10 15-18-4z" fill="#1A1512"/><rect x="310" y="370" width="370" height="65" rx="4" fill="#d1c9bf" stroke="#1A1512"/><path d="M330 378L330 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M370 378L370 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M410 378L410 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M450 378L450 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M490 378L490 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M530 378L530 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M570 378L570 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M610 378L610 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M650 378L650 426" fill="none" stroke="#1A1512" stroke-width="5"/><path d="M325 344L660 344" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><rect x="716" y="285" width="55" height="236" rx="8" fill="#D2181F" stroke="#1A1512"/><path d="M720 300L766 318" fill="none" stroke="white" stroke-width="3"/><path d="M720 325L766 343" fill="none" stroke="white" stroke-width="3"/><path d="M720 350L766 368" fill="none" stroke="white" stroke-width="3"/><path d="M720 375L766 393" fill="none" stroke="white" stroke-width="3"/><path d="M720 400L766 418" fill="none" stroke="white" stroke-width="3"/><path d="M720 425L766 443" fill="none" stroke="white" stroke-width="3"/><path d="M720 450L766 468" fill="none" stroke="white" stroke-width="3"/><path d="M720 475L766 493" fill="none" stroke="white" stroke-width="3"/><path d="M720 500L766 518" fill="none" stroke="white" stroke-width="3"/><path d="M695 332L695 278" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M695 459L695 516" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><rect x="830" y="284" width="74" height="238" rx="6" fill="#1A1512" stroke="#1A1512"/><rect x="905" y="296" width="200" height="214" rx="0" fill="#625D58" stroke="#625D58"/><rect x="905" y="296" width="200" height="214" fill="url(#asphalt)"/><path d="M784 400L817 400" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="82" y="572" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Hopper</text><text x="82" y="612" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">Receives the</text><text x="82" y="641" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">asphalt mixture.</text><text x="330" y="572" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Slat conveyor</text><text x="330" y="612" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">Moves mixture</text><text x="330" y="641" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">toward the rear.</text><text x="655" y="572" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Augers</text><text x="655" y="612" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">Distribute mixture</text><text x="655" y="641" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">across the width.</text><text x="935" y="572" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Screed</text><text x="935" y="612" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">Places the</text><text x="935" y="641" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">shaped mat.</text><path d="M40 727H1160" stroke="#d7cec6"/><text x="40" y="763" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Functional schematic · machine geometry and controls vary · not an operating sequence.</text></g></svg>