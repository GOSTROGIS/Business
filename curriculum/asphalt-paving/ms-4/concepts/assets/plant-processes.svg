<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Batch or continuous?</title><desc id="desc">The batch route shows cold-feed bins, drying and heating, screening and hot bins, weighing a batch, mixing with binder and storage. The continuous route shows proportioning, flow measurement, continuous drying and mixing with metered binder, and storage.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1A1512" stroke-width="1.6"/></marker><pattern id="stone" width="56" height="40" patternUnits="userSpaceOnUse"><path d="m4 12 13-6 14 10-7 13-18-3zM38 28l9-6 8 7-5 9-12-2z" fill="none" stroke="#625D58" stroke-width="2"/></pattern><pattern id="asphalt" width="45" height="34" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="3" fill="#fff" opacity=".5"/><path d="m23 13 8-5 7 9-10 6z" fill="#fff" opacity=".25"/></pattern></defs><rect width="1200" height="800" rx="24" fill="#F7F4F1"/><g font-family="Arial,sans-serif"><path d="M40 35H1160" stroke="#D2181F" stroke-width="6"/><text x="40" y="76" font-size="16" fill="#625D58" font-weight="700" text-anchor="start">ACCESS IS4S · ASPHALT FOUNDATIONS</text><text x="40" y="129" font-size="40" fill="#1A1512" font-weight="700" text-anchor="start">Batch or continuous?</text><text x="40" y="168" font-size="22" fill="#625D58" font-weight="400" text-anchor="start">Classify the mixing process, not the presence of one piece of equipment.</text><rect x="40" y="200" width="1120" height="235" rx="12" fill="white" stroke="#d7cec6"/><rect x="40" y="455" width="1120" height="245" rx="12" fill="white" stroke="#d7cec6"/><text x="65" y="240" font-size="26" fill="#D2181F" font-weight="700" text-anchor="start">BATCH</text><text x="230" y="240" font-size="24" fill="#1A1512" font-weight="400" text-anchor="start">Separate weighed batches</text><rect x="65" y="279" width="155" height="89" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="80" y="315" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Cold-feed</text><text x="80" y="344" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">bins</text><path d="M223 324L243 324" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="246" y="279" width="155" height="89" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="261" y="315" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Dry and</text><text x="261" y="344" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">heat</text><path d="M404 324L424 324" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="427" y="279" width="155" height="89" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="442" y="315" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Screen +</text><text x="442" y="344" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">hot bins</text><path d="M585 324L605 324" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="608" y="279" width="155" height="89" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="623" y="315" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Weigh a</text><text x="623" y="344" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">batch</text><path d="M766 324L786 324" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="789" y="279" width="155" height="89" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="804" y="315" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Mix with</text><text x="804" y="344" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">binder</text><path d="M947 324L967 324" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="970" y="279" width="155" height="89" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="985" y="315" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Store /</text><text x="985" y="344" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">load out</text><text x="65" y="406" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">A batch plant can have a drying drum. The batch mixer defines the process.</text><text x="65" y="495" font-size="26" fill="#D2181F" font-weight="700" text-anchor="start">DRUM / CONTINUOUS</text><rect x="65" y="535" width="245" height="90" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="80" y="571" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Proportion at</text><text x="80" y="600" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">cold-feed bins</text><path d="M314 580L339 580" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="343" y="535" width="245" height="90" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="358" y="571" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Measure the</text><text x="358" y="600" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">material flow</text><path d="M592 580L617 580" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="621" y="535" width="245" height="90" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="636" y="571" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Dry + mix with</text><text x="636" y="600" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">metered binder</text><path d="M870 580L895 580" fill="none" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="899" y="535" width="245" height="90" rx="8" fill="#fff5d6" stroke="#d7cec6"/><text x="914" y="571" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Continuous mix</text><text x="914" y="600" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">to storage</text><text x="65" y="669" font-size="21" fill="#625D58" font-weight="400" text-anchor="start">Some facilities use a separate dryer and continuous mixer.</text><path d="M40 727H1160" stroke="#d7cec6"/><text x="40" y="763" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Simplified material routes · additives, recycling and detailed controls require their own records.</text></g></svg>