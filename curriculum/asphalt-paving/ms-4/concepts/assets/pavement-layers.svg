<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Name the layers</title><desc id="desc">Four labelled layers: asphalt surface, granular base, optional subbase where specified, and prepared subgrade. The first three are above the prepared ground. This is one example, not every road structure.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#1A1512" stroke-width="1.6"/></marker><pattern id="stone" width="56" height="40" patternUnits="userSpaceOnUse"><path d="m4 12 13-6 14 10-7 13-18-3zM38 28l9-6 8 7-5 9-12-2z" fill="none" stroke="#625D58" stroke-width="2"/></pattern><pattern id="asphalt" width="45" height="34" patternUnits="userSpaceOnUse"><circle cx="8" cy="9" r="3" fill="#fff" opacity=".5"/><path d="m23 13 8-5 7 9-10 6z" fill="#fff" opacity=".25"/></pattern></defs><rect width="1200" height="800" rx="24" fill="#F7F4F1"/><g font-family="Arial,sans-serif"><path d="M40 35H1160" stroke="#D2181F" stroke-width="6"/><text x="40" y="76" font-size="16" fill="#625D58" font-weight="700" text-anchor="start">ACCESS IS4S · ASPHALT FOUNDATIONS</text><text x="40" y="129" font-size="40" fill="#1A1512" font-weight="700" text-anchor="start">Name the layers</text><text x="40" y="168" font-size="22" fill="#625D58" font-weight="400" text-anchor="start">One example: asphalt pavement on an unbound base, with a subbase.</text><rect x="40" y="200" width="1120" height="500" rx="12" fill="white" stroke="#d7cec6"/><path d="M90 263 500 263 570 245 160 245Z" fill="#1A1512" stroke="#1A1512"/><rect x="90" y="263" width="410" height="58" rx="0" fill="#1A1512" stroke="#1A1512"/><path d="M500 263 570 245V303L500 321Z" fill="#1A1512" stroke="#1A1512"/><rect x="91" y="265" width="408" height="55" fill="url(#asphalt)"/><path d="M590 281L655 281" fill="none" stroke="#625D58" stroke-width="2"/><circle cx="687" cy="281" r="21" fill="#FFBC00"/><text x="687" y="289" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">1</text><text x="724" y="280" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Asphalt surface</text><text x="724" y="311" font-size="19" fill="#625D58" font-weight="400" text-anchor="start">The upper asphalt layer.</text><path d="M90 355 500 355 570 337 160 337Z" fill="#b6ab9b" stroke="#1A1512"/><rect x="90" y="355" width="410" height="74" rx="0" fill="#b6ab9b" stroke="#1A1512"/><path d="M500 355 570 337V411L500 429Z" fill="#b6ab9b" stroke="#1A1512"/><rect x="91" y="357" width="408" height="71" fill="url(#stone)"/><path d="M590 373L655 373" fill="none" stroke="#625D58" stroke-width="2"/><circle cx="687" cy="373" r="21" fill="#FFBC00"/><text x="687" y="381" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">2</text><text x="724" y="372" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Granular base</text><text x="724" y="403" font-size="19" fill="#625D58" font-weight="400" text-anchor="start">Supports the asphalt surface.</text><path d="M90 463 500 463 570 445 160 445Z" fill="#d2c5ae" stroke="#1A1512"/><rect x="90" y="463" width="410" height="66" rx="0" fill="#d2c5ae" stroke="#1A1512"/><path d="M500 463 570 445V511L500 529Z" fill="#d2c5ae" stroke="#1A1512"/><rect x="91" y="465" width="408" height="63" fill="url(#stone)"/><path d="M590 481L655 481" fill="none" stroke="#625D58" stroke-width="2"/><circle cx="687" cy="481" r="21" fill="#FFBC00"/><text x="687" y="489" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">3</text><text x="724" y="480" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Subbase, where specified</text><text x="724" y="511" font-size="19" fill="#625D58" font-weight="400" text-anchor="start">An additional supporting layer.</text><path d="M90 563 500 563 570 545 160 545Z" fill="#e8decf" stroke="#1A1512"/><rect x="90" y="563" width="410" height="94" rx="0" fill="#e8decf" stroke="#1A1512"/><path d="M500 563 570 545V639L500 657Z" fill="#e8decf" stroke="#1A1512"/><rect x="91" y="565" width="408" height="91" fill="url(#stone)"/><path d="M590 581L655 581" fill="none" stroke="#625D58" stroke-width="2"/><circle cx="687" cy="581" r="21" fill="#FFBC00"/><text x="687" y="589" font-size="22" fill="#1A1512" font-weight="700" text-anchor="middle">4</text><text x="724" y="580" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start">Prepared subgrade</text><text x="724" y="611" font-size="19" fill="#625D58" font-weight="400" text-anchor="start">The prepared ground beneath the structure.</text><path d="M40 727H1160" stroke="#d7cec6"/><text x="40" y="763" font-size="18" fill="#625D58" font-weight="400" text-anchor="start">Conceptual section · other pavement structures exist · layer thicknesses are not a design.</text></g></svg>