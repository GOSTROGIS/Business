<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">Close to the curve can still be outside a limit.</title><desc id="desc">On a common percentage scale, the curve value is 51 percent with a plus or minus 4.5 percentage-point tolerance, giving 46.5 to 55.5 percent. The four-test mean of 49, 49, 50 and 50 is 49.5 percent, 1.5 percentage points below the curve and within that tolerance. The independent Table 501-E interval is 50 to 75 percent. A mean of 49.5 percent is below its lower bound. These partial classroom checks do not approve a whole mix.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 10L10 -2M2 14L14 2" stroke="#1A1512" stroke-width="1"/></pattern></defs><rect width="1000" height="610" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="36" y="28" width="32" height="4" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="82" y="38" font-size="18" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="1.5">CHECK / TWO INDEPENDENT CONSTRAINTS</text><text x="36" y="91" font-size="36" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Close to the curve can still be outside a limit.</text><text x="36" y="138" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Mean = (49 + 49 + 50 + 50) ÷ 4 = 49.5%</text><text x="36" y="186" font-size="22" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">1 · CURVE CHECK</text><text x="575" y="186" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">51% ± 4.5 percentage points</text><rect x="162.5" y="224" width="225.0" height="37" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><line x1="275" y1="216" x2="275" y2="271" stroke="#1A1512" stroke-width="3"/><text x="162.5" y="296" font-size="21" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">46.5%</text><text x="387.5" y="296" font-size="21" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">55.5%</text><text x="275" y="296" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">51%</text><text x="575" y="248" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">49.5 − 51 = −1.5 points</text><text x="575" y="283" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Within the ±4.5 tolerance</text><text x="36" y="347" font-size="22" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">2 · ABSOLUTE INTERVAL</text><rect x="250" y="372" width="625" height="37" rx="0" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="257" y="442" font-size="22" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">50%</text><text x="875" y="442" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">75%</text><line x1="237.5" y1="214" x2="237.5" y2="310" stroke="#D2181F" stroke-width="3" stroke-dasharray="10 8"/><line x1="237.5" y1="365" x2="237.5" y2="419" stroke="#D2181F" stroke-width="3" stroke-dasharray="10 8"/><circle cx="237.5" cy="243" r="7" fill="#D2181F" stroke="#1A1512" stroke-width="1.5"/><circle cx="237.5" cy="391" r="7" fill="#D2181F" stroke="#1A1512" stroke-width="1.5"/><path d="M237.5 425 V467 H109" stroke="#D2181F" stroke-width="2" fill="none"/><text x="36" y="504" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">49.5% mean</text><text x="332" y="504" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Below the 50% lower limit</text><text x="36" y="567" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Both checks matter. A partial result is not whole-mix approval.</text></g></svg>