<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Add adjacent areas. Revise only what changed.</title><desc id="desc">Not-to-scale plan schematic. The main rectangle is 200 metres long and 4 metres wide, giving 800 square metres. An adjacent, non-overlapping letdown is 20 metres wide and 10 metres deep in version 1, giving 200 square metres. Version 2 changes that same letdown depth to 15 metres, giving 300 square metres. The hatched extension is the additional depth, not a second complete letdown.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 10L10 -2M2 14L14 2" stroke="#1A1512" stroke-width="1"/></pattern></defs><rect width="1000" height="650" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="36" y="28" width="32" height="4" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="82" y="38" font-size="18" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="1.5">AREA / USE EACH COMPONENT ONCE</text><text x="36" y="91" font-size="36" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Add adjacent areas. Revise only what changed.</text><text x="36" y="133" font-size="19" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">SCHEMATIC · NOT TO SCALE · USE THE LABELLED DIMENSIONS</text><line x1="97" y1="174" x2="817" y2="174" stroke="#1A1512" stroke-width="2"/><line x1="97" y1="166" x2="97" y2="182" stroke="#1A1512" stroke-width="2"/><line x1="817" y1="166" x2="817" y2="182" stroke="#1A1512" stroke-width="2"/><text x="457" y="165" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">200 m</text><rect x="97" y="199" width="720" height="100" rx="0" fill="#1A1512" stroke="#1A1512" stroke-width="2" /><text x="457" y="241" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">MAIN RECTANGLE</text><text x="457" y="277" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">200 m × 4 m = 800 m²</text><line x1="853" y1="199" x2="853" y2="299" stroke="#1A1512" stroke-width="2"/><line x1="845" y1="199" x2="861" y2="199" stroke="#1A1512" stroke-width="2"/><line x1="845" y1="299" x2="861" y2="299" stroke="#1A1512" stroke-width="2"/><text x="875" y="260" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">4 m</text><rect x="577" y="299" width="240" height="130" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><rect x="577" y="429" width="240" height="65" rx="0" fill="url(#hatch)" stroke="#1A1512" stroke-width="2" /><text x="697" y="344" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">LETDOWN</text><text x="697" y="381" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">V1 · 20 × 10 m</text><text x="697" y="411" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">200 m²</text><line x1="554" y1="299" x2="554" y2="429" stroke="#1A1512" stroke-width="2"/><line x1="546" y1="299" x2="562" y2="299" stroke="#1A1512" stroke-width="2"/><line x1="546" y1="429" x2="562" y2="429" stroke="#1A1512" stroke-width="2"/><text x="535" y="369" font-size="23" font-weight="700" fill="#1A1512" text-anchor="end" letter-spacing="0">10 m</text><line x1="853" y1="299" x2="853" y2="494" stroke="#1A1512" stroke-width="2"/><line x1="845" y1="494" x2="861" y2="494" stroke="#1A1512" stroke-width="2"/><text x="875" y="403" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">15 m</text><text x="875" y="435" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">V2</text><line x1="577" y1="527" x2="817" y2="527" stroke="#1A1512" stroke-width="2"/><line x1="577" y1="519" x2="577" y2="535" stroke="#1A1512" stroke-width="2"/><line x1="817" y1="519" x2="817" y2="535" stroke="#1A1512" stroke-width="2"/><text x="697" y="559" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">20 m</text><text x="97" y="362" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Shared edge</text><path d="M258 353 H440 L576 299" stroke="#1A1512" stroke-width="2" fill="none"/><text x="97" y="410" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">No overlap</text><text x="97" y="463" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">V2 replaces the depth:</text><text x="97" y="499" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">20 m × 15 m = 300 m²</text><text x="36" y="614" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">V1 total: 1,000 m²</text><text x="530" y="614" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">V2 total: 1,100 m²</text></g></svg>