<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">One sample. Overlapping passing amounts.</title><desc id="desc">Four horizontal bars share a common zero and a 1,000 gram scale. The total dry sample is 1,000 grams. In fictional sample A, 90 percent or 900 grams passes the 12.5 millimetre sieve, 26 percent or 260 grams passes the 0.600 millimetre sieve, and 5 percent or 50 grams passes the 0.075 millimetre sieve. These cumulative passing amounts overlap; they must not be added as separate portions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 10L10 -2M2 14L14 2" stroke="#1A1512" stroke-width="1"/></pattern></defs><rect width="1000" height="550" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="36" y="28" width="32" height="4" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="82" y="38" font-size="18" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="1.5">NUMERACY / CUMULATIVE PASSING MASS</text><text x="36" y="91" font-size="36" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">One sample. Overlapping passing amounts.</text><text x="36" y="175" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Total dry sample</text><rect x="273" y="145" width="530" height="43" rx="0" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="1.5" /><rect x="273" y="145" width="530.0" height="43" rx="0" fill="#1A1512" stroke="#1A1512" stroke-width="1.5" /><text x="831" y="176" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">1,000 g</text><text x="36" y="254" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">12.5 mm · 90%</text><rect x="273" y="224" width="530" height="43" rx="0" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="1.5" /><rect x="273" y="224" width="477.0" height="43" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5" /><text x="831" y="255" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">900 g</text><text x="36" y="333" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">0.600 mm · 26%</text><rect x="273" y="303" width="530" height="43" rx="0" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="1.5" /><rect x="273" y="303" width="137.8" height="43" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5" /><text x="831" y="334" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">260 g</text><text x="36" y="412" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">0.075 mm · 5%</text><rect x="273" y="382" width="530" height="43" rx="0" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="1.5" /><rect x="273" y="382" width="26.5" height="43" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.5" /><text x="831" y="413" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">50 g</text><line x1="273" y1="461" x2="803" y2="461" stroke="#1A1512" stroke-width="1.5"/><line x1="273.0" y1="454" x2="273.0" y2="467" stroke="#1A1512" stroke-width="1.5"/><text x="273.0" y="491" font-size="20" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">0 g</text><line x1="538.0" y1="454" x2="538.0" y2="467" stroke="#1A1512" stroke-width="1.5"/><text x="538.0" y="491" font-size="20" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">500 g</text><line x1="803.0" y1="454" x2="803.0" y2="467" stroke="#1A1512" stroke-width="1.5"/><text x="803.0" y="491" font-size="20" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">1000 g</text><text x="36" y="531" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Cumulative passing amounts overlap. Do not add the rows.</text></g></svg>