<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Replace the value. Keep the ten-ticket record.</title><desc id="desc">Version 1 has 200 tonnes over 1,000 square metres, giving 200 kilograms per square metre. The correction card replaces ticket T0606 from 20.0 to 18.0 tonnes and the letdown depth from 10 to 15 metres. Version 2 has 198 tonnes over 1,100 square metres, giving 180 kilograms per square metre. Keep both versions, record the reason and obtain an independent check. The corrected ticket is not an eleventh load.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 10L10 -2M2 14L14 2" stroke="#1A1512" stroke-width="1"/></pattern></defs><rect width="1000" height="620" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="36" y="28" width="32" height="4" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="82" y="38" font-size="18" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="1.5">REVISION / KEEP THE AUDIT TRAIL</text><text x="36" y="91" font-size="36" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Replace the value. Keep the ten-ticket record.</text><rect x="36" y="141" width="420" height="194" rx="9" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="61" y="181" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">VERSION 1 · KEEP</text><text x="61" y="225" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">200 t → 200,000 kg</text><text x="61" y="262" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">÷ 1,000 m²</text><text x="61" y="315" font-size="39" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">200 kg/m²</text><rect x="544" y="141" width="420" height="194" rx="9" fill="#1A1512" stroke="none" stroke-width="1" /><text x="569" y="181" font-size="23" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">VERSION 2 · RECALCULATE</text><text x="569" y="225" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">198 t → 198,000 kg</text><text x="569" y="262" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">÷ 1,100 m²</text><text x="569" y="315" font-size="39" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">180 kg/m²</text><line x1="474" y1="241" x2="525" y2="241" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="382" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">DOCUMENTED CORRECTIONS</text><text x="36" y="425" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">T0606</text><text x="189" y="425" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">20.0 t → 18.0 t</text><text x="544" y="425" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Letdown depth</text><text x="750" y="425" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">10 m → 15 m</text><line x1="36" y1="454" x2="964" y2="454" stroke="#D8CBC1" stroke-width="2"/><text x="36" y="498" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Still 10 tickets</text><text x="302" y="498" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Replace T0606 once; do not add an 11th load.</text><rect x="36" y="535" width="928" height="49" rx="6" fill="#FFF0BE" stroke="none" stroke-width="1" /><text x="57" y="567" font-size="22" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep V1 → note the correction reason → recalculate V2 → independent check</text></g></svg>