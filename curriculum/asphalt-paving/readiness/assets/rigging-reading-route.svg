<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Rigging: six questions before practical planning</title><desc id="desc">Six reading checkpoints point to WorkSafeBC Part 15: qualified people, known load, identified gear, configuration, communication and inspection. No lifting capacities are prescribed.</desc><defs><linearGradient id="steel" x1="0" x2="1"><stop stop-color="#6c747a"/><stop offset=".42" stop-color="#e3e7e8"/><stop offset=".7" stop-color="#a0a9ae"/><stop offset="1" stop-color="#4d555b"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffce52"/><stop offset="1" stop-color="#d68b00"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c8bfb5"/></pattern></defs><style>text{font-family:Arial,sans-serif}.title{font-size:42px;font-weight:700;fill:#fff}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#ffbc00}.head{font-size:26px;font-weight:700;fill:#1a1512}.label{font-size:22px;fill:#1a1512}.small{font-size:18px;fill:#625d58}.leader{fill:none;stroke:#a71920;stroke-width:1.8;stroke-linecap:round}.part{stroke:#44423d;stroke-width:2;stroke-linejoin:round}</style><rect width="1440" height="760" rx="18" fill="#f7f4f1"/><path d="M18 0H1422Q1440 0 1440 18V150H0V18Q0 0 18 0" fill="#1a1512"/><rect y="148" width="1440" height="5" fill="#ffbc00"/><text x="38" y="43" class="eyebrow" >B1 · WORKSAFEBC PART 15</text><text x="38" y="99" class="title" >Build the evidence for the lift</text><rect x="28" y="185" width="450" height="230" rx="14" fill="white" stroke="#d8d0c9"/><circle cx="70" cy="227" r="24" fill="#d2181f"/><text x="70" y="234" class="label" text-anchor="middle" style="fill:white;font-weight:700">01</text><text x="108" y="234" class="head" >Qualified people</text><text x="56" y="289" class="label" >Who is qualified to rig</text><text x="56" y="319" class="label" >and supervise this work?</text><path d="M56 343h390" stroke="#ddd4cc"/><text x="56" y="378" class="small" >§ 15.2</text><rect x="502" y="185" width="450" height="230" rx="14" fill="white" stroke="#d8d0c9"/><circle cx="544" cy="227" r="24" fill="#d2181f"/><text x="544" y="234" class="label" text-anchor="middle" style="fill:white;font-weight:700">02</text><text x="582" y="234" class="head" >Known load</text><text x="530" y="289" class="label" >What is the load and</text><text x="530" y="319" class="label" >which lift points apply?</text><path d="M530 343h390" stroke="#ddd4cc"/><text x="530" y="378" class="small" >§§ 15.4–15.5</text><rect x="976" y="185" width="450" height="230" rx="14" fill="white" stroke="#d8d0c9"/><circle cx="1018" cy="227" r="24" fill="#d2181f"/><text x="1018" y="234" class="label" text-anchor="middle" style="fill:white;font-weight:700">03</text><text x="1056" y="234" class="head" >Identified gear</text><text x="1004" y="289" class="label" >Can we verify the gear,</text><text x="1004" y="319" class="label" >its WLL and compatibility?</text><path d="M1004 343h390" stroke="#ddd4cc"/><text x="1004" y="378" class="small" >§§ 15.5, 15.30–15.33</text><rect x="28" y="440" width="450" height="230" rx="14" fill="white" stroke="#d8d0c9"/><circle cx="70" cy="482" r="24" fill="#d2181f"/><text x="70" y="489" class="label" text-anchor="middle" style="fill:white;font-weight:700">04</text><text x="108" y="489" class="head" >Configuration</text><text x="56" y="544" class="label" >Which sling arrangement</text><text x="56" y="574" class="label" >and angle are planned?</text><path d="M56 598h390" stroke="#ddd4cc"/><text x="56" y="633" class="small" >§ 15.34 · from vertical</text><rect x="502" y="440" width="450" height="230" rx="14" fill="white" stroke="#d8d0c9"/><circle cx="544" cy="482" r="24" fill="#d2181f"/><text x="544" y="489" class="label" text-anchor="middle" style="fill:white;font-weight:700">05</text><text x="582" y="489" class="head" >Communication</text><text x="530" y="544" class="label" >Who signals, and which</text><text x="530" y="574" class="label" >regulated signals apply?</text><path d="M530 598h390" stroke="#ddd4cc"/><text x="530" y="633" class="small" >§ 15.20 · Figure 15-1</text><rect x="976" y="440" width="450" height="230" rx="14" fill="white" stroke="#d8d0c9"/><circle cx="1018" cy="482" r="24" fill="#d2181f"/><text x="1018" y="489" class="label" text-anchor="middle" style="fill:white;font-weight:700">06</text><text x="1056" y="489" class="head" >Inspection</text><text x="1004" y="544" class="label" >Is the actual equipment</text><text x="1004" y="574" class="label" >fit for the proposed use?</text><path d="M1004 598h390" stroke="#ddd4cc"/><text x="1004" y="633" class="small" >§§ 15.31, 15.39–15.54</text><text x="38" y="725" class="small" >READING ROUTE · Use complete clauses, actual manufacturer instructions and a qualified plan.</text></svg>