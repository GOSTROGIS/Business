<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Add the whole load before comparing ratings</title><desc id="desc">Fictional trailer example · all values are mass, in kilograms.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Add the whole load before comparing ratings</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Fictional trailer example · all values are mass, in kilograms.</text><text x="65" y="203" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#242827">3,500 kg trailer rating</text><rect x="65" y="258" width="225.0" height="88" rx="0" fill="#276b66"/><text x="177.5" y="385" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#242827" text-anchor="middle">900 kg</text><text x="177.5" y="231" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#242827" text-anchor="middle">Trailer</text><rect x="290.0" y="258" width="575.0" height="88" rx="0" fill="#d5ad62"/><text x="577.5" y="385" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#242827" text-anchor="middle">2300 kg</text><text x="577.5" y="231" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#242827" text-anchor="middle">Machine</text><rect x="865.0" y="258" width="105.0" height="88" rx="0" fill="#a93332"/><text x="917.5" y="385" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#242827" text-anchor="middle">420 kg</text><text x="917.5" y="231" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#242827" text-anchor="middle">Tools</text><path d="M940 215V400" fill="none" stroke="#a93332" stroke-width="3" stroke-dasharray="7 5"/><text x="65" y="449" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#242827">900 + 2,300 + 420 = 3,620 kg</text><text x="65" y="489" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#a93332">120 kg over this rating. Check all other limits too.</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Axle, tire, hitch, vehicle, ramp and route requirements also matter.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
