 fill="#242827">Backsight 1.250</text><text x="655" y="199" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#242827">Foresight 1.670</text><text x="655" y="226" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#242827">Point EL 99.580</text><text x="271" y="480" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#276b66">HI = 100.000 + 1.250 = 101.250</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Point elevation = HI − foresight. Target 99.650 means 70 mm fill at this point.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
