<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Time off is not all sleep time</title><desc id="desc">Fictional example: a 20:00 finish and 06:00 start leave 10 hours between shifts.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Time off is not all sleep time</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Fictional example: a 20:00 finish and 06:00 start leave 10 hours between shifts.</text><path d="M70 300H930" fill="none" stroke="#59635d" stroke-width="2"/><rect x="70" y="243" width="172" height="80" rx="3" fill="#276b66"/><text x="156.0" y="355" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#276b66" text-anchor="middle">2 h</text><text x="156.0" y="216" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#276b66" text-anchor="middle">Travel</text><rect x="242" y="243" width="129.0" height="80" rx="3" fill="#d5ad62"/><text x="306.5" y="355" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d5ad62" text-anchor="middle">1.5 h</text><text x="306.5" y="216" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#d5ad62" text-anchor="middle">Meals + care</text><rect x="371.0" y="243" width="43.0" height="80" rx="3" fill="#a93332"/><text x="392.5" y="355" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#a93332" text-anchor="middle">0.5 h</text><text x="392.5" y="216" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#a93332" text-anchor="middle">Call</text><rect x="414.0" y="243" width="516" height="80" rx="3" fill="#242827"/><text x="672.0" y="355" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#242827" text-anchor="middle">6 h</text><text x="672.0" y="216" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242827" text-anchor="middle">Sleep opportunity</text><text x="70" y="416" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#242827">10 − 2 − 1.5 − 0.5 = 6 hours of sleep opportunity</text><text x="70" y="458" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#242827">A further 1.5-hour delay leaves 4.5 hours—not a safe-work approval.</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Plan fatigue controls around actual sleep opportunity, workload and reported condition.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
