<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Smoothness and crossfall answer different questions</title><desc id="desc">Conceptual profiles · no acceptance limit or scale is implied.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Smoothness and crossfall answer different questions</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Conceptual profiles · no acceptance limit or scale is implied.</text><text x="65" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#276b66">ALONG THE ROAD</text><path d="M65 310C170 310 180 260 265 277S375 342 470 290S590 282 640 310" fill="none" stroke="#a93332" stroke-width="5"/><path d="M65 335H640" fill="none" stroke="#59635d" stroke-width="2" marker-end="url(#arrow)"/><text x="155" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#242827">Longitudinal profile → IRI / local defects</text><text x="706" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#276b66">ACROSS THE ROAD</text><path d="M705 315L820 278L940 315" fill="none" stroke="#242827" stroke-width="5"/><path d="M705 340H940" fill="none" stroke="#59635d" stroke-width="2"/><text x="736" y="383" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#242827">Crown / crossfall</text><text x="65" y="470" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#242827">Density is another measurement again: compaction relative to a stated reference.</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">A good result for one property does not prove the others meet specification.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
