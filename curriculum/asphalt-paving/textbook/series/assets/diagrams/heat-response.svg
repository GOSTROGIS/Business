<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Recognize heat strain and act early</title><desc id="desc">A change in a person’s condition matters more than keeping the schedule.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Recognize heat strain and act early</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">A change in a person’s condition matters more than keeping the schedule.</text><rect x="55" y="190" width="255" height="292" rx="12" fill="#fffdf8"/><circle cx="181" cy="262" r="37" fill="#d5ad62"/><path d="M122 413V341Q181 286 240 341V413" fill="#276b66" stroke="#276b66" stroke-width="3"/><path d="M230 219q24-30 32 4q8 25-16 31q-26 1-16-35" fill="#a93332" stroke="#a93332" stroke-width="2"/><text x="80" y="449" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#a93332">Notice a change.</text><rect x="350" y="190" width="595" height="130" rx="10" fill="#fffdf8"/><rect x="350" y="190" width="6" height="130" rx="0" fill="#a93332"/><text x="368" y="221" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#a93332">STOP + GET HELP</text><text x="368" y="256" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Confusion, collapse or severe symptoms:</text><text x="368" y="283" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">activate the emergency response and first aid.</text><rect x="350" y="346" width="595" height="130" rx="10" fill="#fffdf8"/><rect x="350" y="346" width="6" height="130" rx="0" fill="#276b66"/><text x="368" y="377" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">PROTECT + REASSESS</text><text x="368" y="412" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Follow trained first-aid/cooling directions.</text><text x="368" y="439" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Review exposure, breaks, water and work plan.</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Do not leave a seriously affected person alone or send them back to work without assessment.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
