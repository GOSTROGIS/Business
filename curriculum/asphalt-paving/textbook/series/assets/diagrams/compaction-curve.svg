<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Use measured feedback to evaluate the pattern</title><desc id="desc">Illustrative trend only · no pass count or acceptance value is prescribed.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Use measured feedback to evaluate the pattern</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Illustrative trend only · no pass count or acceptance value is prescribed.</text><path d="M90 455H920M90 455V190" fill="none" stroke="#242827" stroke-width="3"/><path d="M90 255H920" fill="none" stroke="#e5ddcc" stroke-width="1"/><path d="M90 320H920" fill="none" stroke="#e5ddcc" stroke-width="1"/><path d="M90 385H920" fill="none" stroke="#e5ddcc" stroke-width="1"/><path d="M120 425C210 350 300 283 420 249S650 230 880 231" fill="none" stroke="#276b66" stroke-width="5"/><circle cx="120" cy="425" r="7" fill="#a93332"/><circle cx="260" cy="309" r="7" fill="#a93332"/><circle cx="420" cy="249" r="7" fill="#a93332"/><circle cx="600" cy="233" r="7" fill="#a93332"/><circle cx="800" cy="231" r="7" fill="#a93332"/><text x="110" y="181" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#276b66">Measured density</text><text x="415" y="496" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#242827">Recorded rolling effort →</text><text x="600" y="355" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#a93332">A plateau needs interpretation.</text><text x="600" y="382" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#a93332">More passes are not always better.</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Read results with temperature, mixture, support, method and the required reference density.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
