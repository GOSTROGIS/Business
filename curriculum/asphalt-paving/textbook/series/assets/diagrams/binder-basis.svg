xt><text x="83" y="436" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">5 ÷ 100 × 100 = 5.00%</text><rect x="520" y="370" width="415" height="116" rx="10" fill="#fffdf8"/><rect x="520" y="370" width="6" height="116" rx="0" fill="#a93332"/><text x="538" y="401" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#a93332">ON TOTAL MIX MASS</text><text x="538" y="436" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">5 ÷ 105 × 100 = 4.76%</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Compare results only after confirming the same reporting basis and method.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
