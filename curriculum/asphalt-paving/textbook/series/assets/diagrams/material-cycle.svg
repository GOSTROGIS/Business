<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Reuse materials through a verified process</title><desc id="desc">RAP means reclaimed asphalt pavement. Suitability depends on the designed use.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Reuse materials through a verified process</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">RAP means reclaimed asphalt pavement. Suitability depends on the designed use.</text><rect x="55" y="195" width="385" height="130" rx="10" fill="#fffdf8"/><rect x="55" y="195" width="6" height="130" rx="0" fill="#276b66"/><text x="73" y="226" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">EXISTING ROAD</text><text x="73" y="261" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Assess condition</text><text x="73" y="288" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Plan recovery</text><rect x="560" y="195" width="385" height="130" rx="10" fill="#fffdf8"/><rect x="560" y="195" width="6" height="130" rx="0" fill="#276b66"/><text x="578" y="226" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">RECOVER + SORT</text><text x="578" y="261" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Mill / process</text><text x="578" y="288" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Keep traceability</text><rect x="560" y="370" width="385" height="130" rx="10" fill="#fffdf8"/><rect x="560" y="370" width="6" height="130" rx="0" fill="#276b66"/><text x="578" y="401" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">DESIGN + TEST</text><text x="578" y="436" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Confirm material suitability</text><text x="578" y="463" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Approve the mixture/layer</text><rect x="55" y="370" width="385" height="130" rx="10" fill="#fffdf8"/><rect x="55" y="370" width="6" height="130" rx="0" fill="#276b66"/><text x="73" y="401" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">PLACE + MAINTAIN</text><text x="73" y="436" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Build to the accepted plan</text><text x="73" y="463" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Review service performance</text><path d="M450 257H545" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M755 330V356" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 435H455" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M246 357V336" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">A recycled percentage is not the same as an emissions-reduction percentage.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
