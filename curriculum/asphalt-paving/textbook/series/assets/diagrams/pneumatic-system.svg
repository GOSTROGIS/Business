<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Air power has a path—and stored energy</title><desc id="desc">Trace the system from supply to the tool. Identify every connection.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Air power has a path—and stored energy</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Trace the system from supply to the tool. Identify every connection.</text><rect x="65" y="235" width="170" height="100" rx="40" fill="#d5ad62"/><circle cx="106" cy="355" r="22" fill="#242827"/><circle cx="196" cy="355" r="22" fill="#242827"/><text x="83" y="285" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#242827">AIR SUPPLY</text><path d="M238 285C330 285 300 385 409 385S520 285 625 285" fill="none" stroke="#276b66" stroke-width="12"/><rect x="625" y="261" width="50" height="48" rx="8" fill="#242827"/><path d="M738 235v160M699 240H777" fill="none" stroke="#242827" stroke-width="19"/><path d="M738 395v66" fill="none" stroke="#59635d" stroke-width="10"/><circle cx="738" cy="310" r="29" fill="#d5ad62"/><text x="70" y="431" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Supply and controls</text><text x="70" y="458" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Use the specified pressure.</text><text x="337" y="220" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Hose + couplings</text><text x="337" y="247" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Inspect and restrain as required.</text><text x="755" y="353" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Tool body</text><text x="755" y="380" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Retainer + steel</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">Stop, isolate and release pressure through the approved procedure before disconnection.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
