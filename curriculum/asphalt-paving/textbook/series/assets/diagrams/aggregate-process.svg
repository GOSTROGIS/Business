<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Follow aggregate through the plant</title><desc id="desc">Processing changes size and separates material; moving systems need controlled access.</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Follow aggregate through the plant</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Processing changes size and separates material; moving systems need controlled access.</text><rect x="40" y="205" width="200" height="140" rx="10" fill="#fffdf8"/><rect x="40" y="205" width="6" height="140" rx="0" fill="#276b66"/><text x="58" y="236" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">FEED</text><text x="58" y="271" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Raw material</text><text x="58" y="298" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Controlled supply</text><rect x="280" y="205" width="200" height="140" rx="10" fill="#fffdf8"/><rect x="280" y="205" width="6" height="140" rx="0" fill="#276b66"/><text x="298" y="236" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">CRUSH</text><text x="298" y="271" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Jaw / cone / impact</text><text x="298" y="298" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Reduce particle size</text><rect x="520" y="205" width="200" height="140" rx="10" fill="#fffdf8"/><rect x="520" y="205" width="6" height="140" rx="0" fill="#276b66"/><text x="538" y="236" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">SCREEN</text><text x="538" y="271" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Separate by size</text><text x="538" y="298" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Check screen condition</text><rect x="760" y="205" width="200" height="140" rx="10" fill="#fffdf8"/><rect x="760" y="205" width="6" height="140" rx="0" fill="#276b66"/><text x="778" y="236" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">STORE</text><text x="778" y="271" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Keep products apart</text><text x="778" y="298" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">Prevent contamination</text><path d="M248 275h24" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M488 275h24" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M728 275h24" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 350V400H380V354" fill="none" stroke="#a93332" stroke-width="3"/><text x="411" y="435" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#a93332">Oversize may return for more crushing.</text><text x="66" y="485" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#242827">Conveyors connect the process. Wash systems may remove unwanted fines.</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">A stopped belt is not an isolated belt. Use the actual energy-control procedure.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
