<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Mass divided by area gives application rate</title><desc id="desc">Fictional lot: 288 t over 2,400 m²; specified rate 120 kg/m².</desc><defs><pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1.2" fill="#b9aa8e" opacity=".45"/><circle cx="19" cy="18" r="1" fill="#b9aa8e" opacity=".3"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 12L12-2M4 16L16 4" stroke="#a93332" stroke-width="2" opacity=".22"/></pattern></defs><rect x="0" y="0" width="1000" height="620" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="106" rx="0" fill="#242827"/><text x="32" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  ASPHALT STUDY</text><text x="32" y="76" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#fffdf8">Mass divided by area gives application rate</text><text x="32" y="140" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#59635d">Fictional lot: 288 t over 2,400 m²; specified rate 120 kg/m².</text><path d="M80 330L385 210L590 310L285 435Z" fill="#e5ddcc" stroke="#242827" stroke-width="3"/><path d="M80 350L285 455L590 330" fill="none" stroke="#276b66" stroke-width="3"/><text x="220" y="330" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#242827">2,400 m²</text><rect x="635" y="210" width="315" height="175" rx="10" fill="#fffdf8"/><rect x="635" y="210" width="6" height="175" rx="0" fill="#276b66"/><text x="653" y="241" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#276b66">CALCULATE</text><text x="653" y="276" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">288 t = 288,000 kg</text><text x="653" y="303" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">288,000 ÷ 2,400</text><text x="653" y="330" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#59635d">= 120 kg/m²</text><text x="90" y="492" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#a93332">120 ÷ 120 × 100 = 100% of the specified rate</text><rect x="32" y="537" width="936" height="48" rx="7" fill="#242827"/><text x="49" y="568" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fffdf8">An average rate does not prove uniform thickness or full acceptance.</text><text x="32" y="607" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#59635d">Conceptual teaching diagram · Use the stated case and actual project/machine requirements.</text></svg>
