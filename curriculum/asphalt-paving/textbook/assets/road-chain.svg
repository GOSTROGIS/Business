="start">Plant + mix record</text><text x="329" y="489" font-size="18" fill="#1a1512" font-weight="400" text-anchor="start">Make the</text><text x="329" y="513" font-size="18" fill="#1a1512" font-weight="400" text-anchor="start">specified mixture.</text><path d="M519 368L571 368" fill="none" stroke="#b71923" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="566" y="232" font-size="19" fill="#b71923" font-weight="700" text-anchor="start">03  DELIVER</text><text x="566" y="455" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Haul + delivery ticket</text><text x="566" y="489" font-size="18" fill="#1a1512" font-weight="400" text-anchor="start">Maintain traceability.</text><path d="M756 368L808 368" fill="none" stroke="#b71923" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="869" y="232" font-size="19" fill="#b71923" font-weight="700" text-anchor="start">04  PLACE</text><text x="869" y="455" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Tractor + screed</text><text x="869" y="489" font-size="18" fill="#1a1512" font-weight="400" text-anchor="start">Feed, spread and shape.</text><path d="M1059 368L1111 368" fill="none" stroke="#b71923" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1150" y="232" font-size="19" fill="#b71923" font-weight="700" text-anchor="start">05  COMPACT</text><text x="1150" y="455" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Roller + checks</text><text x="1150" y="489" font-size="18" fill="#1a1512" font-weight="400" text-anchor="start">Densify and verify.</text><rect x="40" y="551" width="1320" height="113" rx="12" fill="white" stroke="none"/><text x="65" y="593" font-size="20" fill="#286864" font-weight="700" text-anchor="start">THE FOUNDATION RUNS UNDER EVERY STEP</text><text x="65" y="630" font-size="23" fill="#1a1512" font-weight="400" text-anchor="start">People • prepared support • drainage • approved documents • checks • care for the public</text><text x="45" y="720" font-size="25" fill="#1a1512" font-weight="700" text-anchor="start">Explain the handover: what arrives, what changes, and what evidence travels with it?</text><text x="38" y="824" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Original illustration · Machine silhouettes show functions; they do not identify a model or safe operating arrangement.</text></svg>