<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc"><title id="title">A road’s purpose does not name its surface</title><desc id="desc">Four surface examples and a seasonal ice-road category. Uses and structures must be established separately.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="700" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">A road’s purpose does not name its surface</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><rect x="38" y="190" width="316" height="405" rx="12" fill="white" stroke="none"/><text x="60" y="233" font-size="27" fill="#1a1512" font-weight="700" text-anchor="start">Earth</text><path d="M123 280h140l45 175h-230z" fill="#9b7b56" stroke="#9a9289" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="60" y="506" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Shaped ground</text><text x="60" y="550" font-size="19" fill="#625d58" font-weight="400" text-anchor="start">Purpose must be checked.</text><rect x="379" y="190" width="316" height="405" rx="12" fill="white" stroke="none"/><text x="401" y="233" font-size="27" fill="#1a1512" font-weight="700" text-anchor="start">Gravel</text><path d="M464 280h140l45 175h-230z" fill="url(#stone)" stroke="#9a9289" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="401" y="506" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Unbound mineral surface</text><text x="401" y="550" font-size="19" fill="#625d58" font-weight="400" text-anchor="start">Purpose must be checked.</text><rect x="720" y="190" width="316" height="405" rx="12" fill="white" stroke="none"/><text x="742" y="233" font-size="27" fill="#1a1512" font-weight="700" text-anchor="start">Asphalt</text><path d="M805 280h140l45 175h-230z" fill="url(#asphalt)" stroke="#9a9289" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M875 294v34m0 20v48m0 20v25" fill="none" stroke="#ffbc00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="742" y="506" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Aggregate with binder</text><text x="742" y="550" font-size="19" fill="#625d58" font-weight="400" text-anchor="start">Purpose must be checked.</text><rect x="1061" y="190" width="316" height="405" rx="12" fill="white" stroke="none"/><text x="1083" y="233" font-size="27" fill="#1a1512" font-weight="700" text-anchor="start">Concrete</text><path d="M1146 280h140l45 175h-230z" fill="#d3d3cc" stroke="#9a9289" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M1125 370L1308 370" fill="none" stroke="#92938e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="1083" y="506" font-size="20" fill="#1a1512" font-weight="400" text-anchor="start">Cement-based pavement</text><text x="1083" y="550" font-size="19" fill="#625d58" font-weight="400" text-anchor="start">Purpose must be checked.</text><text x="40" y="640" font-size="22" fill="#286864" font-weight="700" text-anchor="start">Ice roads are seasonal, authority-controlled routes; appearance cannot establish ice capacity.</text><text x="38" y="674" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Conceptual teaching illustration · Read the dimensions and conditions in the lesson.</text></svg>