<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Dates tell different stories</title><desc id="desc">Separate the events on the Alaska Highway timeline from unrelated international road milestones.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="720" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">Dates tell different stories</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><text x="40" y="208" font-size="20" fill="#b71923" font-weight="700" text-anchor="start">ALASKA HIGHWAY  /  DISTINCT EVENTS</text><path d="M100 312L1300 312" fill="none" stroke="#b9ada0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><circle cx="130" cy="312" r="14" fill="#b71923"/><text x="130" y="276" font-size="33" fill="#1a1512" font-weight="700" text-anchor="middle">1942</text><text x="130" y="363" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">Pioneer road</text><text x="130" y="393" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">completed</text><circle cx="490" cy="312" r="14" fill="#b71923"/><text x="490" y="276" font-size="33" fill="#1a1512" font-weight="700" text-anchor="middle">1943</text><text x="490" y="363" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">Permanent</text><text x="490" y="393" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">location</text><circle cx="850" cy="312" r="14" fill="#b71923"/><text x="850" y="276" font-size="33" fill="#1a1512" font-weight="700" text-anchor="middle">1946</text><text x="850" y="363" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">Canadian portion</text><text x="850" y="393" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">transferred to DND</text><circle cx="1220" cy="312" r="14" fill="#b71923"/><text x="1220" y="276" font-size="33" fill="#1a1512" font-weight="700" text-anchor="middle">1948</text><text x="1220" y="363" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">Civilian non-military</text><text x="1220" y="393" font-size="20" fill="#1a1512" font-weight="400" text-anchor="middle">use began</text><rect x="38" y="457" width="1324" height="172" rx="12" fill="white" stroke="none"/><text x="65" y="500" font-size="20" fill="#286864" font-weight="700" text-anchor="start">OTHER CONTEXTS — A SEPARATE TIME SCALE</text><text x="65" y="543" font-size="23" fill="#1a1512" font-weight="400" text-anchor="start">312 BCE onward: Via Appia developed in a Roman military, settlement and trade context.</text><text x="65" y="573" font-size="23" fill="#1a1512" font-weight="400" text-anchor="start">1956: U.S. Federal-Aid Highway Act — one major step in the Interstate system.</text><text x="38" y="694" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Based on PSPC (2025), UNESCO (2024) and FHWA historical accounts cited in Chapter 2. Not to time scale.</text></svg>