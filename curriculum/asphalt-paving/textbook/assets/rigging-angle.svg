<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc"><title id="title">Rigging: identify the angle you are reading</title><desc id="desc">The WorkSafeBC Table 15-3 angle is measured from vertical. This picture identifies geometry, not a lift plan or a capacity.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="860" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">Rigging: identify the angle you are reading</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><path d="M701 220v38q0 25-25 25q-25 0-25-25" fill="none" stroke="#68767d" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><circle cx="677" cy="292" r="12" fill="url(#steel)"/><path d="M677 3