<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">A hazard needs a route to reach you</title><desc id="desc">Chemical exposure can occur by inhalation, ingestion, skin absorption or injection. Other hazards have other mechanisms.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="850" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">A hazard needs a route to reach you</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><circle cx="690" cy="269" r="55" fill="#d1b297"/><path d="M638 328q52-22 104 0l46 172-56 12-4 194h-35l-9-148-9 148h-35l-4-194-56-12z" fill="#334b54" stroke="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M644 330l-34 131M738 330l34 131" fill="none" stroke="#ffbc00" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" /><rect x="55" y="194" width="449" height="165" rx="12" fill="white" stroke="none"/><text x="77" y="232" font-size="24" fill="#b71923" font-weight="700" text-anchor="start">INHALATION</text><text x="77" y="276" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Airborne contaminant enters</text><text x="77" y="306" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">through breathing.</text><path d="M608 250L669 266" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="890" y="194" width="449" height="165" rx="12" fill="white" stroke="none"/><text x="912" y="232" font-size="24" fill="#b71923" font-weight="700" text-anchor="start">INGESTION</text><text x="912" y="276" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Contamination reaches the</text><text x="912" y="306" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">mouth, food or drink.</text><path d="M870 270L718 290" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="55" y="454" width="449" height="165" rx="12" fill="white" stroke="none"/><text x="77" y="492" font-size="24" fill="#b71923" font-weight="700" text-anchor="start">ABSORPTION</text><text x="77" y="536" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Some substances pass</text><text x="77" y="566" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">through the skin.</text><path d="M602 519L638 468" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="890" y="454" width="449" height="165" rx="12" fill="white" stroke="none"/><text x="912" y="492" font-size="24" fill="#b71923" font-weight="700" text-anchor="start">INJECTION</text><text x="912" y="536" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Pressurized fluid can enter</text><text x="912" y="566" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">through a small skin wound.</text><path d="M873 521L766 466" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="700" y="755" font-size="23" fill="#286864" font-weight="700" text-anchor="middle">Match the control to the route. Read the product SDS and the task conditions.</text><text x="38" y="824" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Original concept illustration · A small injection wound can be a medical emergency; report and obtain emergency care promptly.</text></svg>