<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Follow the whole service, not a single claim</title><desc id="desc">Compare material production, transport, construction, maintenance and end-of-life for an equivalent pavement service.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="720" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">Follow the whole service, not a single claim</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><rect x="40" y="244" width="242" height="223" rx="12" fill="white" stroke="none"/><circle cx="79" cy="282" r="21" fill="#b71923"/><text x="79" y="289" font-size="20" fill="white" font-weight="700" text-anchor="middle">1</text><text x="60" y="343" font-size="21" fill="#1a1512" font-weight="700" text-anchor="start">MATERIALS</text><text x="60" y="389" font-size="17" fill="#1a1512" font-weight="400" text-anchor="start">Extraction + production</text><path d="M286 353L306 353" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="311" y="244" width="242" height="223" rx="12" fill="white" stroke="none"/><circle cx="350" cy="282" r="21" fill="#b71923"/><text x="350" y="289" font-size="20" fill="white" font-weight="700" text-anchor="middle">2</text><text x="331" y="343" font-size="21" fill="#1a1512" font-weight="700" text-anchor="start">TRANSPORT</text><text x="331" y="389" font-size="17" fill="#1a1512" font-weight="400" text-anchor="start">Distances + loads</text><path d="M557 353L577 353" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="582" y="244" width="242" height="223" rx="12" fill="white" stroke="none"/><circle cx="621" cy="282" r="21" fill="#b71923"/><text x="621" y="289" font-size="20" fill="white" font-weight="700" text-anchor="middle">3</text><text x="602" y="343" font-size="21" fill="#1a1512" font-weight="700" text-anchor="start">CONSTRUCTION</text><text x="602" y="389" font-size="17" fill="#1a1512" font-weight="400" text-anchor="start">Equipment + placement</text><path d="M828 353L848 353" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="853" y="244" width="242" height="223" rx="12" fill="white" stroke="none"/><circle cx="892" cy="282" r="21" fill="#b71923"/><text x="892" y="289" font-size="20" fill="white" font-weight="700" text-anchor="middle">4</text><text x="873" y="343" font-size="21" fill="#1a1512" font-weight="700" text-anchor="start">SERVICE LIFE</text><text x="873" y="389" font-size="17" fill="#1a1512" font-weight="400" text-anchor="start">Maintenance + use</text><path d="M1099 353L1119 353" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1124" y="244" width="242" height="223" rx="12" fill="white" stroke="none"/><circle cx="1163" cy="282" r="21" fill="#b71923"/><text x="1163" y="289" font-size="20" fill="white" font-weight="700" text-anchor="middle">5</text><text x="1144" y="343" font-size="21" fill="#1a1512" font-weight="700" text-anchor="start">END-OF-LIFE</text><text x="1144" y="389" font-size="17" fill="#1a1512" font-weight="400" text-anchor="start">Recovery + disposal</text><path d="M70 492v55H1325v-55" fill="none" stroke="#286864" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="700" y="597" font-size="23" fill="#286864" font-weight="700" text-anchor="middle">Same required function • same comparison period • stated quantities and boundaries</text><text x="38" y="694" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Original comparison framework · A production-only percentage does not establish a whole-road advantage.</text></svg>