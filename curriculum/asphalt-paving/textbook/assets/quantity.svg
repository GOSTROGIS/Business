<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc"><title id="title">Keep each unit attached to its quantity</title><desc id="desc">A fictional rectangular layer is calculated with 50 metres length, 6 metres width and 40 millimetres thickness.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="730" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">Keep each unit attached to its quantity</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><path d="M70 335l330-98 226 99-328 107z" fill="url(#asphalt)" stroke="#1a1512" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M70 335v33l228 109v-34z" fill="#686e6e" stroke="#1a1512" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M298 443v34l328-107v-34z" fill="#242829" stroke="#1a1512" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="167" y="519" font-size="24" fill="#1a1512" font-weight="700" text-anchor="start">Length × width × thickness</text><text x="60" y="268" font-size="27" fill="#b71923" font-weight="700" text-anchor="start">50 m</text><text x="530" y="274" font-size="27" fill="#b71923" font-weight="700" text-anchor="start">6 m</text><path d="M636 337L680 307" fill="none" stroke="#b71923" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="690" y="309" font-size="26" fill="#b71923" font-weight="700" text-anchor="start">40 mm = 0.040 m</text><text x="735" y="365" font-size="16" fill="#286864" font-weight="700" text-anchor="start">AREA</text><text x="735" y="392" font-size="26" fill="#1a1512" font-weight="400" text-anchor="start">50 m × 6 m = 300 m²</text><text x="735" y="437" font-size="16" fill="#286864" font-weight="700" text-anchor="start">VOLUME</text><text x="735" y="464" font-size="26" fill="#1a1512" font-weight="400" text-anchor="start">300 m² × 0.040 m = 12 m³</text><text x="735" y="509" font-size="16" fill="#286864" font-weight="700" text-anchor="start">MODEL MASS</text><text x="735" y="536" font-size="26" fill="#1a1512" font-weight="400" text-anchor="start">12 m³ × 2.00 t/m³ = 24.00 t</text><rect x="40" y="590" width="1320" height="70" rx="12" fill="white" stroke="none"/><text x="65" y="634" font-size="23" fill="#1a1512" font-weight="400" text-anchor="start">2.00 t/m³ is an invented teaching factor. It is not a field density or an acceptance value.</text><text x="38" y="704" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Original worked diagram · Dimensions exaggerated · No waste, tapers or compaction allowance is included in this model.</text></svg>