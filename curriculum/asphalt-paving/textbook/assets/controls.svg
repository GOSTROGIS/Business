<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Control the exposure before it reaches a person</title><desc id="desc">Assess the task, eliminate or reduce the hazard, check the controls and reassess when conditions change.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="780" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">Control the exposure before it reaches a person</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><rect x="40" y="232" width="300" height="350" rx="12" fill="#286864" stroke="none"/><text x="60" y="276" font-size="24" fill="#ffdc75" font-weight="700" text-anchor="start">01</text><text x="60" y="325" font-size="19" fill="white" font-weight="700" text-anchor="start">REMOVE / CHANGE</text><text x="60" y="369" font-size="20" fill="white" font-weight="400" text-anchor="start">Eliminate the task hazard</text><text x="60" y="399" font-size="20" fill="white" font-weight="400" text-anchor="start">or use a safer alternative.</text><rect x="380" y="277" width="300" height="305" rx="12" fill="#477975" stroke="none"/><text x="400" y="321" font-size="24" fill="#ffdc75" font-weight="700" text-anchor="start">02</text><text x="400" y="370" font-size="19" fill="white" font-weight="700" text-anchor="start">CONTROL AT SOURCE</text><text x="400" y="414" font-size="20" fill="white" font-weight="400" text-anchor="start">Engineering measures</text><text x="400" y="444" font-size="20" fill="white" font-weight="400" text-anchor="start">contain or separate it.</text><rect x="720" y="322" width="300" height="260" rx="12" fill="#796c52" stroke="none"/><text x="740" y="366" font-size="24" fill="#ffdc75" font-weight="700" text-anchor="start">03</text><text x="740" y="415" font-size="19" fill="white" font-weight="700" text-anchor="start">ORGANIZE THE WORK</text><text x="740" y="459" font-size="20" fill="white" font-weight="400" text-anchor="start">Procedure, timing, access</text><text x="740" y="489" font-size="20" fill="white" font-weight="400" text-anchor="start">and training support control.</text><rect x="1060" y="367" width="300" height="215" rx="12" fill="#8b3d3b" stroke="none"/><text x="1080" y="411" font-size="24" fill="#ffdc75" font-weight="700" text-anchor="start">04</text><text x="1080" y="460" font-size="19" fill="white" font-weight="700" text-anchor="start">PROTECT THE PERSON</text><text x="1080" y="504" font-size="20" fill="white" font-weight="400" text-anchor="start">PPE chosen for the hazard</text><text x="1080" y="534" font-size="20" fill="white" font-weight="400" text-anchor="start">and its remaining exposure.</text><path d="M80 635H1310" fill="none" stroke="#b71923" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="695" y="684" font-size="27" fill="#1a1512" font-weight="700" text-anchor="middle">Check effectiveness → record → reassess after a change</text><text x="38" y="754" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Conceptual sequence based on WorkSafeBC OHS Regulation § 5.55 and hazard-assessment principles. Use the applicable clauses.</text></svg>