<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Plan the people routes as carefully as the work</title><desc id="desc">A conceptual work-zone plan shows a public route and work area separated with a designed access point.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="800" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">Plan the people routes as carefully as the work</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><rect x="45" y="205" width="920" height="490" rx="12" fill="#deddd3" stroke="none"/><rect x="85" y="255" width="245" height="388" rx="12" fill="#d7e9e5" stroke="none"/><path d="M210 610V280" fill="none" stroke="#286864" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M210 285l-15 20m15-20 15 20" fill="none" stroke="#286864" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="105" y="237" font-size="21" fill="#286864" font-weight="700" text-anchor="start">PUBLIC ROUTE</text><path d="M387 223V654" fill="none" stroke="#b71923" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="408" y="246" font-size="21" fill="#b71923" font-weight="700" text-anchor="start">Designed separation</text><g transform="translate(590 330) scale(1)"><rect x="45" y="73" width="160" height="34" rx="17" fill="#1a1512" stroke="none"/><circle cx="65" cy="90" r="11" fill="#98a1a2"/><circle cx="185" cy="90" r="11" fill="#98a1a2"/><path d="M35 35h100l25 41H44z" fill="url(#gold)" stroke="#1a1512" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M3 26l27 42h55l18-42z" fill="#ffbc00" stroke="#1a1512" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="137" y="35" width="50" height="40" rx="3" fill="#ffbc00" stroke="none"/><path d="M148 35L148 1" fill="none" stroke="#1a1512" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M183 35L183 1" fill="none" stroke="#1a1512" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><rect x="126" y="-5" width="76" height="8" rx="3" fill="#1a1512" stroke="none"/><path d="M187 65l43 17h46v20h-48l-31-14z" fill="url(#steel)" stroke="#1a1512" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(620 530) scale(0.8)"><rect x="40" y="34" width="145" height="40" rx="8" fill="url(#gold)" stroke="none"/><path d="M85 35V-15h66v50" fill="none" stroke="#1a1512" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><rect x="73" y="-24" width="93" height="9" rx="3" fill="#1a1512" stroke="none"/><rect x="85" y="-9" width="65" height="40" rx="3" fill="#9cb7bc" stroke="none"/><circle cx="58" cy="83" r="33" fill="#1a1512"/><circle cx="58" cy="83" r="17.490000000000002" fill="url(#steel)"/><circle cx="58" cy="83" r="5" fill="#b71923"/><rect x="138" y="59" width="72" height="60" rx="17" fill="url(#steel)" stroke="none"/><path d="M158 68v43M192 68v43" fill="none" stroke="#708087" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></g><circle cx="200" cy="420" r="14" fill="#286864"/><path d="M200 440v45m-20-25 20-15 20 15m-20 25-15 25m15-25 15 25" fill="none" stroke="#286864" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><text x="1003" y="258" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">ASK BEFORE SETUP</text><text x="1003" y="292" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">Where can people go?</text><text x="1003" y="326" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">Is the route accessible?</text><text x="1003" y="360" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">Who controls access?</text><text x="1003" y="394" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">Can drivers see workers?</text><text x="1003" y="428" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">How is help reached?</text><text x="1003" y="462" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start"></text><text x="1003" y="496" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">Use the approved traffic</text><text x="1003" y="530" font-size="21" fill="#1a1512" font-weight="400" text-anchor="start">plan and site procedure.</text><text x="45" y="738" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">A cone or drawn line does not establish adequate separation. The site plan must address the actual hazards.</text><text x="38" y="774" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Original fictional scene · No traffic-control spacing, clearance or protective-barrier specification is implied.</text></svg>