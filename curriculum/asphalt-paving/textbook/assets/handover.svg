<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">A handover is complete when it is understood</title><desc id="desc">Read back the location, task, limits and change. Record unresolved questions and the person responsible.</desc><defs><linearGradient id="steel" x2="0.9" y2="1"><stop stop-color="#e1e6e4"/><stop offset=".45" stop-color="#89969b"/><stop offset="1" stop-color="#c1ccce"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#ffdc6c"/><stop offset="1" stop-color="#d49312"/></linearGradient><pattern id="stone" width="30" height="24" patternUnits="userSpaceOnUse"><rect width="30" height="24" fill="#d6c9b5"/><path d="M2 6l10-3 5 8-9 6zM20 17l6-5 3 8z" fill="#a7957a"/></pattern><pattern id="asphalt" width="18" height="16" patternUnits="userSpaceOnUse"><rect width="18" height="16" fill="#3f4445"/><path d="M2 3l4 2M12 11l3-2" stroke="#747a79" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b71923"/></marker></defs><style>text{font-family:Arial,sans-serif} .dash{stroke-dasharray:10 8}</style><rect x="0" y="0" width="1400" height="720" rx="0" fill="#f7f4f1" stroke="none"/><rect x="0" y="0" width="1400" height="147" rx="0" fill="#1a1512" stroke="none"/><text x="38" y="43" font-size="16" fill="#ffbc00" font-weight="700" text-anchor="start">ACCESS IS4S  /  ASPHALT STUDY TEXTBOOK</text><text x="38" y="103" font-size="40" fill="white" font-weight="700" text-anchor="start">A handover is complete when it is understood</text><rect x="0" y="147" width="1400" height="5" rx="0" fill="#ffbc00" stroke="none"/><circle cx="100" cy="235" r="34" fill="#b71923"/><text x="100" y="244" font-size="23" fill="white" font-weight="700" text-anchor="middle">01</text><text x="55" y="309" font-size="24" fill="#1a1512" font-weight="700" text-anchor="start">STATE THE WORK</text><circle cx="563" cy="235" r="34" fill="#b71923"/><text x="563" y="244" font-size="23" fill="white" font-weight="700" text-anchor="middle">02</text><text x="518" y="309" font-size="24" fill="#1a1512" font-weight="700" text-anchor="start">READ IT BACK</text><circle cx="1025" cy="235" r="34" fill="#b71923"/><text x="1025" y="244" font-size="23" fill="white" font-weight="700" text-anchor="middle">03</text><text x="980" y="309" font-size="24" fill="#1a1512" font-weight="700" text-anchor="start">CONFIRM / CORRECT</text><text x="55" y="364" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Location + document version</text><text x="55" y="394" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Task + people involved</text><text x="55" y="424" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Hazards + agreed controls</text><text x="518" y="364" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Say it in your own words.</text><text x="518" y="394" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Point to the same feature.</text><text x="518" y="424" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Name what is uncertain.</text><text x="980" y="364" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Resolve the mismatch.</text><text x="980" y="394" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Agree the next action.</text><text x="980" y="424" font-size="22" fill="#1a1512" font-weight="400" text-anchor="start">Keep a usable record.</text><path d="M367 340L480 340" fill="none" stroke="#b71923" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M837 340L945 340" fill="none" stroke="#b71923" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M1160 470V540H185V470" fill="none" stroke="#286864" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="700" y="582" font-size="25" fill="#286864" font-weight="700" text-anchor="middle">A changed condition starts a new check.</text><text x="38" y="694" font-size="17" fill="#625d58" font-weight="400" text-anchor="start">Communication + Collaboration + Writing · An unheard instruction is not a shared plan.</text></svg>