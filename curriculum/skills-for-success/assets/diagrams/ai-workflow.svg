<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">A clear brief becomes checked work</title><desc id="desc">A six-stage workflow connects brief, source, create, audit, verify and handover. A return arrow shows that findings lead to revision.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5dfd2" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1000" height="650" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="650" rx="0" fill="url(#grid)"/><rect x="0" y="0" width="1000" height="112" rx="0" fill="#242827"/><text x="36" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  DIGITAL + AI</text><text x="36" y="80" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">A clear brief becomes checked work</text><rect x="36" y="145" width="274" height="170" rx="12" fill="white"/><text x="56" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">01</text><text x="101" y="182" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#242827">BRIEF</text><text x="56" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Purpose + audience</text><text x="56" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Output + constraints</text><path d="M318 225h36" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><rect x="363" y="145" width="274" height="170" rx="12" fill="white"/><text x="383" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">02</text><text x="428" y="182" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#242827">SOURCE</text><text x="383" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Named files + versions</text><text x="383" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Facts + permissions</text><path d="M645 225h36" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="145" width="274" height="170" rx="12" fill="white"/><text x="710" y="182" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">03</text><text x="755" y="182" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#242827">CREATE</text><text x="710" y="236" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Editable master</text><text x="710" y="263" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Actual saved output</text><rect x="36" y="360" width="274" height="170" rx="12" fill="white"/><text x="56" y="397" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">04</text><text x="101" y="397" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#242827">AUDIT</text><text x="56" y="451" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Claim + location</text><text x="56" y="478" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Evidence + correction</text><path d="M318 440h36" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><rect x="363" y="360" width="274" height="170" rx="12" fill="white"/><text x="383" y="397" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">05</text><text x="428" y="397" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#242827">VERIFY</text><text x="383" y="451" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Open + recalculate</text><text x="383" y="478" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Inspect + compare</text><path d="M645 440h36" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="360" width="274" height="170" rx="12" fill="white"/><text x="710" y="397" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">06</text><text x="755" y="397" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#242827">HAND OVER</text><text x="710" y="451" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Version + change log</text><text x="710" y="478" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#535c58">Limits + next action</text><path d="M900 325V340H173V350" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><path d="M825 540V570H500V540" fill="none" stroke="#a93332" stroke-width="2"/><text x="445" y="602" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#a93332">Revise when a check finds a problem.</text><text x="36" y="628" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#535c58">Original ACCESS IS4S diagram · A second AI opinion helps review; source evidence establishes a fact.</text></svg>
