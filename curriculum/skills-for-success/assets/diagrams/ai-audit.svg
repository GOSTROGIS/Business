<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">An audit needs a location and evidence</title><desc id="desc">A fictional incorrect notice is compared with the confirmed event brief. Findings identify count, room, cost and unsupported services.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5dfd2" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1000" height="660" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="660" rx="0" fill="url(#grid)"/><rect x="0" y="0" width="1000" height="112" rx="0" fill="#242827"/><text x="36" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  DIGITAL + AI</text><text x="36" y="80" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">An audit needs a location and evidence</text><rect x="36" y="145" width="420" height="220" rx="12" fill="white"/><rect x="514" y="145" width="450" height="220" rx="12" fill="white"/><text x="58" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#a93332">SIMULATED DRAFT</text><text x="58" y="225" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#535c58">30 participants · Birch Room</text><text x="58" y="252" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#535c58">“Budget: $282”</text><text x="58" y="279" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#535c58">“Transport and childcare included”</text><text x="536" y="182" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#276b66">CONFIRMED CASE</text><text x="536" y="225" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#535c58">24 participants · Cedar Room</text><text x="536" y="252" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#535c58">$156 + $78 + $38 = $272</text><text x="536" y="279" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#535c58">No transport or childcare confirmed</text><path d="M466 252h36" fill="none" stroke="#276b66" stroke-width="3" marker-end="url(#arrow)"/><rect x="36" y="395" width="928" height="174" rx="12" fill="#242827"/><text x="58" y="431" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#d5ad62">FINDING  →  EVIDENCE  →  CORRECTION  →  RECHECK</text><text x="58" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="white">Location: notice opening.  Claim: 30 participants.</text><text x="58" y="504" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="white">Evidence: confirmed brief says 24.  Correction: use 24.</text><text x="58" y="535" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="white">Recheck the DOCX, PDF and HTML after revision.</text><text x="36" y="638" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#535c58">Original ACCESS IS4S diagram · Correct facts stay; unsupported promises are removed.</text></svg>
