<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">A connection needs enough time.</title><desc id="desc">A proportional timetable shows B1 arriving at Market at 08:25. The required connection allowance is five minutes. B2 leaves at 08:28, giving only three minutes; B3 leaves at 08:32, giving seven. The earliest usable departure is 08:30. B1 plus B3 reaches Northside at 08:47; five minutes to reception gives 08:52, before the 08:55 deadline.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="870" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">READING / TIMETABLE + CONDITION</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">A connection needs enough time.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Read the minimum allowance before choosing a departure.</text><rect x="48" y="225" width="340" height="63" rx="10" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="218" y="266" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">MINIMUM: 5 MINUTES</text><text x="48" y="347" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">B1 arrives at Market</text><text x="48" y="397" font-size="48" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">08:25</text><rect 