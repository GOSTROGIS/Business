<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Build a cause map from evidence.</title><desc id="desc">A fishbone cause map separates observations from dashed hypotheses. File access evidence E1 says v1 remains beside v3 in a shared folder. Instruction evidence E4 says prepare twenty-four packets without a version or named final checker. Material evidence E3 places old and current stacks adjacent and maps on another shelf. Hypotheses ask about wrong selection, mixed or omitted items and undetected errors. Fifteen of seventy-two packets need correction: ten old sheets and five missing maps. The counts do not identify a cause.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1060" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">PROBLEM SOLVING / EVIDENCE + HYPOTHESES</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Build a cause map from evidence.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Fictional packet case • observations support questions, not blame.</text><line x1="48" y1="535" x2="884" y2="535" stroke="#1A1512" stroke-width="5" marker-end="url(#arrow)"/><rect x="910" y="427" width="242" height="216" rx="15" fill="#1A1512" stroke="none" stroke-width="1" /><text x="1031" y="480" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">PACKETS</text><text x="1031" y="524" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">NEED</text><text x="1031" y="568" font-size="30" font-weight="700" fill="#FFBC00" text-anchor="middle" letter-spacing="0">CORRECTION</text><path d="M228 438 L344 535" stroke="#1A1512" stroke-width="3" fill="none"/><text x="48" y="242" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">FILE ACCESS</text><text x="48" y="291" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">v1 remains beside v3</text><text x="48" y="328" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">in a shared folder. (E1)</text><rect x="48" y="351" width="387" height="55" rx="7" fill="#FFFFFF" stroke="#D2181F" stroke-width="2" stroke-dasharray="8 6"/><text x="65" y="388" font-size="25" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Wrong file selected?</text><path d="M666 438 L774 535" stroke="#1A1512" stroke-width="3" fill="none"/><text x="486" y="242" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">INSTRUCTIONS</text><text x="486" y="291" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">“Prepare 24 packets.”</text><text x="486" y="328" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">No version stated. (E4)</text><rect x="486" y="351" width="387" height="55" rx="7" fill="#FFFFFF" stroke="#D2181F" stroke-width="2" stroke-dasharray="8 6"/><text x="503" y="388" font-size="25" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Wrong version used?</text><path d="M228 622 L344 535" stroke="#1A1512" stroke-width="3" fill="none"/><text x="48" y="674" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">MATERIALS / LAYOUT</text><text x="48" y="723" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Old/current stacks adjacent;</text><text x="48" y="760" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">maps on another shelf. (E3)</text><rect x="48" y="783" width="387" height="55" rx="7" fill="#FFFFFF" stroke="#D2181F" stroke-width="2" stroke-dasharray="8 6"/><text x="65" y="820" font-size="25" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Items mixed or omitted?</text><path d="M666 622 L774 535" stroke="#1A1512" stroke-width="3" fill="none"/><text x="486" y="674" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">FINAL CHECK</text><text x="486" y="723" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">No final checker named.</text><text x="486" y="760" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Instruction record: E4</text><rect x="486" y="783" width="387" height="55" rx="7" fill="#FFFFFF" stroke="#D2181F" stroke-width="2" stroke-dasharray="8 6"/><text x="503" y="820" font-size="25" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Errors leave undetected?</text><text x="910" y="717" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">15 of 72 packets</text><text x="910" y="761" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">10 old sheets</text><text x="910" y="799" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">5 missing maps</text><line x1="48" y1="936" x2="1152" y2="936" stroke="#D8CBC1" stroke-width="2"/><text x="48" y="979" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Solid statement = supplied observation</text><text x="48" y="1020" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Dashed question = hypothesis to test. The counts do not identify a cause.</text></g></svg>