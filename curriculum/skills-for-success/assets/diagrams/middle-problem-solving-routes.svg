rx="0" fill="#FFBC00" stroke="none" stroke-width="3"/><path d="M -28 19 h 56 l -5 6 h -46 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(810 286) scale(0.8)"><rect x="-22" y="-15" width="44" height="30" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><rect x="-17" y="-10" width="34" height="20" rx="0" fill="#FFBC00" stroke="none" stroke-width="3"/><path d="M -28 19 h 56 l -5 6 h -46 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="73" y="340" width="80.0" height="46" rx="3" fill="#E9E1D9" stroke="#1A1512" stroke-width="2"/><text x="113.0" y="369" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle">5</text><rect x="153.0" y="340" width="16.0" height="46" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><rect x="169.0" y="340" width="80.0" height="46" rx="3" fill="#E9E1D9" stroke="#1A1512" stroke-width="2"/><text x="209.0" y="369" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle">5</text><text x="73" y="417" font-size="18" font-weight="700" fill="#1A1512" text-anchor="start">09:00</text><text x="249.0" y="417" font-size="18" font-weight="700" fill="#1A1512" text-anchor="end">09:55</text><text x="73" y="327" font-size="16" font-weight="400" fill="#6B625C" text-anchor="start">Learners in each group</text><text x="73" y="446" font-size="22" font-weight="700" fill="#1A1512" text-anchor="start">25 + 5 + 25 = 55 min</text><circle cx="73" cy="475" r="12" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><path d="M 65 474.5 l 4.8 4.8 l 10.5 -12.0" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="95" y="482" font-size="19" font-weight="400" fill="#1A1512" text-anchor="start">Everyone finishes before 10:00</text><rect x="550" y="340" width="80.0" height="46" rx="3" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="590.0" y="369" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle">3</text><rect x="630.0" y="340" width="16.0" height="46" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><rect x="646.0" y="340" width="80.0" height="46" rx="3" fill="#E9E1D9" stroke="#1A1512" stroke-width="2"/><text x="686.0" y="369" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle">3</text><rect x="726.0" y="340" width="16.0" height="46" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><rect x="742.0" y="340" width="80.0" height="46" rx="3" fill="#E9E1D9" stroke="#1A1512" stroke-width="2"/><text x="782.0" y="369" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle">3</text><rect x="822.0" y="340" width="16.0" height="46" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><rect x="838.0" y="340" width="80.0" height="46" rx="3" fill="#E9E1D9" stroke="#1A1512" stroke-width="2"/><text x="878.0" y="369" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle">1</text><text x="550" y="417" font-size="18" font-weight="700" fill="#1A1512" text-anchor="start">09:00</text><text x="918.0" y="417" font-size="18" font-weight="700" fill="#1A1512" text-anchor="end">10:55</text><text x="550" y="327" font-size="16" font-weight="400" fill="#6B625C" text-anchor="start">Learners in each group</text><text x="550" y="446" font-size="22" font-weight="700" fill="#1A1512" text-anchor="start">4 × 25 + 3 × 5 = 115 min</text><circle cx="550" cy="475" r="12" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><path d="M 542 474.5 l 4.8 4.8 l 10.5 -12.0" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="572" y="482" font-size="19" font-weight="400" fill="#1A1512" text-anchor="start">First three finish at 09:25</text><line x1="500" y1="221" x2="500" y2="495" stroke="#C6BAB0" stroke-width="1.5" /><rect x="40" y="515" width="920" height="93" rx="10" fill="#EEE7E0" stroke="none" stroke-width="3"/><text x="62" y="544" font-size="15" font-weight="700" fill="#6B625C" text-anchor="start">CHECK THE OTHER ROUTES</text><text x="62" y="574" font-size="18" font-weight="400" fill="#1A1512" text-anchor="start">Later room: $60; starts after three must leave.</text><text x="62" y="595" font-size="18" font-weight="400" fill="#1A1512" text-anchor="start">Paper only: no individual digital turn.</text><text x="960" y="635" font-size="15" font-weight="400" fill="#6B625C" text-anchor="end">Fictional classroom planning case · narrow timeline gaps = 5-minute resets</text></g></svg>