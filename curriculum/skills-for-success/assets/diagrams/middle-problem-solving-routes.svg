<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc"><title id="title">Ten learners. Two workable schedules.</title><desc id="desc">Two proportional schedules compare tool turns for ten learners. Borrowing two devices makes five available: two groups of five take twenty-five minutes each plus a five-minute change, ending at 09:55 for $40, with confirmation by 08:30. Using three available devices makes groups of three, three, three and one, taking 115 minutes to 10:55 for no extra cost. The first three finish at 09:25. The maximum extra cost is $50; a later $60 room and paper-only work fail named constraints.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="990" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">PROBLEM SOLVING / TWO ROUTES</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Ten learners. Two workable schedules.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">25 minutes each · 5 minutes between groups · $50 maximum extra cost</text><text x="48" y="250" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">BORROW 2 → USE 5</text><text x="48" y="289" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">$40 · confirm by 08:30</text><text x="48" y="353" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">$40</text><rect x="245" y="318" width="180.0" height="72" rx="6" fill="#1A1512" stroke="#1A1512" stroke-width="2" /><text x="335.0" y="364" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">5</text><rect x="425.0" y="318" width="36.0" height="72" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="1" /><rect x="461.0" y="318" width="180.0" height="72" rx="6" fill="#1A1512" stroke="#1A1512" stroke-width="2" /><text x="551.0" y="364" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">5</text><text x="245" y="430" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">09:00</text><text x="641.0" y="430" font-size="24" font-weight="700" fill="#1A1512" text-anchor="end" letter-spacing="0">09:55</text><text x="48" y="471" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">25 + 5 + 25 = 55 min · everyone finishes before 10:00</text><text x="48" y="515" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">USE 3 → EXTEND</text><text x="48" y="554" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">$0 extra · early departures go first</text><text x="48" y="618" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">$0</text><rect x="245" y="583" width="180.0" height="72" rx="6" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="335.0" y="629" font-size="34" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><rect x="425.0" y="583" width="36.0" height="72" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="1" /><rect x="461.0" y="583" width="180.0" height="72" rx="6" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="551.0" y="629" font-size="34" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><rect x="641.0" y="583" width="36.0" height="72" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="1" /><rect x="677.0" y="583" width="180.0" height="72" rx="6" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="767.0" y="629" font-size="34" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><rect x="857.0" y="583" width="36.0" height="72" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="1" /><rect x="893.0" y="583" width="180.0" height="72" rx="6" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="983.0" y="629" font-size="34" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">1</text><text x="245" y="695" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">09:00</text><text x="1073.0" y="695" font-size="24" font-weight="700" fill="#1A1512" text-anchor="end" letter-spacing="0">10:55</text><text x="48" y="736" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">4 × 25 + 3 × 5 = 115 min · first three finish at 09:25</text><rect x="48" y="790" width="1104" height="138" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><text x="78" y="833" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">CHECK THE OTHER ROUTES</text><text x="78" y="872" font-size="27" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Later room: $60; starts after three must leave.</text><text x="78" y="908" font-size="27" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Paper only: no individual digital turn.</text><text x="48" y="970" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Numbers inside blocks are learners per group. Both rows use the same time scale.</text></g></svg>