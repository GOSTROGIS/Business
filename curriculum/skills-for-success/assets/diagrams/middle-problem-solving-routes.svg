<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Two workable device schedules</title><desc id="desc">Ten learners each need 25 minutes using a device, with 5 minutes between groups and no more than $50 extra cost. Borrowing two devices for $40, confirmed by 08:30, restores five devices. Two groups of five finish at 09:55. Three existing devices need four groups of three, three, three and one: 115 minutes, ending at 10:55. Put the three learners leaving at 10:00 in the first group; they finish at 09:25. Timeline group segments use the same time scale. The $60 later room exceeds the budget and starts after three learners must leave; paper alone does not provide a digital turn.</desc><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1A1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D2181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="650" fill="#F7F4F1"/><text x="40" y="35" font-size="14" font-weight="700" fill="#6B625C" text-anchor="start">PROBLEM SOLVING · CASE A</text><rect x="40" y="48" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="3"/><text x="40" y="86" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start">Two workable routes to ten individual turns</text><text x="40" y="122" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">25 minutes each  /  5 minutes between groups  /  $50 maximum</text><path d="M 500 146 V 164 H 260 V 186" fill="none" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 500 164 H 745 V 186" fill="none" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="500" cy="146" r="5" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><text x="250" y="218" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">BORROW 2 → USE 5</text><text x="750" y="218" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">USE 3 → EXTEND THE ROTATION</text><text x="250" y="248" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">$40 · confirm by 08:30</text><text x="750" y="248" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">$0 extra · early departures go first</text><g transform="translate(130 286) scale(0.8)"><rect x="-22" y="-15" width="44" height="30" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><rect x="-17" y="-10" width="34" height="20" rx="0" fill="#FFBC00" stroke="none" stroke-width="3"/><path d="M -28 19 h 56 l -5 6 h -46 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(190 286) scale(0.8)"><rect x="-22" y="-15" width="44" height="30" rx="3" fill="#F7F4F1" stroke="#1A1512