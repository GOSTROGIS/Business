<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Numeracy</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. From a useful question to a checked result Six connected components: Identify the task; Find the information; Connect the facts; Calculate or measure; Interpret and evaluate; Share the result. Recheck the question or inputs. A useful result answers the original question.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">03 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Numeracy</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">From a useful question to a checked result</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><g transform="translate(86,95) scale(1) rotate(-7)"><path d="M0 0 H187 L225 38 V280 H0 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M187 0 V38 H225" stroke="#1A1512" stroke-width="3" fill="none"/></g><text x="105" y="158" font-size=