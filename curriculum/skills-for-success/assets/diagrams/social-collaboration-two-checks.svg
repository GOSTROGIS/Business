<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc"><title id="title">Match the check to the issue.</title><desc id="desc">Two side-by-side checks distinguish a source fact from a design choice. The equipment statement is checked against the source: a paver places and rollers compact. A flow diagram and question-and-answer layout are both tested with a reader asking who owns the road. Different issues require different evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="930" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">COLLABORATION / THE DRAFT DISAGREEMENT</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Match the check to the issue.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A source fact and a design choice need different kinds of evidence.</text><rect x="48" y="238" width="528" height="510" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="238" width="528" height="75" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="77" y="287" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCE FACT</text><rect x="624" y="238" width="528" height="510" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="624" y="238" width="528" height="75" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="653" y="287" font-size="29" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">DESIGN CHOICE</text><text x="77" y="365" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Read the source</text><text x="77" y="433" font-size="35" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Paver → places</text><text x="77" y="491" font-size="35" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Rollers → compact</text><path d="M83 577 L103 597 L139 551" stroke="#D2181F" stroke-width="7" fill="none"/><text x="163" y="591" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Correct the sentence</text><text x="653" y="365" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Try both layouts</text><rect x="653" y="399" width="206" height="169" rx="7" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="756" y="604" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Flow diagram</text><rect x="700" y="425" width="112" height="28" rx="3" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="700" y="471" width="112" height="28" rx="3" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="700" y="517" width="112" height="28" rx="3" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><line x1="756" y1="453" x2="756" y2="469" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><line x1="756" y1="499" x2="756" y2="515" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><rect x="890" y="399" width="206" height="169" rx="7" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="993" y="604" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Q + A</text><text x="909" y="435" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Q</text><line x1="949" y1="428" x2="1073" y2="428" stroke="#1A1512" stroke-width="3"/><text x="909" y="481" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Q</text><line x1="949" y1="474" x2="1073" y2="474" stroke="#1A1512" stroke-width="3"/><text x="909" y="527" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Q</text><line x1="949" y1="520" x2="1073" y2="520" stroke="#1A1512" stroke-width="3"/><text x="653" y="684" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Ask a reader:</text><text x="653" y="724" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">“Who owns the road?”</text><text x="48" y="831" font-size="37" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Two issues. Two useful checks.</text><text x="48" y="885" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use evidence to correct a fact; use a reader test to compare usable designs.</text></g></svg>