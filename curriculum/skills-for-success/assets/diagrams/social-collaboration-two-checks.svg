<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc"><title id="title">Two checks for the collaboration draft</title><desc id="desc">The fictional draft has two issues. Check the source to correct the sentence: a paver places the mixture and rollers compact it. For the design choice, try a flow diagram and a question-and-answer layout with the reader question, Who owns the road?</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1A1512" stroke-opacity=".12" stroke-width="3"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#F7F4F1" stroke="none" stroke-width="2" /><rect x="40" y="35" width="7" height="48" rx="0" fill="#D2181F" stroke="none" stroke-width="2" /><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start" letter-spacing="2">COLLABORATION / WORKED EXAMPLE</text><text x="65" y="90" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start" >Two issues. Two useful checks.</text><text x="500" y="144" font-size="20" fill="#1A1512" font-weight="700" text-anchor="middle" >THE DRAFT DISAGREEMENT</text><path d="M500 157 V180 H260 V208" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#arrow-red)"/><path d="M500 180 H744 V208" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="219" width="446" height="275" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><rect x="514" y="219" width="446" height="275" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><text x="68" y="254" font-size="20" fill="#D2181F" font-weight="700" text-anchor="start" >SOURCE FACT</text><text x="542" y="254" font-size="20" fill="#1A1512" font-weight="700" text-anchor="start" >DESIGN CHOICE</text><path d="M70 282 H146 L162 298 V396 H70 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M146 282 V298 H162" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><line x1="84" y1="312" x2="145" y2="312" stroke="#73675E" stroke-width="2" /><line x1="84" y1="324" x2="145" y2="324" stroke="#73675E" stroke-width="2" /><line x1="84" y1="336" x2="133" y2="336" stroke="#73675E" stroke-width="2" /><text x="187" y="304" font-size="25" fill="#1A1512" font-weight="700" text-anchor="start" >Read the source</text><text x="187" y="345" font-size="25" fill="#1A1512" font-weight="400" text-anchor="start" >Paver → places</text><text x="187" y="380" font-size="25" fill="#1A1512" font-weight="400" text-anchor="start" >Rollers → compact</text><line x1="116" y1="409" x2="116" y2="446" stroke="#D2181F" stroke-width="3" marker-end="url(#arrow-red)"/><text x="151" y="450" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >Correct the sentence</text><rect x="544" y="279" width="137" height="116" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2" /><rect x="701" y="279" width="137" height="116" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2" /><rect x="562" y="296" width="99" height="19" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.5" /><line x1="611" y1="316" x2="611" y2="327" stroke="#1A1512" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="562" y="330" width="99" height="19" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><line x1="611" y1="350" x2="611" y2="361" stroke="#1A1512" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="562" y="364" width="99" height="19" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><text x="714" y="305" font-size="12" fill="#1A1512" font-weight="700" text-anchor="start" >Q</text><line x1="733" y1="298" x2="822" y2="298" stroke="#73675E" stroke-width="1.4" /><line x1="733" y1="307" x2="809" y2="307" stroke="#73675E" stroke-width="1.4" /><text x="714" y="339" font-size="12" fill="#1A1512" font-weight="700" text-anchor="start" >Q</text><line x1="733" y1="332" x2="822" y2="332" stroke="#73675E" stroke-width="1.4" /><line x1="733" y1="341" x2="809" y2="341" stroke="#73675E" stroke-width="1.4" /><text x="714" y="373" font-size="12" fill="#1A1512" font-weight="700" text-anchor="start" >Q</text><line x1="733" y1="366" x2="822" y2="366" stroke="#73675E" stroke-width="1.4" /><line x1="733" y1="375" x2="809" y2="375" stroke="#73675E" stroke-width="1.4" /><text x="612" y="421" font-size="18" fill="#1A1512" font-weight="400" text-anchor="middle" >Flow diagram</text><text x="770" y="421" font-size="18" fill="#1A1512" font-weight="400" text-anchor="middle" >Q + A</text><text x="864" y="324" font-size="19" fill="#D2181F" font-weight="700" text-anchor="middle" >TRY</text><text x="864" y="351" font-size="19" fill="#D2181F" font-weight="700" text-anchor="middle" >BOTH</text><text x="542" y="464" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start" >Ask a reader: “Who owns the road?”</text><line x1="40" y1="531" x2="960" y2="531" stroke="#1A1512" stroke-width="1" /><text x="40" y="559" font-size="17" fill="#73675E" font-weight="400" text-anchor="start" >Preview of worked example 2 · Match the check to the issue.</text><text x="960" y="559" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end" >ACCESS IS4S</text></g></svg>
