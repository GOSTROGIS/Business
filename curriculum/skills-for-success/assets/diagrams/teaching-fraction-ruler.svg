<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title desc"><title id="title">Count intervals. Name the fraction.</title><desc id="desc">An enlarged ruler segment from three to four inches is divided into sixteen equal intervals. The first five intervals are counted, locating three and five sixteenths inches. Quarter, half and three-quarter marks provide a check: the endpoint lies between three and one quarter and three and one half. The illustration must not be measured as a physical ruler.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="890" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">NUMERACY / INCHES + SIXTEENTHS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Count intervals. Name the fraction.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Enlarged view of the 3–4 inch segment</text><rect x="54" y="380" width="1060" height="179" rx="9" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><rect x="67" y="393" width="1034" height="153" rx="4" fill="#FFF0BE" stroke="#1A1512" stroke-width="1.5" /><line x1="72" y1="403" x2="72" y2="514" stroke="#1A1512" stroke-width="3"/><line x1="136" y1="403" x2="136" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="200" y1="403" x2="200" y2="453" stroke="#1A1512" stroke-width="2"/><line x1="264" y1="403" x2="264" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="328" y1="403" x2="328" y2="473" stroke="#1A1512" stroke-width="3"/><line x1="392" y1="403" x2="392" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="456" y1="403" x2="456" y2="453" stroke="#1A1512" stroke-width="2"/><line x1="520" y1="403" x2="520" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="584" y1="403" x2="584" y2="494" stroke="#1A1512" stroke-width="3"/><line x1="648" y1="403" x2="648" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="712" y1="403" x2="712" y2="453" stroke="#1A1512" stroke-width="2"/><line x1="776" y1="403" x2="776" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="840" y1="403" x2="840" y2="473" stroke="#1A1512" stroke-width="3"/><line x1="904" y1="403" x2="904" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="968" y1="403" x2="968" y2="453" stroke="#1A1512" stroke-width="2"/><line x1="1032" y1="403" x2="1032" y2="434" stroke="#1A1512" stroke-width="2"/><line x1="1096" y1="403" x2="1096" y2="514" stroke="#1A1512" stroke-width="3"/><text x="72" y="597" font-size="31" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><text x="328" y="597" font-size="31" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3¼</text><text x="584" y="597" font-size="31" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3½</text><text x="840" y="597" font-size="31" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3¾</text><text x="1096" y="597" font-size="31" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">4 in</text><rect x="72" y="284" width="320" height="63" rx="4" fill="#1A1512" stroke="none" stroke-width="1" /><text x="104.0" y="327" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">1</text><text x="168.0" y="327" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">2</text><text x="232.0" y="327" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">3</text><text x="296.0" y="327" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">4</text><text x="360.0" y="327" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">5</text><text x="72" y="260" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">5 equal intervals</text><line x1="392" y1="282" x2="392" y2="543" stroke="#D2181F" stroke-width="5"/><circle cx="392" cy="403" r="9" fill="#D2181F" stroke="none" stroke-width="1"/><text x="662" y="270" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">READ THE ENDPOINT</text><text x="662" y="325" font-size="42" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3 + 5/16</text><text x="662" y="376" font-size="42" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">= 3 5/16 in</text><text x="72" y="654" font-size="27" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Each small interval is 1/16 inch.</text><rect x="48" y="694" width="1104" height="119" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><text x="78" y="739" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">CHECK</text><text x="256" y="744" font-size="37" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3¼ &lt; 3 5/16 &lt; 3½</text><text x="256" y="788" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">The endpoint lies between the quarter and half marks.</text><text x="48" y="864" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Illustration only • do not measure this printed or resized image.</text></g></svg>