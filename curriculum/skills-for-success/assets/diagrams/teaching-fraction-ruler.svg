<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Read five sixteenths beyond three inches</title><desc id="desc">An enlarged ruler segment from three to four inches has sixteen equal intervals. The strip ends at the fifth interval after three, giving three and five sixteenths inches. The endpoint lies beyond three and one quarter but before three and one half. This diagram is not a calibrated measuring tool.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#1A1512"/></marker></defs>
<rect width="1000" height="580" fill="#F7F4F1"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1A1512">
<text x="48" y="57" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start">Count the intervals, then name the fraction</text>
<text x="48" y="92" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start">Enlarged view of the 3–4 inch segment</text>
<rect x="120" y="185" width="245" height="48" rx="0" fill="#FFBC00" stroke="none" stroke-width="1" />
<text x="242.5" y="170" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">5 equal intervals</text>
<line x1="120" y1="257" x2="904" y2="257" stroke="#1A1512" stroke-width="3" />
<line x1="120" y1="257" x2="120" y2="331" stroke="#1A1512" stroke-width="3" />
<line x1="169" y1="257" x2="169" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="218" y1="257" x2="218" y2="290" stroke="#1A1512" stroke-width="2" />
<line x1="267" y1="257" x2="267" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="316" y1="257" x2="316" y2="304" stroke="#1A1512" stroke-width="3" />
<line x1="365" y1="257" x2="365" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="414" y1="257" x2="414" y2="290" stroke="#1A1512" stroke-width="2" />
<line x1="463" y1="257" x2="463" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="512" y1="257" x2="512" y2="317" stroke="#1A1512" stroke-width="3" />
<line x1="561" y1="257" x2="561" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="610" y1="257" x2="610" y2="290" stroke="#1A1512" stroke-width="2" />
<line x1="659" y1="257" x2="659" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="708" y1="257" x2="708" y2="304" stroke="#1A1512" stroke-width="3" />
<line x1="757" y1="257" x2="757" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="806" y1="257" x2="806" y2="290" stroke="#1A1512" stroke-width="2" />
<line x1="855" y1="257" x2="855" y2="279" stroke="#1A1512" stroke-width="2" />
<line x1="904" y1="257" x2="904" y2="331" stroke="#1A1512" stroke-width="3" />
<text x="120" y="367" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">3</text>
<text x="316" y="367" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">3¼</text>
<text x="512" y="367" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">3½</text>
<text x="708" y="367" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">3¾</text>
<text x="904" y="367" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">4 in</text>
<circle cx="144.5" cy="209" r="13" fill="#1A1512"/><text x="144.5" y="215" font-size="18" font-weight="700" fill="white" text-anchor="middle">1</text>
<circle cx="193.5" cy="209" r="13" fill="#1A1512"/><text x="193.5" y="215" font-size="18" font-weight="700" fill="white" text-anchor="middle">2</text>
<circle cx="242.5" cy="209" r="13" fill="#1A1512"/><text x="242.5" y="215" font-size="18" font-weight="700" fill="white" text-anchor="middle">3</text>
<circle cx="291.5" cy="209" r="13" fill="#1A1512"/><text x="291.5" y="215" font-size="18" font-weight="700" fill="white" text-anchor="middle">4</text>
<circle cx="340.5" cy="209" r="13" fill="#1A1512"/><text x="340.5" y="215" font-size="18" font-weight="700" fill="white" text-anchor="middle">5</text>
<line x1="365" y1="177" x2="365" y2="335" stroke="#D2181F" stroke-width="4" />
<circle cx="365" cy="257" r="7" fill="#D2181F"/><text x="550" y="188" font-size="22" font-weight="700" fill="#1A1512" text-anchor="start">Read the endpoint</text>
<text x="550" y="225" font-size="30" font-weight="700" fill="#D2181F" text-anchor="start">3 + 5/16 = 3 5/16 in</text>
<line x1="530" y1="213" x2="390" y2="248" stroke="#D2181F" stroke-width="2" />
<text x="120" y="409" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start">Each small interval is 1/16 inch.</text>
<rect x="48" y="442" width="904" height="85" rx="12" fill="white" stroke="#1A1512" stroke-width="1" />
<text x="72" y="475" font-size="18" font-weight="700" fill="#D2181F" text-anchor="start">CHECK</text>
<text x="184" y="478" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start">3¼  &lt;  3 5/16  &lt;  3½</text>
<text x="184" y="510" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">The endpoint belongs between the quarter and half marks.</text>
<text x="48" y="558" font-size="18" font-weight="400" fill="#1A1512" text-anchor="start">Illustration only • do not measure this printed or resized image.</text>
</g></svg>