<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
<title id="title">Compare the print-station trial and its limits</title><desc id="desc">Before the changed arrangement, sessions A, B and C had 9 sets needing label correction out of 30 reviewed sets, or 30 percent. After the current file was put in a clearly named folder with a displayed version-check card, sessions D and E had 1 corrected set out of 20, or 5 percent. Each circle is one set; a filled circle with a white dash means a correction was needed. The observed difference is 25 percentage points. Different sessions and possibly different learners, with no simultaneous comparison group, mean the change cannot be attributed solely to the folder. A return arrow prompts another trial, learner feedback and observation.</desc><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1A1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D2181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
