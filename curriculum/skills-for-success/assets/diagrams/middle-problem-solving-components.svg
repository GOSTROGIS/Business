<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">The six Problem Solving components as a revisable action loop</title><desc id="desc">Six numbered actions form a loop: 1 identify the issue by naming the gap; 2 gather information by checking facts and unknowns; 3 analyze the issue by testing possible explanations; 4 develop multiple routes by comparing different responses; 5 address the issue by acting within your responsibility; 6 evaluate effectiveness by checking results and next steps. Distinct icons show the gap, information search, weighing evidence, branching routes, an action checklist and a review loop. A return arrow shows that new information can take you back. A question or another observation may be the next useful action.</desc><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1A1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D2181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="710" fill="#F7F4F1"/><text x="40" y="35" font-size="14" font-weight="700" fill="#6B625C" text-anchor="start">PROBLEM SOLVING · SIX COMPONENTS</text><rect x="40" y="48" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="3"/><text x="40" y="86" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start">A decision can improve as the evidence changes</text><text x="40" y="124" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Move through the actions. Return when a new fact changes what you need to do.</text><line x1="253" y1="227" x2="419" y2="227" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><line x1="573" y1="227" x2="739" y2="227" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M 897 227 H 947 V 490 H 900" fill="none" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="747" y1="490" x2="581" y2="490" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><line x1="427" y1="490" x2="261" y2="490" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><path d="M 107 490 H 51 V 227 H 99" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><circle cx="180" cy="227" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><line x1="145" y1="256" x2="216" y2="256" stroke="#1A1512" stroke-width="3" /><rect x="154" y="228" width="17" height="27" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><rect x="190" y="202" width="17" height="53" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><path d="M 179 203 V 225" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><circle cx="133" cy="181" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="133" y="187" font-size="17" font-weight="7