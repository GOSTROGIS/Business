"url(#arrow)"/><circle cx="820" cy="519" r="7" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><circle cx="773" cy="444" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="773" y="450" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">4</text><text x="820" y="586" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Develop multiple routes</text><text x="820" y="613" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Compare different responses.</text><circle cx="500" cy="490" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><rect x="472" y="461" width="56" height="66" rx="4" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><rect x="488" y="454" width="24" height="12" rx="3" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><path d="M 485 495.5 l 9.28 9.28 l 20.299999999999997 -23.200000000000003" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><line x1="485" y1="515" x2="515" y2="515" stroke="#1A1512" stroke-width="3" /><circle cx="453" cy="444" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="453" y="450" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">5</text><text x="500" y="586" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Address the issue</text><text x="500" y="613" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Act within your responsibility.</text><circle cx="180" cy="490" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><path d="M 148 500 A 34 34 0 1 1 209 508" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><rect x="162" y="492" width="9" height="19" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><rect x="176" y="484" width="9" height="27" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><rect x="190" y="474" width="9" height="37" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><circle cx="133" cy="444" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="133" y="450" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">6</text><text x="180" y="586" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Evaluate effectiveness</text><text x="180" y="613" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Check results and next steps.</text><text x="500" y="397" font-size="19" font-weight="700" fill="#D2181F" text-anchor="middle">A question or another observation can be the next useful action.</text><line x1="40" y1="650" x2="960" y2="650" stroke="#C6BAB0" stroke-width="1.5" /><text x="40" y="683" font-size="18" font-weight="400" fill="#1A1512" text-anchor="start">Keep a record: issue · facts · unknowns · options · action and reason · result · next step</text></g></svg>