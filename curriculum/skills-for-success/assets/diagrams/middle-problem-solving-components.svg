<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Problem Solving</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. A decision can improve as the evidence changes. Six connected components: Identify the issue; Gather information; Analyze the issue; Develop multiple routes; Address the issue; Evaluate effectiveness. Keep a record: issue · facts · unknowns · options · action · results. Return when new evidence changes the decision.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">05 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Problem Solving</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A decision can improve as the evidence changes.</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><rect x="51" y="112" width="322" height="355" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="4" /><text x="80" y="159" font-size="20" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">FACTS / QUESTIONS</text><circle cx="210" cy="219" r="28" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><text x="210" y="229" font-size="28" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">?</text><path d="M210 249 V280 H115 V311 M210 280 H300 V311" stroke="#1A1512" stroke-width="3" fill="none"/><rect x="76" y="312" width="78" height="62" rx="8" fill="#FFF0BE" stroke="#1A1512" stroke-width="3" /><text x="115" y="355" font-size="33" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">A</text><rect x="261" y="312" width="78" height="62" rx="8" fill="#FFF0BE" stroke="#1A1512" stroke-width="3" /><text x="300" y="355" font-size="33" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">B</text><path d="M115 374 V413 H300 V374" stroke="#1A1512" stroke-width="3" fill="none"/><text x="210" y="451" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">compare</text><circle cx="330" cy="455" r="43" fill="#D2181F" stroke="none" stroke-width="1"/><path d="M309 455 L325 471 L352 437" stroke="#FFFFFF" stroke-width="5" fill="none"/></g><text x="264" y="863" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NOTICE · PRACTISE · CHECK</text><text x="526" y="277" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="600" y="270" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Identify the issue</text><text x="600" y="306" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Name the gap.</text><line x1="600" y1="330" x2="1152" y2="330" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="382" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="600" y="375" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Gather information</text><text x="600" y="411" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Check facts and unknowns.</text><line x1="600" y1="435" x2="1152" y2="435" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="487" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="600" y="480" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Analyze the issue</text><text x="600" y="516" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Test possible explanations.</text><line x1="600" y1="540" x2="1152" y2="540" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="592" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="600" y="585" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Develop multiple routes</text><text x="600" y="621" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Compare different responses.</text><line x1="600" y1="645" x2="1152" y2="645" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="697" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="600" y="690" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Address the issue</text><text x="600" y="726" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Act within your responsibility.</text><line x1="600" y1="750" x2="1152" y2="750" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="802" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">06</text><text x="600" y="795" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Evaluate effectiveness</text><text x="600" y="831" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Check results and next steps.</text><line x1="600" y1="855" x2="1152" y2="855" stroke="#D8CBC1" stroke-width="1.5"/><text x="48" y="968" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep a record: issue · facts · unknowns · options · action · results. Return when new</text><text x="48" y="1002" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">evidence changes the decision.</text></g></svg>