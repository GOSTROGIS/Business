<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Writing</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. Keep the reader and purpose at the centre. Six connected components: Identify purpose and reader; Plan the writing task; Use words to convey meaning; Choose language and style; Choose a useful format; Review and revise. Revisit a plan, wording or format when feedback reveals a better choice.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">02 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Writing</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the reader and purpose at the centre.</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><path d="M45 281 L208 170 L373 281 V471 H45Z" stroke="#1A1512" stroke-width="4" fill="#FFBC00"/><path d="M45 281 L209 395 L373 281" stroke="#1A1512" stroke-width="3" fill="none"/><g transform="translate(88,87) scale(1) rotate(-3)"><path d="M0 0 H200 L238 38 V272 H0 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M200 0 V38 H238" stroke="#1A1512" stroke-width="3" fill="none"/></g><text x="116" y="152" font-size="18" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">READER + PURPOSE</text><text x="116" y="198" font-size="46" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Aa</text><line x1="116" y1="239" x2="276" y2="239" stroke="#D8CBC1" stroke-width="8"/><line x1="116" y1="270" x2="260" y2="270" stroke="#D8CBC1" stroke-width="8"/><line x1="116" y1="302" x2="276" y2="302" stroke="#D8CBC1" stroke-width="8"/><line x1="116" y1="333" x2="228" y2="333" stroke="#D8CBC1" stroke-width="8"/><path d="M132 368 L154 387 L193 346" stroke="#D2181F" stroke-width="7" fill="none"/><g transform="translate(302,196) scale(1) rotate(-17)"><rect x="0" y="0" width="25" height="210" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><path d="M0 210 L12.5 243 L25 210Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M8 231 L12.5 243 L17 231Z" stroke="#1A1512" stroke-width="1" fill="#1A1512"/><rect x="0" y="0" width="25" height="25" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="3" /></g></g><text x="264" y="863" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NOTICE · PRACTISE · CHECK</text><text x="526" y="277" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="600" y="270" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Identify purpose and reader</text><line x1="600" y1="330" x2="1152" y2="330" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="382" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="600" y="375" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Plan the writing task</text><line x1="600" y1="435" x2="1152" y2="435" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="487" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="600" y="480" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Use words to convey meaning</text><line x1="600" y1="540" x2="1152" y2="540" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="592" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="600" y="585" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Choose language and style</text><line x1="600" y1="645" x2="1152" y2="645" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="697" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="600" y="690" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Choose a useful format</text><line x1="600" y1="750" x2="1152" y2="750" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="802" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">06</text><text x="600" y="795" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Review and revise</text><line x1="600" y1="855" x2="1152" y2="855" stroke="#D8CBC1" stroke-width="1.5"/><text x="48" y="968" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Revisit a plan, wording or format when feedback reveals a better choice.</text></g></svg>