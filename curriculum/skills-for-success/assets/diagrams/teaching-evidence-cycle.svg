<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Use evidence to choose the next teaching move</title><desc id="desc">The cycle begins with a task and criterion, observes an individual attempt, interprets the evidence, provides focused teaching and feedback, offers a new attempt, and reviews change or transfer. The task, tools, support and version are recorded throughout.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#1A1512" stroke-width="1.8"/></marker></defs><rect width="1000" height="580" fill="#F7F4F1"/><g font-family="Arial, Helvetica, sans-serif" fill="#1A1512"><text x="45" y="48" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start">Evidence leads to the next teaching move</text><path d="M563.0 164.6L721.2 213.7" fill="none" stroke="#B9AFA6" stroke-width="4" marker-end="url(#arrow)"/><path d="M836 235H935V410H839" fill="none" stroke="#B9AFA6" stroke-width="4" marker-end="url(#arrow)"/><path d="M725.2 422.3L570.7 451.6" fill="none" stroke="#B9AFA6" stroke-width="4" marker-end="url(#arrow)"/><path d="M435.2 452.7L280.7 423.4" fill="none" stroke="#B9AFA6" stroke-width="4" marker-end="url(#arrow)"/><path d="M164 410H65V235H161" fill="none" stroke="#B9AFA6" stroke-width="4" marker-end="url(#arrow)"/><path d="M273.0 215.4L431.2 166.3" fill="none" stroke="#B9AFA6" stroke-width="4" marker-end="url(#arrow)"/><circle cx="500" cy="310" r="93" fill="#FFBC00"/><text x="500" y="285" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">RECORD</text><text x="500" y="321" font-size="22" font-weight="400" fill="#1A1512" text-anchor="middle">task · tools</text><text x="500" y="350" font-size="22" font-weight="400" fill="#1A1512" text-anchor="middle">support · version</text><circle cx="500" cy="145" r="39" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(500 145) scale(0.75)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle r="25"/><circle r="13"/><circle r="3"/><path d="M0 0L27-27 M16-27H27V-16"/></g><text x="500" y="88" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Set the task</text><text x="500" y="213" font-size="18" font-weight="400" fill="#1A1512" text-anchor="middle">Name the criterion</text><circle cx="790" cy="235" r="39" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(790 235) scale(0.75)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-31 0Q0-35 31 0Q0 35-31 0Z"/><circle r="10"/></g><text x="790" y="299" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Observe</text><text x="790" y="323" font-size="18" font-weight="400" fill="#1A1512" text-anchor="middle">An individual attempt</text><circle cx="790" cy="410" r="39" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(790 410) scale(0.75)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-23-27H9L23-13V27H-23Z M9-27V-13H23 M-14 9L-4 19L13-3"/></g><text x="790" y="474" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Interpret</text><text x="790" y="498" font-size="18" font-weight="400" fill="#1A1512" text-anchor="middle">Evidence against criterion</text><circle cx="500" cy="465" r="39" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(500 465) scale(0.75)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-27-24H17V5H0L-13 16V5H-27Z M-12 16V24H12L25 34V24H31V-3H23"/></g><text x="500" y="528" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Teach + feedback</text><text x="500" y="554" font-size="18" font-weight="400" fill="#1A1512" text-anchor="middle">One useful next step</text><circle cx="210" cy="410" r="39" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(210 410) scale(0.75)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-22-8A24 24 0 0 1 23-8 M23-23V-8H8 M22 8A24 24 0 0 1-23 8 M-23 23V8H-8"/></g><text x="210" y="474" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Try again</text><text x="210" y="498" font-size="18" font-weight="400" fill="#1A1512" text-anchor="middle">A comparable new task</text><circle cx="210" cy="235" r="39" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(210 235) scale(0.75)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-24-17Q-11-22 0-14Q11-22 24-17V20Q11 15 0 23Q-11 15-24 20Z M0-14V23 M-17-9L-6-7 M6-7L17-9 M-17-1L-6 1 M6 1L17-1"/></g><text x="210" y="299" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Review</text><text x="210" y="323" font-size="18" font-weight="400" fill="#1A1512" text-anchor="middle">Change and transfer</text></g></svg>
