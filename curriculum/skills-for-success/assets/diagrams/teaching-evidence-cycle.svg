<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc"><title id="title">Evidence leads to the next teaching move.</title><desc id="desc">Six arrow-linked teaching moves cycle through setting the task and criterion, observing an individual attempt, interpreting evidence against the criterion, teaching with useful feedback, trying a comparable new task, and reviewing change and transfer. A central record names task, tools, support and version so the conditions remain visible.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1090" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">PRACTITIONER / OBSERVE + INTERPRET + TEACH</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Evidence leads to the next teaching move.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the task conditions visible as the learning develops.</text><path d="M205 286 H905" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M975 286 H1148 V470 H1020 V506" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1055 541 H1175 V809 H949" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M879 809 H302" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M232 809 H35 V541 H135" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M170 506 V440 H35 V286 H135" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="387" y="389" width="425" height="309" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="418" y="440" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">RECORD</text><text x="418" y="507" font-size="34" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Task · tools</text><line x1="418" y1="529" x2="780" y2="529" stroke="#D8CBC1" stroke-width="2"/><text x="418" y="574" font-size="34" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Support · version</text><line x1="418" y1="596" x2="780" y2="596" stroke="#D8CBC1" stroke-width="2"/><circle cx="170" cy="286" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="170" y="295" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">01</text><text x="170" y="350" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Set the task</text><text x="170" y="386" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">Name the criterion</text><circle cx="940" cy="286" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="940" y="295" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">02</text><text x="940" y="350" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Observe</text><text x="940" y="386" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">An individual attempt</text><circle cx="1020" cy="541" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="1020" y="550" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">03</text><text x="1020" y="605" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Interpret</text><text x="1020" y="641" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">Evidence against</text><text x="1020" y="672" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">criterion</text><circle cx="914" cy="809" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="914" y="818" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">04</text><text x="914" y="873" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Teach + feedback</text><text x="914" y="909" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">One useful next step</text><circle cx="267" cy="809" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="267" y="818" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">05</text><text x="267" y="873" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Try again</text><text x="267" y="909" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">A comparable new task</text><circle cx="170" cy="541" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="170" y="550" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">06</text><text x="170" y="605" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Review</text><text x="170" y="641" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">Change and transfer</text><text x="48" y="1007" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Record the learner’s action, support and result. Use a comparable new task to check</text><text x="48" y="1041" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">what changed.</text></g></svg>