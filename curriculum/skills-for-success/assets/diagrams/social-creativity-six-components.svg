<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Creativity And Innovation</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. Make ideas usable. Learn from the trial. Six connected components: Use imagination and curiosity; Find opportunities to innovate; Generate new ideas; Develop your ideas; Apply your ideas; Make room for creativity. Revisit the component that helps the task.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">09 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Creativity And Innovation</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Make ideas usable. Learn from the trial.</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><rect x="49" y="165" width="328" height="270" rx="8" fill="#FFFFFF" stroke="#1A1512" stroke-width="4" /><rect x="49" y="409" width="328" height="26" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><path d="M72 261 V209 H13