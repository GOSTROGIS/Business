<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Adaptability</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. Purpose stays visible as plans change. Six connected components: Take responsibility; Persist and persevere; Regulate emotions when appropriate; Set or adjust goals and expectations; Plan and prioritize; Seek self-improvement. Revisit the component that helps the task.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">08 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Adaptability</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Purpose stays visible as plans change.</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><rect x="60" y="118" width="300" height="325" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="4" /><rect x="60" y="118" width="300" height="66" rx="12" fill="#FFBC00" stroke="#1A1512" stroke-width="4" /><text x="210" y="162" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">PLAN → REPLAN</text><rect x="81" y="208" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="81" y="285" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="81" y="362" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="173" y="208" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="173" y="285" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="173" y="362" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="265" y="208" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="265" y="285" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="265" y="362" width="71" height="58" rx="4" fill="#F7F4F1" stroke="#D8CBC1" stroke-width="2" /><rect x="85" y="213" width="65" height="48" rx="3" fill="#D2181F" stroke="none" stroke-width="1" /><rect x="269" y="290" width="65" height="48" rx="3" fill="#FFBC00" stroke="none" stroke-width="1" /><path d="M117 269 C117 314 237 314 264 313" stroke="#1A1512" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="331" cy="461" r="57" fill="#FFF0BE" stroke="#1A1512" stroke-width="4"/><line x1="331" y1="461" x2="331" y2="426" stroke="#1A1512" stroke-width="4"/><line x1="331" y1="461" x2="358" y2="475" stroke="#1A1512" stroke-width="4"/></g><text x="264" y="863" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NOTICE · PRACTISE · CHECK</text><text x="526" y="277" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="600" y="270" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Take responsibility</text><line x1="600" y1="330" x2="1152" y2="330" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="382" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="600" y="375" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Persist and persevere</text><line x1="600" y1="435" x2="1152" y2="435" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="487" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="600" y="480" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Regulate emotions when appropriate</text><line x1="600" y1="540" x2="1152" y2="540" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="592" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="600" y="585" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Set or adjust goals and</text><text x="600" y="616" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">expectations</text><line x1="600" y1="645" x2="1152" y2="645" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="697" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="600" y="690" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Plan and prioritize</text><line x1="600" y1="750" x2="1152" y2="750" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="802" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">06</text><text x="600" y="795" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Seek self-improvement</text><line x1="600" y1="855" x2="1152" y2="855" stroke="#D8CBC1" stroke-width="1.5"/><text x="48" y="968" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Revisit the component that he