font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="820" y="277" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Regulate emotions</text><text x="820" y="305" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">when appropriate</text><circle cx="820" cy="423" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(820 423)"><circle cx="-5" cy="0" r="28" fill="#FFFFFF" stroke="#1A1512" stroke-width="3"/><circle cx="-5" cy="0" r="13" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><circle cx="-5" cy="0" r="3" fill="#D2181F" stroke="#D2181F" stroke-width="2"/><path d="M33 -29 L7 -7" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#red)"/><path d="M20 23 H38 V5" fill="none" stroke="#1A1512" stroke-width="3" /></g><circle cx="775" cy="465" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="775" y="472" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="820" y="512" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Set or adjust</text><text x="820" y="540" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">goals and expectations</text><circle cx="500" cy="423" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(500 423)"><rect x="-24" y="-27" width="48" height="11" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><rect x="-24" y="-4" width="39" height="11" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><rect x="-24" y="19" width="30" height="11" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><path d="M32 24 L32 -22" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#red)"/></g><circle cx="455" cy="465" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="455" y="472" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="500" y="512" font-size="23" fill="#1A151