<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Adaptability — six connected components</title><desc id="desc">Overview map for the chapter. 1. Demonstrate responsibility. 2. Persist and persevere. 3. Regulate your emotions when appropriate. 4. Set or adjust your goals and expectations. 5. Plan and prioritize. 6. Seek self-improvement. Short visual labels summarize these source component names. Numbering matches the component list; the connections do not require one fixed sequence.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><rect x="40" y="34" width="7" height="54" rx="0" fill="#D2181F" stroke="none" stroke-width="0"/><text x="65" y="47" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start">SIX CONNECTED COMPONENTS</text><text x="65" y="91" font-size="42" fill="#1A1512" font-weight="700" text-anchor="start">Adaptability</text><path d="M180 188 H820 C968 188 968 423 820 423 H180 C32 423 32 188 180 188" fill="none" stroke="#1A1512" stroke-width="4" opacity=".2"/><rect x="175" y="310" width="650" height="46" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><text x="500" y="341" font-size="27" fill="#1A1512" font-weight="700" text-anchor="middle">Purpose stays visible as plans change.</text><circle cx="180" cy="188" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(180 188)"><rect x="-26" y="-29" width="52" height="63" rx="3" fill="#FFFFFF" stroke="#1A