<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<style>text{font-family:Arial,sans-serif;fill:#1A1512}.label{font-size:22px}.small{font-size:20px}.strong{font-weight:700}.dim{stroke:#1A1512;stroke-width:1.8;fill:none}.guide{stroke:#1A1512;stroke-width:1.2;fill:none}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1512"/></marker><marker id="dimarrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 10 5 L 0 1 L 0 9 z" fill="#1A1512"/></marker></defs>
<rect width="1000" height="600" fill="#F7F4F1"/>
<title id="title">Four information cards fit within the original board margins</title>
<desc id="desc">The fictional board is 600 millimetres wide and 400 millimetres high. A 25-millimetre margin on each edge leaves a clear rectangle 550 by 350 millimetres. Four cards are shown in two columns and two rows. Each card is 180 by 110 millimetres and the horizontal and vertical gaps are 20 millimetres. The four-card group uses 380 by 240 millimetres. Three columns would require 580 millimetres, exceeding the clear width of 550. Three rows would require 370 millimetres, exceeding the clear height of 350. Use labelled dimensions rather than measuring the image.</desc>
<text x="40" y="30" class="small strong" letter-spacing="1">ACCESS IS4S · FICTIONAL PRACTICE · ORIGINAL MARGINS</text>
<text x="40" y="70" font-size="34" font-weight="700">Test the fit in both directions</text>
<line x1="80" y1="96" x2="680" y2="96" class="dim" marker-start="url(#dimarrow)" marker-end="url(#dimarrow)"/>
<text x="380" y="89" text-anchor="middle" class="label strong">600 mm board width</text>
<line x1="80" y1="102" x2="80" y2="126" class="guide"/>
<line x1="680" y1="102" x2="680" y2="126" class="guide"/>
<rect x="80" y="125" width="600" height="400" fill="#FFBC00" stroke="#1A1512" stroke-width="2.5"/>
<rect x="105" y="150" width="550" height="350" fill="#FFFFFF" stroke="#D2181F" stroke-width="2" stroke-dasharray="8 5"/>
<line x1="53" y1="125" x2="53" y2="525" class="dim" marker-start="url(#dimarrow)" marker-end="url(#dimarrow)"/>
<line x1="59" y1="125" x2="80" y2="125" class="guide"/>
<line x1="59" y1="525" x2="80" y2="525" class="guide"/>
<text transform="translate(38 325) rotate(-90)" text-anchor="middle" class="label strong">400 mm board height</text>
<rect x="105" y="150" width="180" height="110" rx="2" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/>
<text x="195" y="195" text-anchor="middle" font-size="28" font-weight="700">Card 1</text>
<text x="195" y="228" text-anchor="middle" class="small">180 × 110 mm</text>
<rect x="305" y="150" width="180" height="110" rx="2" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/>
<text x="395" y="195" text-anchor="middle" font-size="28" font-weight="700">Card 2</text>
<text x="395" y="228" text-anchor="middle" class="small">180 × 110 mm</text>
<rect x="105" y="280" width="180" height="110" rx="2" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/>
<text x="195" y="325" text-anchor="middle" font-size="28" font-weight="700">Card 3</text>
<text x="195" y="358" text-anchor="middle" class="small">180 × 110 mm</text>
<rect x="305" y="280" width="180" height="110" rx="2" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/>
<text x="395" y="325" text-anchor="middle" font-size="28" font-weight="700">Card 4</text>
<text x="395" y="358" text-anchor="middle" class="small">180 × 110 mm</text>
<line x1="285" y1="398" x2="285" y2="428" class="guide"/>
<line x1="305" y1="398" x2="305" y2="428" class="guide"/>
<line x1="285" y1="419" x2="305" y2="419" class="dim" marker-start="url(#dimarrow)" marker-end="url(#dimarrow)"/>
<text x="295" y="454" text-anchor="middle" class="label strong">20 mm gap</text>
<line x1="491" y1="260" x2="520" y2="260" class="guide"/>
<line x1="491" y1="280" x2="520" y2="280" class="guide"/>
<line x1="511" y1="260" x2="511" y2="280" class="dim" marker-start="url(#dimarrow)" marker-end="url(#dimarrow)"/>
<text x="530" y="278" class="small strong">20 mm</text>
<text x="380" y="488" text-anchor="middle" class="label">Clear rectangle: 550 × 350 mm</text>
<line x1="105" y1="545" x2="655" y2="545" class="dim" marker-start="url(#dimarrow)" marker-end="url(#dimarrow)"/>
<line x1="105" y1="528" x2="105" y2="550" class="guide"/>
<line x1="655" y1="528" x2="655" y2="550" class="guide"/>
<text x="380" y="572" text-anchor="middle" class="label strong">550 mm clear width</text>
<line x1="705" y1="150" x2="705" y2="500" class="dim" marker-start="url(#dimarrow)" marker-end="url(#dimarrow)"/>
<line x1="682" y1="150" x2="710" y2="150" class="guide"/>
<line x1="682" y1="500" x2="710" y2="500" class="guide"/>
<text transform="translate(730 325) rotate(-90)" text-anchor="middle" class="small strong">350 mm clear height</text>
<path d="M 770 154 H 748 L 670 137" class="guide"/>
<text x="775" y="143" class="label strong">25 mm margin</text>
<text x="775" y="171" class="label">on every edge</text>
<text x="770" y="222" class="label strong">Try 3 across</text>
<line x1="770" y1="240" x2="935" y2="240" stroke="#D2181F" stroke-width="2"/>
<rect x="770.0" y="250" width="54.0" height="33.0" fill="#F7F4F1" stroke="#1A1512" stroke-width="1.5"/>
<rect x="830.0" y="250" width="54.0" height="33.0" fill="#F7F4F1" stroke="#1A1512" stroke-width="1.5"/>
<rect x="890.0" y="250" width="54.0" height="33.0" fill="#F7F4F1" stroke="#1A1512" stroke-width="1.5"/>
<line x1="935" y1="234" x2="935" y2="293" stroke="#D2181F" stroke-width="2" stroke-dasharray="4 3"/>
<text x="770" y="319" class="small">3 × 180 + 2 × 20</text>
<text x="770" y="348" class="small strong" style="fill:#D2181F">580 mm &gt; 550 mm</text>
<text x="770" y="391" class="label strong">Try 3 down</text>
<text x="770" y="421" class="small">3 × 110 + 2 × 20</text>
<text x="770" y="450" class="small strong" style="fill:#D2181F">370 mm &gt; 350 mm</text>
<text x="770" y="504" font-size="29" font-weight="700">2 × 2 = 4 cards</text>
<text x="770" y="537" class="small">Group: 380 × 240 mm</text>
<text x="40" y="592" class="small">Use labelled dimensions; do not measure this image. Card orientation stays fixed.</text>
</svg>