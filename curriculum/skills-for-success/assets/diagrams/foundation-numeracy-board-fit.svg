ont-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">370 mm &gt; 350 mm</text><rect x="802" y="667" width="350" height="126" rx="12" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="827" y="719" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">2 × 2 = 4 cards</text><text x="827" y="762" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Group: 380 × 240 mm</text><text x="67" y="760" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">550 mm clear width · 350 mm clear height</text><text x="48" y="866" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use labelled dimensions; do not measure this image. Card orientation stays fixed.</text></g></svg>