<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">Keep the work. Explain what it shows.</title><desc id="desc">Five possible evidence items are a source plus explanation, draft plus revision, checked working, file plus tool observation and an observed exchange. A personal evidence note records task and action, tools and supports, checks and result, and limits and permission. A next attempt moves from choosing a task to trying a strategy and keeping new evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1030" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">PORTFOLIO / EVIDENCE + NEXT PRACTICE</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the work. Explain what it shows.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Choose evidence that fits your learning goal.</text><text x="48" y="252" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">EXAMPLES TO CHOOSE FROM</text><path d="M48 288 H64 L102 326 V355 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M64 288 V326 H102" stroke="#1A1512" stroke-width="3" fill="none"/><text x="128" y="330" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Source + explanation</text><path d="M48 385 H64 L102 423 V452 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M64 385 V423 H102" stroke="#1A1512" stroke-width="3" fill="none"/><text x="128" y="427" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Draft + revision</text><path d="M48 482 H64 L102 520 V549 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M64 482 V520 H102" stroke="#1A1512" stroke-width="3" fill="none"/><text x="128" y="524" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Checked working</text><path d="M48 579 H64 L102 617 V646 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M64 579 V617 H102" stroke="#1A1512" stroke-width="3" fill="none"/><text x="128" y="621" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">File + tool observation</text><path d="M48 676 H64 L102 714 V743 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M64 676 V714 H102" stroke="#1A1512" stroke-width="3" fill="none"/><text x="128" y="718" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Observed exchange</text><path d="M500 476 H568" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="620" y="235" width="532" height="485" rx="16" fill="#1A1512" stroke="none" stroke-width="1" /><text x="651" y="290" font-size="30" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">MY EVIDENCE NOTE</text><circle cx="665" cy="356" r="13" fill="#FFBC00" stroke="none" stroke-width="1"/><text x="696" y="364" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Task + my action</text><line x1="696" y1="389" x2="1119" y2="389" stroke="#D8CBC1" stroke-width="1"/><circle cx="665" cy="439" r="13" fill="#FFBC00" stroke="none" stroke-width="1"/><text x="696" y="447" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Tools + supports</text><line x1="696" y1="472" x2="1119" y2="472" stroke="#D8CBC1" stroke-width="1"/><circle cx="665" cy="522" r="13" fill="#FFBC00" stroke="none" stroke-width="1"/><text x="696" y="530" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Checks + result</text><line x1="696" y1="555" x2="1119" y2="555" stroke="#D8CBC1" stroke-width="1"/><circle cx="665" cy="605" r="13" fill="#FFBC00" stroke="none" stroke-width="1"/><text x="696" y="613" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Limits + permission</text><line x1="696" y1="638" x2="1119" y2="638" stroke="#D8CBC1" stroke-width="1"/><text x="48" y="840" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">NEXT ATTEMPT</text><text x="48" y="890" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Choose a task.</text><line x1="320" y1="880" x2="394" y2="880" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="428" y="890" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Try a strategy.</text><line x1="700" y1="880" x2="774" y2="880" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="808" y="890" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep new evidence.</text><text x="48" y="984" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Name your contribution, the conditions and the limits of the claim.</text></g></svg>