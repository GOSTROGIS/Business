<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">From selected evidence to an evidence note and a next attempt</title><desc id="desc">Five examples of evidence types are a source with an explanation, a draft and revision, checked working, a file with observed tool use, and a record of an observed exchange. Select appropriate work, then add an evidence note naming the task, your own action, tools and supports, checks, result, limits and sharing permission. Use the note to choose a new task, try a strategy and keep new evidence. These are examples to choose from, not a required five-item checklist or a claim that one artifact demonstrates every skill.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><rect x="40" y="34" width="7" height="52" rx="0" fill="#D2181F" stroke="none" stroke-width="0"/><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start">PORTFOLIO / EVIDENCE ROUTE</text><text x="65" y="91" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start">Keep the work. Explain what it shows.</text><text x="66" y="150" font-size="19" fill="#D2181F" font-weight="700" text-anchor="start">EXAMPLES TO CHOOSE FROM</text><text x="444" y="150" font-size="19" fill="#D2181F" font-weight="700" text-anchor="start">EVIDENCE NOTE</text><text x="823" y="150" font-size="19" fill="#D2181F" font-weight="700" text-anchor="middle">NEXT ATTEMPT</text><path d="M67 172 H84 L102 190 V214 H67 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M84 172 V190 H102" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M74 186 L94 186" fill="none" stroke="#1A1512" stroke-width="1.5" /><path d="M74 195 L91 195" fill="none" stroke="#1A1512" stroke-width="1.5" /><text x="121" y="200" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start">Source + explanation</text><path d="M65 235 H74 L92 253 V271 H65 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M74 235 V253 H92" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M77 244 H86 L104 262 V280 H77 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="2.5" /><path d="M86 244 V262 H104" fill="none" stroke="#1A1512" stroke-width="2" /><text x="121" y="264" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start">Draft + revision</text><rect x="65" y="301" width="39" height="40" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><path d="M69 314 L99 314" fill="none" stroke="#1A1512" stroke-width="1" /><path d="M79 306 L79 336" fill="none" stroke="#1A1512" stroke-width="1" /><path d="M84 326 l5 5 11 -13" fill="none" stroke="#D2181F" stroke-width="2" /><text x="121" y="328" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start">Checked working</text><rect x="65" y="365" width="40" height="30" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><path d="M74 400 L96 400" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M85 395 L85 400" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M84 374 l4 4 9 -10" fill="none" stroke="#D2181F" stroke-width="2" /><text x="121" y="392" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start">File + tool observation</text><path d="M65 429 H100 V451 H83 L73 460 V451 H65 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><path d="M71 438 L94 438" fill="none" stroke="#1A1512" stroke-width="1.5" /><path d="M71 444 L89 444" fill="none" stroke="#1A1512" stroke-width="1.5" /><text x="121" y="456" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start">Observed exchange</text><path d="M371 188 V454 M349 188 H371 M349 454 H371" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M374 320 L419 320" fill="none" stroke="#D2181F" stroke-width="4" marker-end="url(#red)"/><path d="M442 185 H661 L679 203 V464 H442 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M661 185 V203 H679" fill="none" stroke="#1A1512" stroke-width="2" /><text x="464" y="231" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start">MY EVIDENCE</text><circle cx="467" cy="275" r="4" fill="#D2181F" stroke="#D2181F" stroke-width="1"/><text x="481" y="282" font-size="19" fill="#1A1512" font-weight="400" text-anchor="start">Task + my action</text><circle cx="467" cy="318" r="4" fill="#D2181F" stroke="#D2181F" stroke-width="1"/><text x="481" y="325" font-size="19" fill="#1A1512" font-weight="400" text-anchor="start">Tools + supports</text><circle cx="467" cy="361" r="4" fill="#D2181F" stroke="#D2181F" stroke-width="1"/><text x="481" y="368" font-size="19" fill="#1A1512" font-weight="400" text-anchor="start">Checks + result</text><circle cx="467" cy="404" r="4" fill="#D2181F" stroke="#D2181F" stroke-width="1"/><text x="481" y="411" font-size="19" fill="#1A1512" font-weight="400" text-anchor="start">Limits + permission</text><path d="M698 320 L748 320" fill="none" stroke="#D2181F" stroke-width="4" marker-end="url(#red)"/><circle cx="837" cy="293" r="58" fill="#FFFFFF" stroke="#1A1512" stroke-width="3"/><circle cx="837" cy="293" r="35" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><circle cx="837" cy="293" r="10" fill="#D2181F" stroke="#D2181F" stroke-width="1"/><path d="M903 225 L849 281" fill="none" stroke="#D2181F" stroke-width="4" marker-end="url(#red)"/><text x="837" y="391" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Choose a task.</text><text x="837" y="425" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">Try a strategy.</text><text x="837" y="459" font-size="22" fill="#1A1512" font-weight="400" text-anchor="middle">Keep new evidence.</text><text x="65" y="528" font-size="24" fill="#1A1512" font-weight="700" text-anchor="start">Name your contribution, the conditions and the limits of the claim.</text><path d="M40 557 L960 557" fill="none" stroke="#1A1512" stroke-width="1" /><text x="40" y="584" font-size="17" fill="#73675E" font-weight="400" text-anchor="start">Five example evidence types · Select the items that fit your learning goal.</text><text x="960" y="584" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end">ACCESS IS4S</text></g></svg>
