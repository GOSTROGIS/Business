<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Keep the sources with the work.</title><desc id="desc">Three source documents feed the first project work: A is the current version 2 notice, B the earlier message plus room facts, and C the supplies quote with prices and rules. CP01–CP04 produce CP01-budget-v1. A change card issued 8 May 2027 leads to CP05–CP06 and CP01-budget-v2. The first work is retained and the revision saved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">INTEGRATED PROJECT 1 / DOCUMENTS + VERSIONS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the sources with the work.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Your event decisions and calculations remain part of the task.</text><text x="48" y="243" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">THREE INITIAL DOCUMENTS</text><path d="M48 273 H354 L392 311 V479 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M354 273 V311 H392" stroke="#1A1512" stroke-width="3" fill="none"/><text x="76" y="325" font-size="42" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">A</text><text x="76" y="379" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Current notice</text><text x="76" y="422" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Version 2</text><path d="M428 273 H734 L772 311 V479 H428 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M734 273 V311 H772" stroke="#1A1512" stroke-width="3" fill="none"/><text x="456" y="325" font-size="42" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">B</text><text x="456" y="379" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Earlier message</text><text x="456" y="422" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">+ room facts</text><path d="M808 273 H1114 L1152 311 V479 H808 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M1114 273 V311 H1152" stroke="#1A1512" stroke-width="3" fill="none"/><text x="836" y="325" font-size="42" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">C</text><text x="836" y="379" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Supplies quote</text><text x="836" y="422" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Prices + rules</text><path d="M219 487 V523 H600 V556 M599 487 V523 M979 487 V523 H600" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="583" width="495" height="158" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="624" font-size="25" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">FIRST WORK · CP-01–CP-04</text><text x="78" y="682" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">CP01-budget-v1</text><rect x="705" y="583" width="447" height="158" rx="14" fill="#FFFFFF" stroke="#D2181F" stroke-width="3" /><text x="735" y="626" font-size="25" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">CHANGE CARD</text><text x="735" y="680" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Issued 8 May 2027</text><path d="M552 662 H682" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="614" y="627" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">READ</text><path d="M928 751 V802 H629" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="790" width="555" height="151" rx="14" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="78" y="833" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">REVISED WORK · CP-05–CP-06</text><text x="78" y="892" font-size="40" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CP01-budget-v2</text><text x="657" y="861" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Check changes. Keep the first</text><text x="657" y="899" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">work. Save the revision.</text><text x="48" y="1001" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Version names help make the history of a decision inspectable.</text></g></svg>