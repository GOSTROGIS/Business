<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Project 1 document and work-version workflow</title><desc id="desc">The planning package has Document A, the current notice version 2; Document B, the earlier message and room facts; and Document C, the supplies quote. Use the initial documents for CP-01 to CP-04 and save the first budget as CP01-budget-v1. Read the change card issued 8 May 2027 before the revised work in CP-05 and CP-06; save the revised budget as CP01-budget-v2 and preserve the first work. The diagram provides no event calculations or revised schedule.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><rect x="40" y="34" width="7" height="52" rx="0" fill="#D2181F" stroke="none" stroke-width="0"/><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start">INTEGRATED PROJECT 1 / PROCESS PREVIEW</text><text x="65" y="91" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start">Keep the sources. Keep your versions.</text><text x="65" y="149" font-size="19" fill="#D2181F" font-weight="700" text-anchor="start">THREE INITIAL DOCUMENTS</text><path d="M65 172 H167 L185 190 V298 H65 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M167 172 V190 H185" fill="none" stroke="#1A1512" stroke-width="2" /><text x="125" y="221" font-size="40" fill="#1A1512" font-weight="700" text-anchor="middle">A</text><path d="M85 242 L161 242" fill="none" stroke="#73675E" stroke-width="2" /><path d="M85 256 L148 256" fill="none" stroke="#73675E" stroke-width="2" /><path d="M85 270 L155 270" fill="none" stroke="#73675E" stroke-width="2" /><text x="125" y="327" font-size="19" fill="#1A1512" font-weight="700" text-anchor="middle">Current notice</text><text x="125" y="353" font-size="18" fill="#73675E" font-weight="400" text-anchor="middle">Version 2</text><path d="M235 172 H337 L355 190 V298 H235 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M337 172 V190 H355" fill="none" stroke="#1A1512" stroke-width="2" /><text x="295" y="221" font-size="40" fill="#1A1512" font-weight="700" text-anchor="middle">B</text><path d="M255 242 L331 242" fill="none" stroke="#73675E" stroke-width="2" /><path d="M255 256 L318 256" fill="none" stroke="#73675E" stroke-width="2" /><path d="M255 270 L325 270" fill="none" stroke="#73675E" stroke-width="2" /><text x="295" y="327" font-size="19" fill="#1A1512" font-weight="700" text-anchor="middle">Earlier message</text><text x="295" y="353" font-size="18" fill="#73675E" font-weight="400" text-anchor="middle">+ room facts</text><path d="M405 172 H507 L525 190 V298 H405 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M507 172 V190 H525" fill="none" stroke="#1A1512" stroke-width="2" /><text x="465" y="221" font-size="40" fill="#1A1512" font-weight="700" text-anchor="middle">C</text><path d="M425 242 L501 242" fill="none" stroke="#73675E" stroke-width="2" /><path d="M425 256 L488 256" fill="none" stroke="#73675E" stroke-width="2" /><path d="M425 270 L495 270" fill="none" stroke="#73675E" stroke-width="2" /><text x="465" y="327" font-size="19" fill="#1A1512" font-weight="700" text-anchor="middle">Supplies quote</text><text x="465" y="353" font-size="18" fill="#73675E" font-weight="400" text-anchor="middle">Prices + rules</text><path d="M549 232 L624 232" fill="none" stroke="#D2181F" stroke-width="4" marker-end="url(#red)"/><path d="M653 178 V160 H770.18 L792.5 178 H932 V331 H653 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="3" /><text x="677" y="213" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start">FIRST WORK</text><text x="677" y="247" font-size="25" fill="#D2181F" font-weight="700" text-anchor="start">CP-01–CP-04</text><text x="677" y="292" font-size="22" fill="#1A1512" font-weight="400" text-anchor="start">CP01-budget-v1</text><path d="M794 340 L794 369" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#red)"/><path d="M651 387 H915 L933 405 V495 H651 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="2.5" /><path d="M915 387 V405 H933" fill="none" stroke="#1A1512" stroke-width="2" /><text x="676" y="425" font-size="22" fill="#1A1512" font-weight="700" text-anchor="start">CHANGE CARD</text><text x="676" y="462" font-size="21" fill="#1A1512" font-weight="400" text-anchor="start">Issued 8 May 2027</text><path d="M632 444 L517 444" fill="none" stroke="#D2181F" stroke-width="4" marker-end="url(#red)"/><text x="572" y="417" font-size="17" fill="#D2181F" font-weight="700" text-anchor="middle">READ</text><path d="M65 410 V392 H241.82 L275.5 410 H486 V510 H65 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="3" /><text x="89" y="435" font-size="22" fill="#1A1512" font-weight="700" text-anchor="start">REVISED WORK · CP-05–CP-06</text><text x="89" y="475" font-size="24" fill="#D2181F" font-weight="700" text-anchor="start">CP01-budget-v2</text><text x="65" y="540" font-size="22" fill="#1A1512" font-weight="700" text-anchor="start">Check changes. Keep the first work. Save the revision.</text><path d="M40 557 L960 557" fill="none" stroke="#1A1512" stroke-width="1" /><text x="40" y="584" font-size="17" fill="#73675E" font-weight="400" text-anchor="start">Process preview · Your event decisions and calculations remain part of the task.</text><text x="960" y="584" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end">ACCESS IS4S</text></g></svg>
