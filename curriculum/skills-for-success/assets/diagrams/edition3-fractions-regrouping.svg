<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc"><title id="title">Make the parts the same size.</title><desc id="desc">Three eighths is six sixteenths. Adding five sixteenths gives eleven sixteenths. Four and one eighth is four and two sixteenths, or three and eighteen sixteenths. Subtracting two and three sixteenths leaves one and fifteen sixteenths. Adding the difference to the subtracted quantity returns four and one eighth.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1300" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">NUMERACY / EQUIVALENCE + REGROUPING</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Make the parts the same size.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">The quantity stays the same when you rename it in equal parts.</text><text x="48" y="260" font-size="62" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="151" y="250" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">ADD WITH EQUAL PARTS</text><text x="151" y="296" font-size="40" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3/8 + 5/16</text><rect x="151.0" y="339" width="80.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="231.0" y="339" width="80.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="311.0" y="339" width="80.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="391.0" y="339" width="80.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="471.0" y="339" width="80.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="551.0" y="339" width="80.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="631.0" y="339" width="80.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="711.0" y="339" width="80.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><text x="828" y="372" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3 eighths</text><line x1="471" y1="397" x2="471" y2="436" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><rect x="151.0" y="453" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="191.0" y="453" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="231.0" y="453" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="271.0" y="453" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="311.0" y="453" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="351.0" y="453" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="391.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="431.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="471.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="511.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="551.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="591.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="631.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="671.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="711.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="751.0" y="453" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><text x="828" y="487" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">6 sixteenths</text><text x="151" y="558" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3/8 = 6/16</text><text x="471" y="558" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">6/16 + 5/16 = 11/16</text><rect x="151.0" y="595" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="191.0" y="595" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="231.0" y="595" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="271.0" y="595" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="311.0" y="595" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="351.0" y="595" width="40.0" height="47" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.6" /><rect x="391.0" y="595" width="40.0" height="47" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.6" /><rect x="431.0" y="595" width="40.0" height="47" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.6" /><rect x="471.0" y="595" width="40.0" height="47" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.6" /><rect x="511.0" y="595" width="40.0" height="47" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.6" /><rect x="551.0" y="595" width="40.0" height="47" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.6" /><rect x="591.0" y="595" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="631.0" y="595" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="671.0" y="595" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="711.0" y="595" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><rect x="751.0" y="595" width="40.0" height="47" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.6" /><text x="828" y="630" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">11/16</text><text x="151" y="688" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Same whole. Same-sized parts. Add the number of parts.</text><line x1="48" y1="731" x2="1152" y2="731" stroke="#D8CBC1" stroke-width="2"/><text x="48" y="812" font-size="62" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="151" y="801" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">EXCHANGE ONE WHOLE</text><text x="151" y="847" font-size="40" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">4 1/8 − 2 3/16</text><rect x="151" y="887" width="456" height="155" rx="10" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="177" y="930" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Rename eighths</text><text x="177" y="987" font-size="35" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">4 1/8 = 4 2/16</text><line x1="627" y1="965" x2="676" y2="965" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><rect x="699" y="887" width="453" height="155" rx="10" fill="#1A1512" stroke="none" stroke-width="1" /><text x="726" y="930" font-size="24" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">Trade 1 whole for 16/16</text><text x="726" y="987" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">4 2/16 = 3 18/16</text><text x="151" y="1098" font-size="33" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3 18/16 − 2 3/16 =</text><text x="510" y="1098" font-size="43" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">1 15/16</text><rect x="151" y="1141" width="1001" height="108" rx="8" fill="#FFF0BE" stroke="none" stroke-width="1" /><text x="177" y="1180" font-size="23" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CHECK BY ADDING BACK</text><text x="177" y="1224" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">1 15/16 + 2 3/16 = 3 18/16 = 4 2/16 = 4 1/8</text></g></svg>