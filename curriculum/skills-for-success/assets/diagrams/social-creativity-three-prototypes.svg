<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc"><title id="title">Three practice-kit shelf prototypes</title><desc id="desc">Option A is a labelled folder with a contents list and check-needed marker. Option B is a matching board with labelled spaces for the Number Check kit: one data table, one worked example and two blank sheets. Option C is a shared return tray that a classroom helper checks and resets. Each approach leaves a practical question for testing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1A1512" stroke-opacity=".12" stroke-width="3"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#F7F4F1" stroke="none" stroke-width="2" /><rect x="40" y="35" width="7" height="48" rx="0" fill="#D2181F" stroke="none" stroke-width="2" /><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start" letter-spacing="2">CREATIVITY AND INNOVATION / CASE PREVIEW</text><text x="65" y="90" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start" >Three ways to make a kit visible.</text><text x="185" y="155" font-size="21" fill="#1A1512" font-weight="700" text-anchor="middle" >A · LABELLED FOLDER</text><text x="500" y="155" font-size="21" fill="#1A1512" font-weight="700" text-anchor="middle" >B · MATCHING BOARD</text><text x="815" y="155" font-size="21" fill="#1A1512" font-weight="700" text-a