<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Make the idea visible before choosing it.</title><desc id="desc">Three original prototypes show a labelled Number Check folder, a matching board with data, example and two blank-sheet spaces, and a return tray with N and C kits and a named helper-reset action. Questions ask whether a new user can find instructions, whether cards fit and stay together, and who checks and resets the tray. These are options to test.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="960" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">CREATIVITY / THREE POSSIBILITIES</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Make the idea visible before choosing it.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">These are options to test, not proven solutions.</text><text x="48" y="244" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">A · LABELLED FOLDER</text><rect x="48" y="277" width="344" height="414" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><path d="M76 396 V345 H182 L203 364 H364 V623 H76Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><text x="219" y="451" font-size="71" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">N</text><text x="219" y="505" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Number Check</text><circle cx="219" cy="567" r="29" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><text x="219" y="578" font-size="31" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">?</text><text x="428" y="244" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">B · MATCHING BOARD</text><rect x="428" y="277" width="344" height="414" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="456" y="313" width="288" height="65" rx="3" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="600" y="356" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Data</text><rect x="456" y="398" width="288" height="65" rx="3" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="600" y="441" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Example</text><rect x="456" y="483" width="288" height="65" rx="3" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="600" y="526" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Blank</text><rect x="456" y="568" width="288" height="65" rx="3" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="600" y="611" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Blank</text><text x="808" y="244" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">C · RETURN TRAY</text><rect x="808" y="277" width="344" height="414" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><path d="M836 508 L883 438 H1079 L1124 508 V603 H836Z" stroke="#1A1512" stroke-width="3" fill="#D8CBC1"/><line x1="836" y1="508" x2="1124" y2="508" stroke="#1A1512" stroke-width="3"/><rect x="888" y="371" width="77" height="149" rx="4" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><text x="926.5" y="427" font-size="37" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">N</text><rect x="998" y="371" width="77" height="149" rx="4" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><text x="1036.5" y="427" font-size="37" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">C</text><text x="980" y="658" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Helper resets kits</text><text x="48" y="754" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Can a new user find</text><text x="48" y="793" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">the instructions?</text><text x="428" y="754" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Will it fit the shelf</text><text x="428" y="793" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">and keep cards together?</text><text x="808" y="754" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Who will check and reset</text><text x="808" y="793" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">the tray before reuse?</text><text x="48" y="887" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Compare the user’s task, the available space and the ongoing responsibility before</text><text x="48" y="921" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">choosing a prototype.</text></g></svg>