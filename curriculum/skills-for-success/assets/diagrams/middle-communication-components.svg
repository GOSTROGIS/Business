<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Communication</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. Build shared understanding together. Six connected components: Listen with intention; Listen to understand; Speak with clarity; Speak with purpose; Adapt to audience + context; Adapt modes + tools. Speech · sign · text · AAC · another agreed accessible mode. Observe understanding, not a preferred communication style.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">06 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Communication</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Build shared understanding together.</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><path d="M42 120 H335 V274 H218 L165 318 V274 H42Z" stroke="#1A1512" stroke-width="4" fill="#FFFFFF"/><text x="77" y="178" font-size="39" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Room 2?</text><line x1="77" y1="212" x2="285" y2="212" stroke="#D8CBC1" stroke-width="10"/><path d="M106 337 H379 V474 H332 V516 L278 474 H106Z" stroke="#1A1512" stroke-width="4" fill="#FFBC00"/><text x="148" y="393" font-size="38" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Room 2.</text><text x="148" y="436" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Confirmed.</text><path d="M53 337 C20 397 50 449 91 449" stroke="#D2181F" stroke-width="5" fill="none" marker-end="url(#arrow)"/></g><text x="264" y="863" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NOTICE · PRACTISE · CHECK</text><text x="526" y="277" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="600" y="270" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Listen with intention</text><text x="600" y="306" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Attend to the purpose.</text><line x1="600" y1="330" x2="1152" y2="330" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="382" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="600" y="375" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Listen to understand</text><text x="600" y="411" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Restate and clarify.</text><line x1="600" y1="435" x2="1152" y2="435" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="487" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="600" y="480" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Speak with clarity</text><text x="600" y="516" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Organize the message.</text><line x1="600" y1="540" x2="1152" y2="540" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="592" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="600" y="585" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Speak with purpose</text><text x="600" y="621" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Make the next step clear.</text><line x1="600" y1="645" x2="1152" y2="645" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="697" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="600" y="690" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Adapt to audience + context</text><text x="600" y="726" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Ask what this person needs.</text><line x1="600" y1="750" x2="1152" y2="750" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="802" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">06</text><text x="600" y="795" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Adapt modes + tools</text><text x="600" y="831" font-size="23" font-weight="400" fill="#7A6B61" text-anchor="start" letter-spacing="0">Agree a usable way to exchange.</text><line x1="600" y1="855" x2="1152" y2="855" stroke="#D8CBC1" stroke-width="1.5"/><text x="48" y="968" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Speech · sign · text · AAC · another agreed accessible mode. Observe understanding,</text><text x="48" y="1002" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">not a preferred communication style.</text></g></svg>