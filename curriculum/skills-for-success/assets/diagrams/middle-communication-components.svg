<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">The six Communication components connected by shared understanding</title><desc id="desc">Six numbered components connect to a two-way exchange at the centre, with no fixed sequence. 1 Listen with intention: attend to the purpose. 2 Listen to understand: restate and clarify. 3 Speak with clarity: organize the message. 4 Speak with purpose: make the next step clear. 5 Adapt to your audience and contexts: ask what this person needs. 6 Adapt to other people’s communication modes and tools: agree a usable way to exchange. Distinct icons show a purpose target, clarification bubbles, organized message, purposeful request, two people and a communication device. Speech, sign, text, augmentative and alternative communication, or another agreed accessible mode can support the exchange. Observe understanding and interaction rather than accent, pace or eye contact.</desc><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1A1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D2181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="760" fill="#F7F4F1"/><text x="40" y="35" font-size="14" font-weight="700" fill="#6B625C" text-anchor="start">COMMUNICATION · SIX COMPONENTS</text><rect x="40" y="48" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="3"/><text x="40" y="86" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start">Build shared understanding together</text><text x="40" y="124" font-size="19" font-weight="400" fill="#1A1512" text-anchor="start">Receive, share and adapt. Choose a usable mode and check what the other person understood.</text><path d="M 180 325 Q 240 382 405 382" fill="none" stroke="#B7A99D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="500" y1="325" x2="500" y2="357" stroke="#B7A99D" stroke-width="2.5" /><path d="M 820 325 Q 760 382 595 382" fill="none" stroke="#B7A99D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 405 414 Q 240 414 180 454" fill="none" stroke="#B7A99D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="500" y1="435" x2="500" y2="454" stroke="#B7A99D" stroke-width="2.5" /><path d="M 595 414 Q 760 414 820 454" fill="none" stroke="#B7A99D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="180" cy="201" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><path d="M 144 174 h 55 a 9 9 0 0 1 9 9 v 30 a 9 9 0 0 1 -9 9 h -26 l -15 13 v -13 h -14 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="174" cy="197" r="14" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><circle cx="174" cy="197" r="6" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><path d="M 214 231 L 195 212" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><circle cx="133" cy="155" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="133" y="161" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">1</text><text x="180" y="297" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Listen with intention</text><text x="180" y="324" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Attend to the purpose.</text><circle cx="500" cy="201" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><path d="M 461 176 h 50 v 30 h -31 l -12 11 v -11 h -7 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 499 202 h 40 v 31 h -8 v 10 l -12 -10 h -20 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="486" y="199" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">?</text><path d="M 508 220.0 l 6.4 6.4 l 14.0 -16.0" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="453" cy="155" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="453" y="161" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">2</text><text x="500" y="297" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Listen to understand</text><text x="500" y="324" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Restate and clarify.</text><circle cx="820" cy="201" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><path d="M 783 170 h 74 v 51 h -40 l -18 14 v -14 h -16 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="798" cy="183" r="3" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5"/><line x1="808" y1="183" x2="843" y2="183" stroke="#1A1512" stroke-width="2.5" /><circle cx="798" cy="196" r="3" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5"/><line x1="808" y1="196" x2="839" y2="196" stroke="#1A1512" stroke-width="2.5" /><circle cx="798" cy="209" r="3" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5"/><line x1="808" y1="209" x2="835" y2="209" stroke="#1A1512" stroke-width="2.5" /><circle cx="773" cy="155" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="773" y="161" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">3</text><text x="820" y="297" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Speak with clarity</text><text x="820" y="324" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Organize the message.</text><circle cx="820" cy="515" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><path d="M 785 486 h 69 v 51 h -20 l -14 13 v -13 h -35 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="818" cy="512" r="15" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><path d="M 808 512 h 20" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><circle cx="773" cy="469" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="773" y="475" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">4</text><text x="820" y="611" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Speak with purpose</text><text x="820" y="638" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Make the next step clear.</text><circle cx="500" cy="515" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><g transform="translate(471 505) scale(0.7)"><circle cx="0" cy="0" r="9" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><path d="M -15 35 v -10 a 15 15 0 0 1 30 0 v 10" fill="#FFBC00" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="-7" y1="35" x2="-7" y2="49" stroke="#1A1512" stroke-width="3" /><line x1="7" y1="35" x2="7" y2="49" stroke="#1A1512" stroke-width="3" /></g><g transform="translate(529 505) scale(0.7)"><circle cx="0" cy="0" r="9" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><path d="M -15 35 v -10 a 15 15 0 0 1 30 0 v 10" fill="#F7F4F1" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="-7" y1="35" x2="-7" y2="49" stroke="#1A1512" stroke-width="3" /><line x1="7" y1="35" x2="7" y2="49" stroke="#1A1512" stroke-width="3" /></g><path d="M 486 493 Q 500 476 514 493" fill="none" stroke="#D2181F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M 514 547 Q 500 558 486 547" fill="none" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="453" cy="469" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="453" y="475" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">5</text><text x="500" y="611" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Adapt to audience + context</text><text x="500" y="638" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Ask what this person needs.</text><circle cx="180" cy="515" r="61" fill="#EEE7E0" stroke="none" stroke-width="3"/><rect x="147" y="483" width="43" height="58" rx="4" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5"/><rect x="153" y="490" width="31" height="38" rx="2" fill="#EEE7E0" stroke="none" stroke-width="3"/><circle cx="169" cy="534" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><path d="M 181 507 h 36 v 28 h -10 l -9 9 v -9 h -17 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="188" y1="516" x2="210" y2="516" stroke="#1A1512" stroke-width="2" /><line x1="188" y1="524" x2="205" y2="524" stroke="#1A1512" stroke-width="2" /><circle cx="133" cy="469" r="17" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="133" y="475" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">6</text><text x="180" y="611" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Adapt modes + tools</text><text x="180" y="638" font-size="18" font-weight="400" fill="#6B625C" text-anchor="middle">Agree a usable way to exchange.</text><path d="M 396 378 Q 500 347 604 378" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M 604 419 Q 500 450 396 419" fill="none" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="500" y="405" font-size="18" font-weight="700" fill="#1A1512" text-anchor="middle">SHARED UNDERSTANDING</text><line x1="40" y1="670" x2="960" y2="670" stroke="#C6BAB0" stroke-width="1.5" /><text x="40" y="702" font-size="20" font-weight="700" fill="#1A1512" text-anchor="start">Speech · sign · text · AAC · another agreed accessible mode</text><text x="40" y="731" font-size="17" font-weight="400" fill="#6B625C" text-anchor="start">Observe understanding and useful interaction; do not grade accent, speaking pace or eye contact.</text></g></svg>