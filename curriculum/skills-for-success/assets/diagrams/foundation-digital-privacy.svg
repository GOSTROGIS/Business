<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">Share the counts the reviewer needs.</title><desc id="desc">A practice copy and review copy display prepared, checked and remaining counts for material flow, equipment purposes and road users. The dummy personal-phone field is removed from the review copy. The useful totals are twenty-four prepared, eighteen checked and six remaining. Sharing checks name the intended recipient, minimum useful access and tool setting; a local file view does not demonstrate online permissions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1040" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">DIGITAL / PRIVACY + PURPOSE</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Share the counts the reviewer needs.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Prepare a useful copy and check the sharing settings.</text><rect x="48" y="239" width="528" height="485" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="239" width="528" height="76" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="76" y="289" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Practice copy</text><text x="76" y="352" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Prepared / checked / remaining</text><text x="76" y="404" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Material flow</text><text x="543" y="404" font-size="25" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">8 / 5 / 3</text><line x1="76" y1="426" x2="548" y2="426" stroke="#D8CBC1" stroke-width="1.5"/><text x="76" y="476" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Equipment purposes</text><text x="543" y="476" font-size="25" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">6 / 4 / 2</text><line x1="76" y1="498" x2="548" y2="498" stroke="#D8CBC1" stroke-width="1.5"/><text x="76" y="548" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Road users</text><text x="543" y="548" font-size="25" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">10 / 9 / 1</text><line x1="76" y1="570" x2="548" y2="570" stroke="#D8CBC1" stroke-width="1.5"/><rect x="68" y="596" width="488" height="79" rx="6" fill="#F7DCDA" stroke="none" stroke-width="1" /><text x="83" y="626" font-size="25" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">personal phone</text><text x="83" y="658" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">sample only</text><path d="M438 619 L478 659 M478 619 L438 659" stroke="#D2181F" stroke-width="5" fill="none"/><rect x="624" y="239" width="528" height="485" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="624" y="239" width="528" height="76" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="652" y="289" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Review copy</text><text x="652" y="352" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Prepared / checked / remaining</text><text x="652" y="404" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Material flow</text><text x="1119" y="404" font-size="25" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">8 / 5 / 3</text><line x1="652" y1="426" x2="1124" y2="426" stroke="#D8CBC1" stroke-width="1.5"/><text x="652" y="476" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Equipment purposes</text><text x="1119" y="476" font-size="25" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">6 / 4 / 2</text><line x1="652" y1="498" x2="1124" y2="498" stroke="#D8CBC1" stroke-width="1.5"/><text x="652" y="548" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Road users</text><text x="1119" y="548" font-size="25" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">10 / 9 / 1</text><line x1="652" y1="570" x2="1124" y2="570" stroke="#D8CBC1" stroke-width="1.5"/><text x="652" y="635" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Total</text><text x="1119" y="635" font-size="29" font-weight="700" fill="#1A1512" text-anchor="end" letter-spacing="0">24 / 18 / 6</text><text x="652" y="683" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Only needed information</text><text x="48" y="777" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Remove the dummy phone field before sharing.</text><text x="48" y="832" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="1">BEFORE SHARING IN AN APPROVED TOOL</text><circle cx="68" cy="883" r="20" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="68" y="891" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">1</text><text x="103" y="892" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Intended recipient</text><circle cx="448" cy="883" r="20" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="448" y="891" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">2</text><text x="483" y="892" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Minimum useful access</text><circle cx="828" cy="883" r="20" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="828" y="891" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><text x="863" y="892" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Check setting</text><text x="48" y="968" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Showing a local copy does not demonstrate an online permission setting.</text></g></svg>