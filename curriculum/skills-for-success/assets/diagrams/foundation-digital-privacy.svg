<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc">
<title id="title">Make a useful review copy</title><desc id="desc">The practice copy contains fictional card counts and a dummy personal phone field with the literal value sample only. Remove that unnecessary column from the review copy. Retain topic labels and counts: Material flow 8, 5, 3; Equipment purposes 6, 4, 2; Road users 10, 9, 1; totals 24, 18, 6. Before online sharing in an approved tool, check the intended recipient, minimum useful access and actual setting. A local copy alone does not demonstrate setting online permissions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#1A1512"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="630" fill="#F7F4F1"/>
<rect x="32" y="28" width="7" height="43" rx="0" fill="#D2181F" stroke="none" stroke-width="2"/><text x="54" y="45" font-size="16" font-weight="700" fill="#665B54" text-anchor="start">DIGITAL · PRIVACY + PURPOSE</text><text x="54" y="80" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start">Keep the counts. Remove the extra field.</text>
<rect x="52" y="118" width="350" height="310" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><text x="72" y="154" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start">Practice copy</text><text x="72" y="188" font-size="18" font-weight="400" fill="#665B54" text-anchor="start">Prepared / checked / remaining</text><line x1="72" y1="202" x2="382" y2="202" stroke="#D9D0C8" stroke-width="1"/><text x="72" y="235" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Material flow</text><text x="382" y="235" font-size="20" font-weight="700" fill="#1A1512" text-anchor="end">8 / 5 / 3</text><text x="72" y="272" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Equipment purposes</text><text x="382" y="272" font-size="20" font-weight="700" fill="#1A1512" text-anchor="end">6 / 4 / 2</text><text x="72" y="309" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Road users</text><text x="382" y="309" font-size="20" font-weight="700" fill="#1A1512" text-anchor="end">10 / 9 / 1</text><line x1="72" y1="327" x2="382" y2="327" stroke="#D9D0C8" stroke-width="1"/><rect x="65" y="340" width="324" height="72" rx="7" fill="#FCE4E5" stroke="none" stroke-width="2"/><text x="77" y="366" font-size="20" font-weight="700" fill="#D2181F" text-anchor="start">personal phone</text><text x="77" y="395" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">sample only</text><line x1="353" y1="371" x2="369" y2="387" stroke="#D2181F" stroke-width="4"/><line x1="369" y1="371" x2="353" y2="387" stroke="#D2181F" stroke-width="4"/><rect x="598" y="118" width="350" height="310" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><text x="618" y="154" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start">Review copy</text><text x="618" y="188" font-size="18" font-weight="400" fill="#665B54" text-anchor="start">Prepared / checked / remaining</text><line x1="618" y1="202" x2="928" y2="202" stroke="#D9D0C8" stroke-width="1"/><text x="618" y="235" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Material flow</text><text x="928" y="235" font-size="20" font-weight="700" fill="#1A1512" text-anchor="end">8 / 5 / 3</text><text x="618" y="272" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Equipment purposes</text><text x="928" y="272" font-size="20" font-weight="700" fill="#1A1512" text-anchor="end">6 / 4 / 2</text><text x="618" y="309" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Road users</text><text x="928" y="309" font-size="20" font-weight="700" fill="#1A1512" text-anchor="end">10 / 9 / 1</text><line x1="618" y1="327" x2="928" y2="327" stroke="#D9D0C8" stroke-width="1"/><text x="618" y="368" font-size="22" font-weight="700" fill="#1A1512" text-anchor="start">Total</text><text x="928" y="368" font-size="22" font-weight="700" fill="#1A1512" text-anchor="end">24 / 18 / 6</text><path d="M 619 398 l 7 7 l 14 -17" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="405" font-size="20" font-weight="700" fill="#1A1512" text-anchor="start">Only needed information</text><line x1="426" y1="250" x2="569" y2="250" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="499" y="305" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">Remove the</text><text x="499" y="331" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">dummy phone</text><text x="499" y="357" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">column</text><text x="54" y="471" font-size="17" font-weight="700" fill="#665B54" text-anchor="start">BEFORE SHARING IN AN APPROVED TOOL</text><circle cx="70" cy="511" r="18" fill="#FFBC00" stroke="none" stroke-width="2"/><text x="70" y="518" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">1</text><text x="98" y="519" font-size="21" font-weight="700" fill="#1A1512" text-anchor="start">Intended recipient</text><circle cx="407" cy="511" r="18" fill="#FFBC00" stroke="none" stroke-width="2"/><text x="407" y="518" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">2</text><text x="435" y="519" font-size="21" font-weight="700" fill="#1A1512" text-anchor="start">Minimum useful access</text><circle cx="790" cy="511" r="18" fill="#FFBC00" stroke="none" stroke-width="2"/><text x="790" y="518" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">3</text><text x="818" y="519" font-size="21" font-weight="700" fill="#1A1512" text-anchor="start">Check setting</text><text x="54" y="564" font-size="21" font-weight="400" fill="#665B54" text-anchor="start">Showing a local copy does not demonstrate online permission-setting.</text>
