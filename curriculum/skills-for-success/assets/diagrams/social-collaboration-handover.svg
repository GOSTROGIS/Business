<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Pass on what is finished—and what is open.</title><desc id="desc">A checked visitor schedule lists welcome at 10:00, an equipment activity at 10:10, questions at 10:30 and finish at 10:45. The receiving partner retains those confirmed times while readability and copy formats remain pending. The team asks the coordinator before printing.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="950" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">COLLABORATION / HANDOVER</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Pass on what is finished—and what is open.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">The receiver checks back before continuing.</text><rect x="48" y="234" width="500" height="522" rx="7" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="234" width="10" height="522" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="78" y="279" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">AUTHOR CHECKS</text><text x="78" y="337" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">VISITOR SCHEDULE</text><line x1="105" y1="377" x2="105" y2="661" stroke="#1A1512" stroke-width="3"/><circle cx="105" cy="398" r="11" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="134" y="407" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">10:00</text><text x="254" y="407" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Welcome</text><circle cx="105" cy="480" r="11" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="134" y="489" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">10:10</text><text x="254" y="489" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Equipment activity</text><circle cx="105" cy="562" r="11" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="134" y="571" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">10:30</text><text x="254" y="571" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Questions</text><circle cx="105" cy="644" r="11" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="134" y="653" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">10:45</text><text x="254" y="653" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Finish</text><line x1="573" y1="470" x2="630" y2="470" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><text x="669" y="279" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">RECEIVER CHECKS BACK</text><rect x="669" y="318" width="483" height="136" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="698" y="359" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">CONFIRMED</text><text x="698" y="408" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Keep the checked times</text><rect x="669" y="486" width="483" height="222" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="698" y="529" font-size="22" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">STILL PENDING</text><circle cx="716" cy="575" r="20" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="716" y="583" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">?</text><text x="753" y="584" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Check readability</text><circle cx="716" cy="638" r="20" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="716" y="646" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">?</text><text x="753" y="647" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Confirm copy formats</text><rect x="48" y="805" width="1104" height="86" rx="12" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="78" y="858" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Ask the coordinator before printing. A pending question stays visible.</text></g></svg>