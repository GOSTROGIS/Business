<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc"><title id="title">A useful visitor-pack handover</title><desc id="desc">The author confirms the visitor schedule: welcome at 10:00, equipment activity at 10:10, questions at 10:30 and finish at 10:45. The handover distinguishes confirmed times from pending checks. The receiver keeps the times, checks readability and confirms copy formats with the coordinator before printing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1A1512" stroke-opacity=".12" stroke-width="3"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#F7F4F1" stroke="none" stroke-width="2" /><rect x="40" y="35" width="7" height="48" rx="0" fill="#D2181F" stroke="none" stroke-width="2" /><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start" letter-spacing="2">COLLABORATION / WORKED EXAMPLE</text><text x="65" y="90" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start" >A handover carries the whole status.</text><text x="64" y="150" font-size="20" fill="#D2181F" font-weight="700" text-anchor="start" >AUTHOR CHECKS</text><text x="651" y="150" font-size="20" fill="#D2181F" font-weight="700" text-anchor="start" >RECEIVER CHECKS BACK</text><path d="M63 195 V177 H206.64 L234.0 195 H405 V459 H63 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="3" /><text x="90" y="235" font-size="22" fill="#1A1512" font-weight="700" text-anchor="start" >VISITOR SCHEDULE</text><circle cx="93" cy="267" r="5" fill="#D2181F" stroke="none" stroke-width="2"/><text x="111" y="274" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >10:00</text><text x="198" y="274" font-size="20" fill="#1A1512" font-weight="400" text-anchor="start" >Welcome</text><line x1="93" y1="275" x2="93" y2="301" stroke="#73675E" stroke-width="1.5" /><circle cx="93" cy="310" r="5" fill="#D2181F" stroke="none" stroke-width="2"/><text x="111" y="317" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >10:10</text><text x="198" y="317" font-size="20" fill="#1A1512" font-weight="400" text-anchor="start" >Equipment activity</text><line x1="93" y1="318" x2="93" y2="344" stroke="#73675E" stroke-width="1.5" /><circle cx="93" cy="353" r="5" fill="#D2181F" stroke="none" stroke-width="2"/><text x="111" y="360" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >10:30</text><text x="198" y="360" font-size="20" fill="#1A1512" font-weight="400" text-anchor="start" >Questions</text><line x1="93" y1="361" x2="93" y2="387" stroke="#73675E" stroke-width="1.5" /><circle cx="93" cy="396" r="5" fill="#D2181F" stroke="none" stroke-width="2"/><text x="111" y="403" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >10:45</text><text x="198" y="403" font-size="20" fill="#1A1512" font-weight="400" text-anchor="start" >Finish</text><line x1="426" y1="279" x2="604" y2="279" stroke="#D2181F" stroke-width="5" marker-end="url(#arrow-red)"/><text x="516" y="246" font-size="17" fill="#D2181F" font-weight="700" text-anchor="middle" >CONFIRMED</text><line x1="426" y1="385" x2="604" y2="385" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="516" y="420" font-size="16" fill="#1A1512" font-weight="700" text-anchor="middle" >STILL PENDING</text><circle cx="640" cy="261" r="15" fill="#FFBC00" stroke="none" stroke-width="2"/><path d="M633 261 l5 5 9 -11" fill="none" stroke="#1A1512" stroke-width="3" /><text x="670" y="267" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >Keep the checked times</text><circle cx="640" cy="329" r="15" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><text x="640" y="337" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle" >?</text><text x="670" y="335" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >Check readability</text><circle cx="640" cy="397" r="15" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><text x="640" y="405" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle" >?</text><text x="670" y="403" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >Confirm copy formats</text><text x="650" y="454" font-size="20" fill="#73675E" font-weight="400" text-anchor="start" >Ask the coordinator before printing.</text><line x1="40" y1="531" x2="960" y2="531" stroke="#1A1512" stroke-width="1" /><text x="40" y="559" font-size="17" fill="#73675E" font-weight="400" text-anchor="start" >Preview of worked example 3 · A pending question stays visible.</text><text x="960" y="559" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end" >ACCESS IS4S</text></g></svg>
