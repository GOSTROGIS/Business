<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Six approaches, planned together</title><desc id="desc">A connected path joins learner-centred purpose, contextualized work, complexity, direct instruction, assessment and social-emotional participation. A return arrow shows that evidence can lead the practitioner to revisit the plan.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#1A1512" stroke-width="1.8"/></marker></defs><rect width="1000" height="580" fill="#F7F4F1"/><g font-family="Arial, Helvetica, sans-serif" fill="#1A1512"><text x="45" y="48" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start">Six approaches, planned together</text><text x="45" y="82" font-size="21" font-weight="400" fill="#1A1512" text-anchor="start">Revisit the plan as the learner’s evidence changes.</text><path d="M240 180H424" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><path d="M570 180H754" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><path d="M895 180H945V382H900" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><path d="M760 382H576" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><path d="M430 382H246" fill="none" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><path d="M105 382H60V180H95" fill="none" stroke="#B9AFA6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><circle cx="170" cy="180" r="57" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(170 180) scale(0.9)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle r="25"/><circle r="13"/><circle r="3"/><path d="M0 0L27-27 M16-27H27V-16"/></g><circle cx="128" cy="138" r="19" fill="#D2181F"/><text x="128" y="145" font-size="21" font-weight="700" fill="#F7F4F1" text-anchor="middle">1</text><text x="170" y="268" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Learner-centred</text><text x="170" y="295" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">Start with a purpose</text><circle cx="500" cy="180" r="57" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(500 180) scale(0.9)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-25 24H-3Q14 24 14 9Q14-7-3-7H-9Q-25-7-25-23H17 M7-32L17-23L7-14"/></g><circle cx="458" cy="138" r="19" fill="#D2181F"/><text x="458" y="145" font-size="21" font-weight="700" fill="#F7F4F1" text-anchor="middle">2</text><text x="500" y="268" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Contextualized</text><text x="500" y="295" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">Use a meaningful task</text><circle cx="830" cy="180" r="57" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(830 180) scale(0.9)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-28 25H-10V8H7V-9H25V-27 M-28 33H32"/></g><circle cx="788" cy="138" r="19" fill="#D2181F"/><text x="788" y="145" font-size="21" font-weight="700" fill="#F7F4F1" text-anchor="middle">3</text><text x="830" y="268" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Complexity</text><text x="830" y="295" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">Adjust the demand</text><circle cx="830" cy="382" r="57" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(830 382) scale(0.9)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-27" y="-23" width="54" height="42" rx="3"/><path d="M-12-13L11-2L-12 10Z M0 19V29 M-15 29H15"/></g><circle cx="788" cy="340" r="19" fill="#D2181F"/><text x="788" y="347" font-size="21" font-weight="700" fill="#F7F4F1" text-anchor="middle">4</text><text x="830" y="470" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Direct instruction</text><text x="830" y="497" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">Model the strategy</text><circle cx="500" cy="382" r="57" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(500 382) scale(0.9)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M-23-27H9L23-13V27H-23Z M9-27V-13H23 M-14 9L-4 19L13-3"/></g><circle cx="458" cy="340" r="19" fill="#D2181F"/><text x="458" y="347" font-size="21" font-weight="700" fill="#F7F4F1" text-anchor="middle">5</text><text x="500" y="470" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Assessment</text><text x="500" y="497" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">Use individual evidence</text><circle cx="170" cy="382" r="57" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><g transform="translate(170 382) scale(0.9)" stroke="#1A1512" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="-15" cy="-13" r="8"/><circle cx="15" cy="-13" r="8"/><path d="M-29 24V15Q-29 2-15 2Q-1 2-1 15 M1 15Q1 2 15 2Q29 2 29 15V24 M-14 24H14"/></g><circle cx="128" cy="340" r="19" fill="#D2181F"/><text x="128" y="347" font-size="21" font-weight="700" fill="#F7F4F1" text-anchor="middle">6</text><text x="170" y="470" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">Social-emotional</text><text x="170" y="497" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">Teach useful interactions</text><text x="500" y="557" font-size="19" font-weight="400" fill="#1A1512" text-anchor="middle">The approaches support one another; they are not six separate lessons.</text></g></svg>
