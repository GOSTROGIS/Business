<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">Six approaches, planned together.</title><desc id="desc">Six planning approaches surround one purposeful session: learner-centred work, contextualized tasks, complexity, direct instruction, assessment, and social-emotional teaching. The accompanying moves start with a purpose, use a meaningful task, adjust demand, model a strategy, use individual evidence and teach useful interactions. These approaches support one another within a session.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1040" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">PRACTITIONER / PLANNING THE SESSION</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Six approaches, planned together.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Revisit the plan as the learner’s evidence changes.</text><rect x="439" y="246" width="322" height="656" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="600" y="301" font-size="27" font-weight="700" fill="#FFBC00" text-anchor="middle" letter-spacing="0">ONE SESSION</text><g transform="translate(454,376) scale(0.68) rotate(0)"><g transform="translate(69,171) scale(1) rotate(-4)"><rect x="0" y="0" width="290" height="230" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="4" /></g><text x="110" y="216" font-size="21" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">SHARED TASK</text><rect x="100" y="244" width="98" height="61" rx="4" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="149" y="285" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">1</text><rect x="228" y="244" width="98" height="61" rx="4" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="277" y="285" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">2</text><rect x="100" y="328" width="98" height="61" rx="4" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="149" y="369" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><rect x="228" y="328" width="98" height="61" rx="4" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="277" y="369" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">4</text><circle cx="100" cy="97" r="23" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M61 154 Q100 112 139 154" stroke="#1A1512" stroke-width="4" fill="none"/><circle cx="316" cy="97" r="23" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M277 154 Q316 112 355 154" stroke="#1A1512" stroke-width="4" fill="none"/><circle cx="100" cy="485" r="23" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M61 542 Q100 500 139 542" stroke="#1A1512" stroke-width="4" fill="none"/><circle cx="316" cy="485" r="23" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M277 542 Q316 500 355 542" stroke="#1A1512" stroke-width="4" fill="none"/><line x1="101" y1="156" x2="132" y2="186" stroke="#FFBC00" stroke-width="7"/><line x1="313" y1="156" x2="285" y2="186" stroke="#FFBC00" stroke-width="7"/></g><text x="600" y="832" font-size="28" font-weight="700" fill="#FFBC00" text-anchor="middle" letter-spacing="0">PURPOSE</text><text x="600" y="869" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">TEACHING + EVIDENCE</text><text x="48" y="273" font-size="52" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="48" y="332" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Learner-centred</text><text x="48" y="374" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Start with a purpose</text><line x1="48" y1="422" x2="390" y2="422" stroke="#D8CBC1" stroke-width="2"/><line x1="395" y1="355" x2="424" y2="355" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="482" font-size="52" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="48" y="541" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Contextualized</text><text x="48" y="583" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use a meaningful task</text><line x1="48" y1="631" x2="390" y2="631" stroke="#D8CBC1" stroke-width="2"/><line x1="395" y1="564" x2="424" y2="564" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="691" font-size="52" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="48" y="750" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Complexity</text><text x="48" y="792" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Adjust the demand</text><line x1="48" y1="840" x2="390" y2="840" stroke="#D8CBC1" stroke-width="2"/><line x1="395" y1="773" x2="424" y2="773" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><text x="809" y="273" font-size="52" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="809" y="332" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Direct instruction</text><text x="809" y="374" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Model the strategy</text><line x1="809" y1="422" x2="1151" y2="422" stroke="#D8CBC1" stroke-width="2"/><line x1="776" y1="355" x2="795" y2="355" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><text x="809" y="482" font-size="52" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="809" y="541" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Assessment</text><text x="809" y="583" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use individual evidence</text><line x1="809" y1="631" x2="1151" y2="631" stroke="#D8CBC1" stroke-width="2"/><line x1="776" y1="564" x2="795" y2="564" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><text x="809" y="691" font-size="52" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">06</text><text x="809" y="750" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Social-emotional</text><text x="809" y="792" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Teach useful</text><text x="809" y="825" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">interactions</text><line x1="809" y1="840" x2="1151" y2="840" stroke="#D8CBC1" stroke-width="2"/><line x1="776" y1="773" x2="795" y2="773" stroke="#1A1512" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="976" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">The approaches support one another; they are not six separate lessons.</text></g></svg>