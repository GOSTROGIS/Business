<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Digital</title><desc id="desc">An original task illustration occupies the left panel; six numbered actions appear on the right. Choose the next action to meet a real task purpose. Six connected components: Use digital devices; Use tools to complete tasks; Use digital information; Use online tools and platforms; Protect privacy; act responsibly; Update your digital skills. Actual tool use supplies evidence that a paper plan cannot show.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1050" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">04 / SKILL COMPONENTS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Digital</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Choose the next action to meet a real task purpose.</text><rect x="48" y="220" width="432" height="690" rx="18" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="272" font-size="22" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="2">A USEFUL TASK</text><g transform="translate(58,280) scale(0.98) rotate(0)"><rect x="44" y="125" width="330" height="225" rx="16" fill="#FFFFFF" stroke="#1A1512" stroke-width="5" /><rect x="60" y="142" width="298" height="183" rx="6" fill="#FFF0BE" stroke="none" stroke-width="1" /><path d="M44 350 H374 L404 390 H16Z" stroke="#1A1512" stroke-width="4" fill="#D8CBC1"/><path d="M95 183 H153 L168 199 H300 V289 H95Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><text x="198" y="251" font-size="28" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">v01 → v02</text><rect x="136" y="430" width="147" height="96" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="4" /><path d="M164 432 V406 C164 357 255 357 255 406 V432" stroke="#FFBC00" stroke-width="13" fill="none"/><circle cx="210" cy="471" r="9" fill="#1A1512" stroke="none" stroke-width="1"/><rect x="206" y="473" width="8" height="22" rx="0" fill="#1A1512" stroke="none" stroke-width="1" /></g><text x="264" y="863" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NOTICE · PRACTISE · CHECK</text><text x="526" y="277" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="600" y="270" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Use digital devices</text><line x1="600" y1="330" x2="1152" y2="330" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="382" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="600" y="375" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Use tools to complete tasks</text><line x1="600" y1="435" x2="1152" y2="435" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="487" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="600" y="480" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Use digital information</text><line x1="600" y1="540" x2="1152" y2="540" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="592" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="600" y="585" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Use online tools and platforms</text><line x1="600" y1="645" x2="1152" y2="645" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="697" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="600" y="690" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Protect privacy; act responsibly</text><line x1="600" y1="750" x2="1152" y2="750" stroke="#D8CBC1" stroke-width="1.5"/><text x="526" y="802" font-size="39" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">06</text><text x="600" y="795" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Update your digital skills</text><line x1="600" y1="855" x2="1152" y2="855" stroke="#D8CBC1" stroke-width="1.5"/><text x="48" y="968" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Actual tool use supplies evidence that a paper plan cannot show.</text></g></svg>