<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="title desc">
<title id="title">Six equipment-purpose cards grouped by their roles</title><desc id="desc">Equipment names are grouped by role, with no operating instructions. Materials: E2 crusher or screen reduces material size or separates material by size; E3 asphalt plant prepares the specified mixture. Move: E4 haul truck moves paving material. Place: E5 paver receives mixture and moves it toward the screed; E1 screed helps control the thickness of the layer being placed and is shown as a component attached to the paver. Compact: E6 roller compacts placed material. These six cards help check terminology. They are distinct from the five stage labels: pit or quarry, plant, haul, place and compact.</desc><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1A1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D2181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="710" fill="#F7F4F1"/><text x="40" y="35" font-size="14" font-weight="700" fill="#6B625C" text-anchor="start">COMMUNICATION · CASE B</text><rect x="40" y="48" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="3"/><text x="40" y="86" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start">Six equipment cards. Different roles.</text><text x="40" y="123" font-size="19" font-weight="400" fill="#1A1512" text-anchor="start">Use the equipment names to check meaning while arranging the five stage labels.</text><line x1="40" y1="175" x2="395" y2="175" stroke="#1A1512" stroke-width="2" /><line x1="40" y1="175" x2="40" y2="188" stroke="#1A1512" stroke-width="2" /><line x1="395" y1="175" x2="395" y2="188" stroke="#1A1512" stroke-width="2" /><text x="217.5" y="164" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">MATERIALS</text><line x1="420" y1="175" x2="570" y2="175" stroke="#1A1512" stroke-width="2" /><line x1="420" y1="175" x2="420" y2="188" stroke="#1A1512" stroke-width="2" /><line x1="570" y1="175" x2="570" y2="188" stroke="#1A1512" stroke-width="2" /><text x="495.0" y="164" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">MOVE</text><line x1="595" y1="175" x2="785" y2="175" stroke="#1A1512" stroke-width="2" /><line x1="595" y1="175" x2="595" y2="188" stroke="#1A1512" stroke-width="2" /><line x1="785" y1="175" x2="785" y2="188" stroke="#1A1512" stroke-width="2" /><text x="690.0" y="164" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">PLACE</text><line x1="810" y1="175" x2="960" y2="175" stroke="#1A1512" stroke-width="2" /><line x1="810" y1="175" x2="810" y2="188" stroke="#1A1512" stroke-width="2" /><line x1="960" y1="175" x2="960" y2="188" stroke="#1A1512" stroke-width="2" /><text x="885.0" y="164" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">COMPACT</text><path d="M 58 250 l 31 24 h 