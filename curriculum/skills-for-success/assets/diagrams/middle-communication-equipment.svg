l="#FFBC00" stroke="#1A1512" stroke-width="4"/><rect x="93" y="99" width="125" height="37" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="3" /><rect x="134" y="54" width="66" height="49" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="3" /><rect x="125" y="44" width="84" height="12" rx="0" fill="#1A1512" stroke="none" stroke-width="1" /><line x1="142" y1="57" x2="142" y2="99" stroke="#1A1512" stroke-width="4"/><line x1="191" y1="57" x2="191" y2="99" stroke="#1A1512" stroke-width="4"/></g><text x="831" y="883" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">E6 · Roller</text><text x="831" y="920" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Compact placed</text><text x="831" y="951" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">material</text><rect x="48" y="1048" width="1104" height="122" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="1090" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">The screed is shown with the paver; it is not an extra stage label.</text><text x="78" y="1138" font-size="30" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">Pit / quarry → plant → haul → place → compact</text><text x="48" y="1211" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Introductory equipment purposes • no operating settings.</text></g></svg>