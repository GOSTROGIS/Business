 stroke="#1A1512" stroke-width="3"/><path d="M 296 264 l 14 -21 h 30 l 14 21 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="307" y1="307" x2="307" y2="329" stroke="#1A1512" stroke-width="3" /><line x1="344" y1="307" x2="344" y2="329" stroke="#1A1512" stroke-width="3" /><path d="M 279 247 h 31" fill="none" stroke="#1A1512" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="305" y="368" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">E3 · Asphalt plant</text><text x="305" y="396" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">Prepare the</text><text x="305" y="419" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">specified mixture</text><path d="M 423 256 h 80 l -6 45 h -65 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M 503 274 h 26 l 19 20 v 18 h -45 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M 512 280 h 12 l 12 14 h -24 Z" fill="#E9E1D9" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="430" y1="313" x2="548" y2="313" stroke="#1A1512" stroke-width="3" /><circle cx="446" cy="322" r="13" fill="#1A1512" stroke="#1A1512" stroke-width="3"/><circle cx="526" cy="322" r="13" fill="#1A1512" stroke="#1A1512" stroke-width="3"/><text x="495" y="368" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">E4 · Haul truck</text><text x="495" y="396" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">Move paving</text><text x="495" y="419" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">material</text><path d="M 607 270 h 45 l 11 20 h 63 v 22 H 615 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="659" y="240" width="29" height="49" rx="0" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><path d="M 654 239 h 44" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="622" y="311" width="100" height="18" rx="9" fill="#1A1512" stroke="#1A1512" stroke-width="3"/><circle cx="637" cy="320" r="5" fill="#F7F4F1" stroke="#F7F4F1" stroke-width="1"/><circle cx="658" cy="320" r="5" fill="#F7F4F1" stroke="#F7F4F1" stroke-width="1"/><circle cx="680" cy="320" r="5" fill="#F7F4F1" stroke="#F7F4F1" stroke-width="1"/><circle cx="703" cy="320" r="5" fill="#F7F4F1" stroke="#F7F4F1" stroke-width="1"/><path d="M 726 298 h 30 v 24 h -30 Z" fill="#D2181F" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="690" y="368" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">E5 · Paver</text><text x="690" y="396" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">Receive mixture;</text><text x="690" y="419" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">move it to screed</text><path d="M 756 314 H 780 V 440 H 741 V 449" fill="none" stroke="#D2181F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><circle cx="741" cy="479" r="31" fill="#F7F4F1" stroke="#D2181F" stroke-width="2"/><path d="M 715 470 h 52 v 16 h -52 Z" fill="#D2181F" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="713" y1="495" x2="770" y2="495" stroke="#1A1512" stroke-width="4" /><text x="690" y="542" font-size="17" font-weight="700" fill="#1A1512" text-anchor="middle">E1 · Screed</text><text x="690" y="568" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">Help control</text><text x="690" y="591" font-size="17" font-weight="400" fill="#1A1512" text-anchor="middle">layer thickness</text><rect x="855" y="245" width="35" height="51" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><path d="M 849 242 h 48" fill="none" stroke="