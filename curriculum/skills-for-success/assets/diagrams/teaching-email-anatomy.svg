<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc"><title id="title">Make the next action easy to find.</title><desc id="desc">An annotated fictional email names coordinator@example.invalid, a subject requesting Wednesday room and route confirmation, and a greeting. Context gives Wednesday 9:00–10:30 a.m. for eight participants, booked Room 3 and possible Room 5. The action asks for room and step-free-route confirmation by 3:00 p.m. Tuesday. The reply will inform the final notice. The sign-off identifies the training team; Room 5 remains unconfirmed and no participant contact list is attached.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1090" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">WRITING / MESSAGE ANATOMY</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Make the next action easy to find.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A clear request keeps the facts and the confirmation boundary visible.</text><rect x="48" y="235" width="729" height="719" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="235" width="729" height="75" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="76" y="282" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">To: coordinator@example.invalid</text><text x="76" y="361" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Subject: Confirm Wednesday room</text><text x="76" y="403" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">and route information</text><line x1="76" y1="435" x2="747" y2="435" stroke="#D8CBC1" stroke-width="2"/><text x="76" y="483" font-size="27" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Hello Training Coordinator,</text><text x="76" y="549" font-size="28" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Wednesday • 9:00–10:30 a.m.</text><text x="76" y="589" font-size="28" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">8 participants</text><text x="76" y="635" font-size="28" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Booked: Room 3. Room 5 is possible.</text><rect x="65" y="668" width="695" height="132" rx="8" fill="#FFF0BE" stroke="#FFBC00" stroke-width="2" /><text x="84" y="710" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Please confirm the room and step-free route</text><text x="84" y="751" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">information by 3:00 p.m. Tuesday.</text><text x="76" y="844" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">We will use your reply for the final notice.</text><text x="76" y="894" font-size="27" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Thank you,</text><text x="76" y="932" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Training team</text><line x1="789" y1="271" x2="825" y2="271" stroke="#D2181F" stroke-width="3"/><text x="845" y="279" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="845" y="319" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">RECIPIENT</text><text x="845" y="354" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">The right person or role</text><line x1="789" y1="378" x2="825" y2="378" stroke="#D2181F" stroke-width="3"/><text x="845" y="386" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="845" y="426" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">SUBJECT</text><text x="845" y="461" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A useful purpose label</text><line x1="789" y1="582" x2="825" y2="582" stroke="#D2181F" stroke-width="3"/><text x="845" y="590" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="845" y="630" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CONTEXT</text><text x="845" y="665" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Facts and current status</text><line x1="789" y1="725" x2="825" y2="725" stroke="#D2181F" stroke-width="3"/><text x="845" y="733" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="845" y="773" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">REQUEST</text><text x="845" y="808" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">What is needed, by when</text><line x1="789" y1="904" x2="825" y2="904" stroke="#D2181F" stroke-width="3"/><text x="845" y="912" font-size="29" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="845" y="952" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">SIGN-OFF</text><text x="845" y="987" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A clear sender identity</text><text x="48" y="1012" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Draft only • Room 5 is unconfirmed • No participant contact list attached</text></g></svg>