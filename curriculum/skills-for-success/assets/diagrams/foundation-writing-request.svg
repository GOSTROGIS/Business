<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Give the reader a clear next step.</title><desc id="desc">An annotated request asks the resource helper for two calculators by 09:00 on Practice Thursday. Four available plus two requested would make six for pairs. The loan is pending, borrowed items are to return by 11:45, and the request is due by 15:00 on Practice Wednesday. The callouts identify reader, needed facts and requested confirmation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="900" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">WRITING / READER + FACTS + ACTION</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Give the reader a clear next step.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A request supplies what is needed and keeps unconfirmed details visible.</text><rect x="48" y="231" width="716" height="440" rx="12" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="231" width="716" height="80" rx="12" fill="#1A1512" stroke="none" stroke-width="1" /><text x="79" y="281" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Request: two calculators</text><text x="79" y="359" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">To: Resource desk helper</text><text x="79" y="408" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Need 2 more by 09:00 · Practice Thursday</text><text x="79" y="457" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">4 available + 2 requested = 6 for pairs</text><text x="79" y="506" font-size="26" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">Loan still pending</text><text x="79" y="555" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Return borrowed items by 11:45</text><text x="79" y="604" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Please confirm whether two are available.</text><line x1="776" y1="349" x2="824" y2="349" stroke="#D2181F" stroke-width="3"/><text x="847" y="359" font-size="28" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="847" y="397" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Name the reader</text><text x="847" y="430" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Who can respond?</text><line x1="776" y1="447" x2="824" y2="447" stroke="#D2181F" stroke-width="3"/><text x="847" y="457" font-size="28" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="847" y="495" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Give needed facts</text><text x="847" y="528" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Quantity, time, return</text><line x1="776" y1="593" x2="824" y2="593" stroke="#D2181F" stroke-width="3"/><text x="847" y="603" font-size="28" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="847" y="641" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Ask for an action</text><text x="847" y="674" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Request confirmation</text><rect x="48" y="719" width="1104" height="120" rx="14" fill="#FFF0BE" stroke="none" stroke-width="1" /><text x="78" y="760" font-size="22" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">REQUEST BY</text><text x="78" y="803" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">15:00 · Practice Wednesday</text><line x1="585" y1="747" x2="585" y2="817" stroke="#1A1512" stroke-width="2"/><text x="624" y="760" font-size="22" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">NEEDED AT</text><text x="624" y="803" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">09:00 · Practice Thursday</text><text x="48" y="879" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Fictional classroom request • a calculated need is not a confirmed loan.</text></g></svg>