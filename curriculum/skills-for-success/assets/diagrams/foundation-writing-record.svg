<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Keep the event and its evidence clear.</title><desc id="desc">A factual record compares a delivery note of twenty-four copies with an independent count of twenty-two, a difference of two with no confirmed cause. The timeline records receipt at 09:10, recount at 09:15 and informing the instructor at 09:20.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="900" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">WRITING / FACTUAL RECORD</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the event and its evidence clear.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Separate quantities, timing and unresolved causes.</text><rect x="48" y="229" width="1104" height="200" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><text x="83" y="278" font-size="23" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">DELIVERY NOTE</text><text x="83" y="350" font-size="49" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">24 copies</text><text x="474" y="278" font-size="23" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">INDEPENDENT COUNT</text><text x="474" y="350" font-size="49" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">22 copies</text><text x="880" y="278" font-size="23" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">DIFFERENCE</text><text x="880" y="350" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">2 copies</text><text x="83" y="396" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Cause: not confirmed</text><line x1="108" y1="490" x2="108" y2="755" stroke="#1A1512" stroke-width="4"/><circle cx="108" cy="505" r="15" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="153" y="514" font-size="36" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">09:10</text><text x="348" y="514" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Box received</text><text x="348" y="556" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Northside resource desk</text><circle cx="108" cy="625" r="15" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="153" y="634" font-size="36" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">09:15</text><text x="348" y="634" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Recount completed</text><text x="348" y="676" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">22 copies independently counted</text><circle cx="108" cy="745" r="15" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="153" y="754" font-size="36" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">09:20</text><text x="348" y="754" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Instructor informed</text><text x="348" y="796" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Written record requested</text><text x="48" y="861" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Fictional classroom record • report what is known without inventing a cause.</text></g></svg>