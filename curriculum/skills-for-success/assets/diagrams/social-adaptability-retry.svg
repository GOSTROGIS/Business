<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Change the step the evidence points to.</title><desc id="desc">Four actions compare the source value ninety with an incorrect entry of nine, correct the entry to ninety, recalculate, and compare the new result with the paper work. The strategy, action and new check provide evidence of a useful retry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="900" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">ADAPTABILITY / A CHECKED RETRY</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Change the step the evidence points to.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use the source, make the correction, and check the new result.</text><rect x="48" y="235" width="1104" height="266" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><text x="77" y="280" font-size="25" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">01  COMPARE THE ROW</text><text x="77" y="332" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">SOURCE</text><text x="77" y="442" font-size="102" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">90</text><text x="370" y="332" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">ENTRY</text><text x="370" y="442" font-size="102" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">9</text><text x="264" y="427" font-size="64" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">≠</text><line x1="537" y1="277" x2="537" y2="460" stroke="#D8CBC1" stroke-width="2"/><text x="579" y="280" font-size="25" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">02  CORRECT THE ENTRY</text><text x="580" y="420" font-size="88" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">9</text><line x1="688" y1="391" x2="803" y2="391" stroke="#FFFFFF" stroke-width="4" marker-end="url(#arrow)"/><text x="843" y="420" font-size="88" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">90</text><text x="579" y="471" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">One entry changes.</text><text x="48" y="564" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03  RECALCULATE</text><rect x="48" y="594" width="112" height="122" rx="10" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><rect x="63" y="609" width="82" height="35" rx="4" fill="#1A1512" stroke="none" stroke-width="1" /><rect x="65" y="657" width="17" height="15" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="1" /><rect x="93" y="657" width="17" height="15" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="1" /><rect x="121" y="657" width="17" height="15" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="1" /><rect x="65" y="681" width="17" height="15" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="1" /><rect x="93" y="681" width="17" height="15" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="1" /><rect x="121" y="681" width="17" height="15" rx="2" fill="#FFFFFF" stroke="#1A1512" stroke-width="1" /><text x="191" y="631" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use the corrected entry.</text><text x="624" y="564" font-size="27" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04  CHECK PAPER WORK</text><path d="M624 594 H698 L736 632 V716 H624 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M698 594 V632 H736" stroke="#1A1512" stroke-width="3" fill="none"/><path d="M647 659 L664 675 L701 632" stroke="#D2181F" stroke-width="5" fill="none"/><text x="767" y="631" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Compare with the paper</text><text x="767" y="667" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">result.</text><text x="48" y="801" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Record the strategy used and what the new check shows. Effort becomes useful</text><text x="48" y="835" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">evidence through a check.</text></g></svg>