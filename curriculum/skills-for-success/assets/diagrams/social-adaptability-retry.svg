<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc"><title id="title">Follow the evidence when retrying a table calculation</title><desc id="desc">The worked example compares a source value of 90 with an entered value of 9. The learner corrects the entry to 90, recalculates, and checks against the paper work. No total or other source-row value is supplied in this diagram.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1A1512" stroke-opacity=".12" stroke-width="3"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#F7F4F1" stroke="none" stroke-width="2" /><rect x="40" y="35" width="7" height="48" rx="0" fill="#D2181F" stroke="none" stroke-width="2" /><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start" letter-spacing="2">ADAPTABILITY / WORKED EXAMPLE</text><text x="65" y="90" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start" >A better retry follows the evidence.</text><circle cx="70" cy="154" r="19" fill="#D2181F" stroke="none" stroke-width="2"/><text x="70" y="161" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" >1</text><text x="100" y="161" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start" >COMPARE THE ROW</text><circle cx="548" cy="154" r="19" fill="#D2181F" stroke="none" stroke-width="2"/><text x="548" y="161" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" >2</text><text x="578" y="161" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start" >CORRECT THE ENTRY</text><path d="M65 190 H224 L240 206 V376 H65 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M224 190 V206 H240" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="152" y="225" font-size="17" fill="#73675E" font-weight="700" text-anchor="middle" >SOURCE</text><text x="152" y="310" font-size="70" fill="#1A1512" font-weight="700" text-anchor="middle" >90</text><path d="M278 190 H437 L453 206 V376 H278 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M437 190 V206 H453" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="365" y="225" font-size="17" fill="#73675E" font-weight="700" text-anchor="middle" >ENTRY</text><text x="365" y="310" font-size="70" fill="#D2181F" font-weight="700" text-anchor="middle" >9</text><path d="M244 274 H269" fill="none" stroke="#1A1512" stroke-width="3" /><text x="259" y="264" font-size="27" fill="#1A1512" font-weight="700" text-anchor="middle" >≠</text><line x1="477" y1="278" x2="534" y2="278" stroke="#D2181F" stroke-width="4" marker-end="url(#arrow-red)"/><text x="622" y="305" font-size="70" fill="#73675E" font-weight="700" text-anchor="middle" >9</text><line x1="591" y1="291" x2="655" y2="270" stroke="#D2181F" stroke-width="4" /><line x1="675" y1="278" x2="727" y2="278" stroke="#D2181F" stroke-width="4" marker-end="url(#arrow-red)"/><text x="813" y="305" font-size="70" fill="#1A1512" font-weight="700" text-anchor="middle" >90</text><text x="723" y="356" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle" >One entry changes.</text><path d="M815 380 V407 H538" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><circle cx="502" cy="435" r="19" fill="#D2181F" stroke="none" stroke-width="2"/><text x="502" y="442" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" >3</text><text x="535" y="442" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start" >RECALCULATE</text><line x1="477" y1="439" x2="416" y2="439" stroke="#D2181F" stroke-width="3" marker-end="url(#arrow-red)"/><circle cx="78" cy="435" r="19" fill="#D2181F" stroke="none" stroke-width="2"/><text x="78" y="442" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" >4</text><text x="109" y="442" font-size="21" fill="#1A1512" font-weight="700" text-anchor="start" >CHECK PAPER WORK</text><text x="64" y="491" font-size="23" fill="#73675E" font-weight="400" text-anchor="start" >Record the strategy used and what the new check shows.</text><line x1="40" y1="531" x2="960" y2="531" stroke="#1A1512" stroke-width="1" /><text x="40" y="559" font-size="17" fill="#73675E" font-weight="400" text-anchor="start" >Preview of worked example 2 · Effort becomes useful evidence through a check.</text><text x="960" y="559" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end" >ACCESS IS4S</text></g></svg>
