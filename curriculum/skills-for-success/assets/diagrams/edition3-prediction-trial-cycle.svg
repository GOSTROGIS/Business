<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Predict. Try. Observe. Decide.</title><desc id="desc">A four-step cycle begins with a prediction and reason, continues with a small trial under recorded conditions, then records observable actions and help needed before deciding whether to keep, adjust or retest. An example distinguishes an observation, the reader opened two folders, from a possible explanation, the label was hard to find.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1140" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">PROBLEM SOLVING / LEARN FROM A TRIAL</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Predict. Try. Observe. Decide.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Make one small change, then look closely at what happens.</text><rect x="48" y="236" width="485" height="250" rx="16" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="74" y="296" font-size="51" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="160" y="291" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">PREDICT</text><text x="75" y="371" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">What do I expect?</text><text x="75" y="423" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">State a reason.</text><rect x="667" y="236" width="485" height="250" rx="16" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="693" y="296" font-size="51" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="779" y="291" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">TRY</text><text x="694" y="371" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Run a small trial.</text><text x="694" y="423" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Record the conditions.</text><rect x="667" y="584" width="485" height="250" rx="16" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="693" y="644" font-size="51" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="779" y="639" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">OBSERVE</text><text x="694" y="719" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">What actually happened?</text><text x="694" y="771" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Record actions and help.</text><rect x="48" y="584" width="485" height="250" rx="16" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="74" y="644" font-size="51" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="160" y="639" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">DECIDE</text><text x="75" y="719" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep, adjust or retest?</text><text x="75" y="771" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Name the next action.</text><line x1="549" y1="362" x2="649" y2="362" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><line x1="908" y1="504" x2="908" y2="565" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><line x1="649" y1="710" x2="550" y2="710" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><line x1="289" y1="565" x2="289" y2="505" stroke="#1A1512" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="538" font-size="23" font-weight="700" fill="#7A6B61" text-anchor="middle" letter-spacing="0">repeat</text><rect x="48" y="890" width="1104" height="190" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><text x="76" y="936" font-size="24" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">KEEP AN OBSERVATION SEPARATE FROM AN EXPLANATION</text><text x="76" y="986" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Observed in this example</text><text x="76" y="1034" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">“The reader opened two folders.”</text><line x1="623" y1="966" x2="623" y2="1051" stroke="#7A6B61" stroke-width="2"/><text x="653" y="986" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Possible explanation</text><text x="653" y="1034" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">“The label was hard to find.”</text></g></svg>