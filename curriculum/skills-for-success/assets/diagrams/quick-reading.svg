<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Find the detail that changes your action</title><desc id="desc">NOTICE 1: Room 1 at 10:00. UPDATE: Room 2; time unchanged. Find the current message. Compare what changed. Say the room and the time. Result: Meet in Room 2 at 10:00. Use both messages. The room changes; the time does not.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker></defs><rect width="1100" height="680" fill="#f7f2e8"/><rect width="1100" height="128" fill="#242827"/><g font-family="Arial,sans-serif"><text x="38" y="40" fill="#d5ad62" font-size="18" font-weight="700">ACCESS IS4S / READING / SEE IT IN ACTION</text><text x="38" y="94" fill="white" font-size="35" font-weight="700">Find the detail that changes your action</text><rect x="38" y="159" width="1024" height="143" rx="12" fill="white"/><rect x="38" y="159" width="9" height="143" rx="0" fill="#a93332"/><text x="68" y="208" font-size="24" fill="#242827" font-weight="700">NOTICE 1: Room 1 at 10:00</text><text x="68" y="263" font-size="24" fill="#276b66" font-weight="400">UPDATE: Room 2; time unchanged</text><rect x="38" y="336" width="330" height="126" rx="12" fill="white"/><circle cx="68" cy="366" r="16" fill="#a93332"/><text x="62" y="372" font-size="18" fill="white" font-weight="700">1</text><text x="56" y="409" font-size="21" fill="#242827" font-weight="400">Find the current message.</text><rect x="385" y="336" width="330" height="126" rx="12" fill="white"/><circle cx="415" cy="366" r="16" fill="#a93332"/><text x="409" y="372" font-size="18" fill="white" font-weight="700">2</text><text x="403" y="409" font-size="21" fill="#242827" font-weight="400">Compare what changed.</text><rect x="732" y="336" width="330" height="126" rx="12" fill="white"/><circle cx="762" cy="366" r="16" fill="#a93332"/><text x="756" y="372" font-size="18" fill="white" font-weight="700">3</text><text x="750" y="409" font-size="21" fill="#242827" font-weight="400">Say the room and the time.</text><rect x="38" y="500" width="1024" height="104" rx="12" fill="#242827"/><text x="61" y="536" font-size="16" fill="#d5ad62" font-weight="700">WHAT A GOOD RESULT LOOKS LIKE</text><text x="61" y="579" font-size="28" fill="white" font-weight="700">Meet in Room 2 at 10:00.</text><text x="38" y="647" font-size="19" fill="#535c58" font-weight="400">Use both messages. The room changes; the time does not.</text></g></svg>
