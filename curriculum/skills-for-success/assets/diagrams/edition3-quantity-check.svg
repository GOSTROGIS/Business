<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="title desc"><title id="title">Keep the whole quantity story visible.</title><desc id="desc">The worked example needs nineteen labels: eight kits times two labels plus three spares. Six labels are available, so thirteen more are needed. Packs contain five labels, so buy three whole packs. Three packs at two dollars and twenty cents cost six dollars and sixty cents. Final stock is twenty-one, two beyond the target. A separate blank record has space for the same five calculation stages using a new agreed example.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1360" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">NUMERACY / TARGET → PURCHASE → CHECK</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the whole quantity story visible.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A worked example beside a clean record for your next agreed task.</text><rect x="48" y="235" width="541" height="72" rx="9" fill="#1A1512" stroke="none" stroke-width="1" /><text x="77" y="282" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">WORKED / PRACTICE KIT LABELS</text><rect x="620" y="235" width="532" height="72" rx="9" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="649" y="282" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">YOUR RECORD / A NEW TASK</text><text x="48" y="366" font-size="37" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="108" y="359" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">SET THE TARGET</text><text x="108" y="408" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">8 kits × 2 labels + 3 spares</text><text x="108" y="454" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">16 + 3 = 19 labels</text><line x1="48" y1="486" x2="589" y2="486" stroke="#D8CBC1" stroke-width="2"/><text x="644" y="359" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Task + units</text><line x1="644" y1="401" x2="1128" y2="401" stroke="#7A6B61" stroke-width="1.5"/><text x="644" y="437" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Target calculation</text><line x1="644" y1="479" x2="1128" y2="479" stroke="#7A6B61" stroke-width="1.5"/><text x="48" y="553" font-size="37" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="108" y="546" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">COMPARE WITH STOCK</text><text x="108" y="595" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">19 needed − 6 available</text><text x="108" y="641" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">13 more labels needed</text><line x1="48" y1="673" x2="589" y2="673" stroke="#D8CBC1" stroke-width="2"/><text x="644" y="546" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Target − available</text><line x1="644" y1="588" x2="1128" y2="588" stroke="#7A6B61" stroke-width="1.5"/><text x="644" y="624" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Amount still needed</text><line x1="644" y1="666" x2="1128" y2="666" stroke="#7A6B61" stroke-width="1.5"/><text x="48" y="740" font-size="37" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="108" y="733" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">BUY WHOLE PACKS</text><text x="108" y="782" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">13 ÷ 5 = 2.6 packs → 3 packs</text><text x="108" y="828" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">3 × 5 = 15 labels supplied</text><line x1="48" y1="860" x2="589" y2="860" stroke="#D8CBC1" stroke-width="2"/><text x="644" y="733" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Amount per pack</text><line x1="644" y1="775" x2="1128" y2="775" stroke="#7A6B61" stroke-width="1.5"/><text x="644" y="811" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Whole packs + supplied</text><line x1="644" y1="853" x2="1128" y2="853" stroke="#7A6B61" stroke-width="1.5"/><text x="48" y="927" font-size="37" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="108" y="920" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CALCULATE COST</text><text x="108" y="969" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">3 packs × $2.20</text><text x="108" y="1015" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">$6.60 total</text><line x1="48" y1="1047" x2="589" y2="1047" stroke="#D8CBC1" stroke-width="2"/><text x="644" y="920" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Cost per pack</text><line x1="644" y1="962" x2="1128" y2="962" stroke="#7A6B61" stroke-width="1.5"/><text x="644" y="998" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Purchase cost</text><line x1="644" y1="1040" x2="1128" y2="1040" stroke="#7A6B61" stroke-width="1.5"/><text x="48" y="1114" font-size="37" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="108" y="1107" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CHECK THE RESULT</text><text x="108" y="1156" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">6 available + 15 bought = 21</text><text x="108" y="1202" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">21 − 19 = 2 labels beyond target</text><line x1="48" y1="1234" x2="589" y2="1234" stroke="#D8CBC1" stroke-width="2"/><text x="644" y="1107" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Final stock</text><line x1="644" y1="1149" x2="1128" y2="1149" stroke="#7A6B61" stroke-width="1.5"/><text x="644" y="1185" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">Compare with target</text><line x1="644" y1="1227" x2="1128" y2="1227" stroke="#7A6B61" stroke-width="1.5"/><text x="48" y="1317" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Explain why the final stock can be higher than the target.</text></g></svg>