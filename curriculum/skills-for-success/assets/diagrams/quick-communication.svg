<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Say it. Check it. Switch roles.</title><desc id="desc">SENDER: “Room 2 at 10:00.”. RECEIVER: “Room 2, ten o’clock?”. Agree a usable way to talk. Send the message; check it back. Confirm or clarify, then switch. Result: Both people can state the same plan. Speech, sign, text or AAC can work. Check meaning, not eye contact.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker></defs><rect width="1100" height="680" fill="#f7f2e8"/><rect width="1100" height="128" fill="#242827"/><g font-family="Arial,sans-serif"><text x="38" y="40" fill="#d5ad62" font-size="18" font-weight="700">ACCESS IS4S / COMMUNICATION / SEE IT IN ACTION</text><text x="38" y="94" fill="white" font-size="35" font-weight="700">Say it. Check it. Switch roles.</text><rect x="38" y="159" width="1024" height="143" rx="12" fill="white"/><rect x="38" y="159" width="9" height="143" rx="0" fill="#a93332"/><circle cx="85" cy="197" r="17" fill="#d5ad62"/><path d="M62 256v-20q23-30 46 0v20" fill="#276b66"/><circle cx="600" cy="197" r="17" fill="#d5ad62"/><path d="M577 256v-20q23-30 46 0v20" fill="#a93332"/><text x="130" y="220" font-size="23" fill="#242827" font-weight="400">SENDER: “Room 2 at 10:00.”</text><text x="645" y="220" font-size="22" fill="#242827" font-weight="400">RECEIVER: “Room 2, ten o’clock?”</text><path d="M145 264H940" stroke="#276b66" stroke-width="3" marker-end="url(#arr)"/><rect x="38" y="336" width="330" height="126" rx="12" fill="white"/><circle cx="68" cy="366" r="16" fill="#a93332"/><text x="62" y="372" font-size="18" fill="white" font-weight="700">1</text><text x="56" y="409" font-size="21" fill="#242827" font-weight="400">Agree a usable way to talk.</text><rect x="385" y="336" width="330" height="126" rx="12" fill="white"/><circle cx="415" cy="366" r="16" fill="#a93332"/><text x="409" y="372" font-size="18" fill="white" font-weight="700">2</text><text x="403" y="409" font-size="21" fill="#242827" font-weight="400">Send the message; check it</text><text x="403" y="436" font-size="21" fill="#242827" font-weight="400">back.</text><rect x="732" y="336" width="330" height="126" rx="12" fill="white"/><circle cx="762" cy="366" r="16" fill="#a93332"/><text x="756" y="372" font-size="18" fill="white" font-weight="700">3</text><text x="750" y="409" font-size="21" fill="#242827" font-weight="400">Confirm or clarify, then</text><text x="750" y="436" font-size="21" fill="#242827" font-weight="400">switch.</text><rect x="38" y="500" width="1024" height="104" rx="12" fill="#242827"/><text x="61" y="536" font-size="16" fill="#d5ad62" font-weight="700">WHAT A GOOD RESULT LOOKS LIKE</text><text x="61" y="579" font-size="28" fill="white" font-weight="700">Both people can state the same plan.</text><text x="38" y="647" font-size="19" fill="#535c58" font-weight="400">Speech, sign, text or AAC can work. Check meaning, not eye contact.</text></g></svg>
