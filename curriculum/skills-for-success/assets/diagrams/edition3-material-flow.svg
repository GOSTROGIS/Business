<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">Follow the material, step by step.</title><desc id="desc">Processed aggregate from a pit or quarry and asphalt binder enter a batch or drum plant. Haul trucks move the mixture to a paver and screed for placement, and rollers compact the placed material. Where used, reclaimed asphalt pavement returns to a plant. A separate hot-in-place train works on existing pavement; it is not drawn as the same process as the plant return route. No operating settings are provided.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1210" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">ROADBUILDING / MATERIALS THROUGH THE SYSTEM</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Follow the material, step by step.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A plant route, a return route, and a distinct route on existing pavement.</text><text x="48" y="267" font-size="46" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="48" y="309" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">PREPARE</text><path d="M50 453 L115 349 L164 424 L199 372 L247 453 Z" stroke="#1A1512" stroke-width="2" fill="#D8CBC1"/><path d="M98 376 L115 349 L133 377" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M79 431 l9 -5 l11 7 l-9 6Z" stroke="#1A1512" stroke-width="1.3" fill="#FFBC00"/><path d="M126 405 l9 -5 l11 7 l-9 6Z" stroke="#1A1512" stroke-width="1.3" fill="#FFBC00"/><path d="M162 442 l9 -5 l11 7 l-9 6Z" stroke="#1A1512" stroke-width="1.3" fill="#FFBC00"/><path d="M194 414 l9 -5 l11 7 l-9 6Z" stroke="#1A1512" stroke-width="1.3" fill="#FFBC00"/><path d="M223 441 l9 -5 l11 7 l-9 6Z" stroke="#1A1512" stroke-width="1.3" fill="#FFBC00"/><text x="48" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Pit / quarry</text><text x="48" y="584" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Processed</text><text x="48" y="614" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">aggregate</text><line x1="232" y1="467" x2="266" y2="467" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="272" y="267" font-size="46" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="272" y="309" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">MIX</text><g transform="translate(272,328) scale(0.68) rotate(0)"><path d="M27 37 L50 18 L73 37 V149 H27Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><path d="M87 37 L110 18 L133 37 V149 H87Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><rect x="156" y="64" width="118" height="86" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="3" /><path d="M148 64 L215 25 L282 64Z" stroke="#1A1512" stroke-width="3" fill="#1A1512"/><rect x="192" y="94" width="45" height="56" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><line x1="50" y1="149" x2="50" y2="175" stroke="#1A1512" stroke-width="6"/><line x1="110" y1="149" x2="110" y2="175" stroke="#1A1512" stroke-width="6"/><line x1="27" y1="175" x2="133" y2="175" stroke="#1A1512" stroke-width="5"/><line x1="215" y1="150" x2="215" y2="177" stroke="#1A1512" stroke-width="5"/></g><text x="272" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Batch OR drum</text><text x="272" y="542" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">plant</text><text x="272" y="584" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Aggregate + binder</text><line x1="456" y1="467" x2="490" y2="467" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="496" y="267" font-size="46" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="496" y="309" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">HAUL</text><g transform="translate(496,328) scale(0.68) rotate(0)"><path d="M10 57 H173 L164 128 H26Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><path d="M181 76 H232 L273 113 V147 H174 V76Z" stroke="#1A1512" stroke-width="3" fill="#D8CBC1"/><path d="M193 86 H226 L252 113 H193Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><rect x="24" y="138" width="239" height="20" rx="3" fill="#1A1512" stroke="none" stroke-width="1" /><circle cx="62" cy="160" r="24" fill="#1A1512" stroke="none" stroke-width="1"/><circle cx="62" cy="160" r="11" fill="#D8CBC1" stroke="none" stroke-width="1"/><circle cx="111" cy="160" r="24" fill="#1A1512" stroke="none" stroke-width="1"/><circle cx="111" cy="160" r="11" fill="#D8CBC1" stroke="none" stroke-width="1"/><circle cx="230" cy="160" r="24" fill="#1A1512" stroke="none" stroke-width="1"/><circle cx="230" cy="160" r="11" fill="#D8CBC1" stroke="none" stroke-width="1"/></g><text x="496" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Haul truck</text><text x="496" y="584" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Move the mixture</text><line x1="680" y1="467" x2="714" y2="467" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="720" y="267" font-size="46" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">04</text><text x="720" y="309" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">PLACE</text><g transform="translate(720,328) scale(0.68) rotate(0)"><path d="M9 91 H54 L78 121 H212 L238 143 V159 H19Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><rect x="118" y="61" width="70" height="61" rx="0" fill="#D8CBC1" stroke="#1A1512" stroke-width="3" /><rect x="108" y="50" width="91" height="12" rx="0" fill="#1A1512" stroke="none" stroke-width="1" /><line x1="124" y1="62" x2="124" y2="119" stroke="#1A1512" stroke-width="4"/><line x1="181" y1="62" x2="181" y2="119" stroke="#1A1512" stroke-width="4"/><rect x="46" y="145" width="174" height="40" rx="20" fill="#1A1512" stroke="none" stroke-width="1" /><circle cx="70" cy="165" r="10" fill="#D8CBC1" stroke="none" stroke-width="1"/><circle cx="105" cy="165" r="10" fill="#D8CBC1" stroke="none" stroke-width="1"/><circle cx="140" cy="165" r="10" fill="#D8CBC1" stroke="none" stroke-width="1"/><circle cx="175" cy="165" r="10" fill="#D8CBC1" stroke="none" stroke-width="1"/><circle cx="202" cy="165" r="10" fill="#D8CBC1" stroke="none" stroke-width="1"/><path d="M220 146 L271 155 L287 180 H228Z" stroke="#1A1512" stroke-width="3" fill="#D8CBC1"/></g><text x="720" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Paver + screed</text><text x="720" y="584" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Place the mixture</text><line x1="904" y1="467" x2="938" y2="467" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="944" y="267" font-size="46" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">05</text><text x="944" y="309" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">COMPACT</text><g tran