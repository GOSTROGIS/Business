" stroke="none" stroke-width="1"/><text x="590" y="1020" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">A train works on existing pavement.</text><text x="590" y="1066" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep this route distinct from taking</text><text x="590" y="1099" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">reclaimed material back to a plant.</text></g></svg>