<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Choose a format that keeps the work useful</title><desc id="desc">Six file cards distinguish editable prose, working calculations, page presentation, browser structure, transferable rows and structured data.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5dfd2" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#276b66" stroke-width="1.4"/></marker></defs><rect x="0" y="0" width="1000" height="650" rx="0" fill="#f7f2e8"/><rect x="0" y="0" width="1000" height="650" rx="0" fill="url(#grid)"/><rect x="0" y="0" width="1000" height="112" rx="0" fill="#242827"/><text x="36" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d5ad62">ACCESS IS4S  /  DIGITAL + AI</text><text x="36" y="80" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="white">Choose a format that keeps the work useful</text><rect x="36" y="143" width="274" height="170" rx="12" fill="white"/><path d="M56 163h38l17 17v52h-55z" fill="none" stroke="#a93332" stroke-width="2"/><path d="M94 163v17h17" fill="none" stroke="#a93332" stroke-width="2"/><text x="126" y="192" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#a93332">.DOCX</text><text x="56" y="263" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242827">Keep the wording editable</text><text x="56" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#535c58">Headings · tables · revisions</text><rect x="363" y="143" width="274" height="170" rx="12" fill="white"/><path d="M383 163h38l17 17v52h-55z" fill="none" stroke="#276b66" stroke-width="2"/><path d="M421 163v17h17" fill="none" stroke="#276b66" stroke-width="2"/><text x="453" y="192" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#276b66">.XLSX</text><text x="383" y="263" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242827">Keep calculations working</text><text x="383" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#535c58">Sheets · formulas · charts</text><rect x="690" y="143" width="274" height="170" rx="12" fill="white"/><path d="M710 163h38l17 17v52h-55z" fill="none" stroke="#242827" stroke-width="2"/><path d="M748 163v17h17" fill="none" stroke="#242827" stroke-width="2"/><text x="780" y="192" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242827">.PDF</text><text x="710" y="263" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242827">Keep the page readable</text><text x="710" y="292" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#535c58">Check every exported page</text><rect x="36" y="350" width="274" height="170" rx="12" fill="white"/><path d="M56 370h38l17 17v52h-55z" fill="none" stroke="#276b66" stroke-width="2"/><path d="M94 370v17h17" fill="none" stroke="#276b66" stroke-width="2"/><text x="126" y="399" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#276b66">.HTML</text><text x="56" y="470" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#242827">Make a browser document</text><text x="56" y="499" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#535c58">Structure · links · access</text><rect x="363" y="350" width="274" height="170" rx="12" fill="white"/><path d="M383 370h38l17 17v52h-55z" fill="none" stroke="#242827" stroke-width="2"/><path d="M421 370v17h17" fill="none" stroke="#242827" stroke-width="2"/><text x="453" y="399" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#242827">.CSV</text><text x="383" y="470" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#24282