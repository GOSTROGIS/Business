<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Collaboration — six connected components</title><desc id="desc">Overview map for the chapter. 1. Work well with other people. 2. Value diversity and inclusivity of others. 3. Manage difficult interactions with other people. 4. Facilitate an environment where you can collaborate with others. 5. Achieve a common goal with others. 6. Reflect and improve on how well the team works together. Short visual labels summarize these source component names. Numbering matches the component list; the connections do not require one fixed sequence.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><rect x="40" y="34" width="7" height="54" rx="0" fill="#D2181F" stroke="none" stroke-width="0"/><text x="65" y="47" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start">SIX CONNECTED COMPONENTS</text><text x="65" y="91" font-size="42" fill="#1A1512" font-weight="700" text-anchor="start">Collaboration</text><path d="M180 188 H820 C968 188 968 423 820 423 H180 C32 423 32 188 180 188" fill="none" stroke="#1A1512" stroke-width="4" opacity=".2"/><rect x="175" y="310" width="650" height="46" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><text x="500" y="341" font-size="27" fill="#1A1512" font-weight="700" text-anchor="middle">Different strengths. One shared purpose.</text><circle cx="180" cy="188" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(180 188)"><circle cx="-20" cy="-17" r="9" fill="#FFFFFF" stroke="#1A1512" stroke-width="3"/><path d="M-35 14 Q-35 -4 -20 -4 Q-5 -4 -5 14" fill="none" stroke="#1A1512" stroke-width="3" /><circle cx="20" cy="-17" r="9" fill="#FFFFFF" stroke="#1A1512" stroke-width="3"/><path d="M5 14 Q5 -4 20 -4 Q35 -4 35 14" fill="none" stroke="#1A1512" stroke-width="3" /><path d="M-4 4 L4 4" fill="none" stroke="#D2181F" stroke-width="4" /><path d="M-8 22 L8 22" fill="none" stroke="#D2181F" stroke-width="4" /></g><circle cx="135" cy="230" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="135" y="237" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="180" y="277" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Work well</text><text x="180" y="305" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">with others</text><circle cx="500" cy="188" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(500 188)"><circle cx="-23" cy="-7" r="11" fill="#FFFFFF" stroke="#1A1512" stroke-width="3"/><rect x="-6" y="-19" width="23" height="23" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><path d="M32 -20 L46 4 H18 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="3" /><path d="M-36 21 Q0 43 40 21" fill="none" stroke="#D2181F" stroke-width="3" /></g><circle cx="455" cy="230" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="455" y="237" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="500" y="277" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Value diversity</text><text x="500" y="305" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">and inclusion</text><circle cx="820" cy="188" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(820 188)"><path d="M-38 -27 H0 V2 H-24 L-33 10 V2 H-38 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.8" /><path d="M3 -5 H40 V24 H17 L8 32 V24 H3 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.8" /><path d="M-28 -17 L-10 -17" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M13 5 L29 5" fill="none" stroke="#D2181F" stroke-width="2" /><path d="M13 14 L24 14" fill="none" stroke="#D2181F" stroke-width="2" /></g><circle cx="775" cy="230" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="775" y="237" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="820" y="277" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Manage difficult</text><text x="820" y="305" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">interactions</text><circle cx="820" cy="423" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(820 423)"><path d="M-33 29 V-27 H-10 M10 -27 H33 V29" fill="none" stroke="#1A1512" stroke-width="4" /><path d="M-7 -21 V29 H14 V-11 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><path d="M-39 9 L-15 9" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#red)"/><circle cx="9" cy="8" r="2" fill="#1A1512" stroke="#1A1512" stroke-width="1"/></g><circle cx="775" cy="465" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="775" y="472" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="820" y="512" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Support</text><text x="820" y="540" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">collaboration</text><circle cx="500" cy="423" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(500 423)"><path d="M3 33 L3 -32" fill="none" stroke="#1A1512" stroke-width="4" /><path d="M3 -32 H31 L21 -18 L31 -4 H3 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="3" /><path d="M-36 13 L-7 13" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#red)"/><path d="M38 26 L11 26" fill="none" stroke="#D2181F" stroke-width="3" marker-end="url(#red)"/></g><circle cx="455" cy="465" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="455" y="472" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text><text x="500" y="512" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Achieve</text><text x="500" y="540" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">a common goal</text><circle cx="180" cy="423" r="55" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5"/><g transform="translate(180 423)"><path d="M-28 -12 A31 31 0 0 1 27 -17" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#ink)"/><path d="M28 12 A31 31 0 0 1 -27 17" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#ink)"/><path d="M-12 0 l8 8 17 -21" fill="none" stroke="#D2181F" stroke-width="4" /></g><circle cx="135" cy="465" r="18" fill="#D2181F" stroke="#D2181F" stroke-width="0"/><text x="135" y="472" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text><text x="180" y="512" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">Reflect and improve</text><text x="180" y="540" font-size="23" fill="#1A1512" font-weight="400" text-anchor="middle">as a team</text><path d="M40 560 L960 560" fill="none" stroke="#1A1512" stroke-width="1" /><text x="40" y="585" font-size="17" fill="#1A1512" font-weight="400" text-anchor="start">Revisit the component that helps the task.</text><text x="960" y="585" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end">ACCESS IS4S</text></g></svg>
