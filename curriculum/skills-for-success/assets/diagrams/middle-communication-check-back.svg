<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Check the message together.</title><desc id="desc">Three speech bubbles demonstrate sending Thursday, Room 2, 10:00–10:45; restating those details; and confirming their accuracy. A dashed return path asks partners to correct a mismatch and check again. The accompanying reminder includes workbook and pen, indoor activity, printed maps and the usual route for access questions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="940" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">COMMUNICATION / SEND + RESTATE + CONFIRM</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Check the message together.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use an agreed way to communicate; preserve the meaning.</text><text x="48" y="247" font-size="53" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">01</text><text x="126" y="242" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">SEND</text><path d="M48 288 H392 V486 H198 L142 537 V486 H48 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><text x="72" y="361" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Thursday · Room 2</text><text x="72" y="408" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">10:00–10:45</text><circle cx="223" cy="583" r="24" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M174 648 Q223 587 272 648" stroke="#1A1512" stroke-width="4" fill="none"/><line x1="395" y1="385" x2="421" y2="385" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="428" y="247" font-size="53" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">02</text><text x="506" y="242" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">RESTATE</text><path d="M428 288 H772 V486 H578 L522 537 V486 H428 Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><text x="452" y="361" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">“Room 2, Thursday,</text><text x="452" y="408" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">10:00–10:45?”</text><circle cx="603" cy="583" r="24" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M554 648 Q603 587 652 648" stroke="#1A1512" stroke-width="4" fill="none"/><line x1="775" y1="385" x2="801" y2="385" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><text x="808" y="247" font-size="53" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">03</text><text x="886" y="242" font-size="27" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CONFIRM</text><path d="M808 288 H1152 V486 H958 L902 537 V486 H808 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><text x="832" y="361" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">“Yes. Those details</text><text x="832" y="408" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">are correct.”</text><circle cx="983" cy="583" r="24" fill="#D8CBC1" stroke="#1A1512" stroke-width="3"/><path d="M934 648 Q983 587 1032 648" stroke="#1A1512" stroke-width="4" fill="none"/><path d="M1100 651 V692 H88 V551" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="10 8"/><text x="600" y="730" font-size="30" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Correct a mismatch, then check again.</text><text x="48" y="797" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Also check: workbook + pen; indoor activity; printed maps available. An access issue</text><text x="48" y="831" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">can go through the usual course contact.</text><text x="48" y="905" font-size="23" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A sample check-back of key details • consult the complete case message.</text></g></svg>