<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
<title id="title">A two-way check-back of the Room 2 change</title><desc id="desc">Three panels show a sender, listener and sender again. The sender gives the key information: Thursday, Room 2, 10:00 to 10:45. The listener restates those details as a question. The sender checks and confirms them. A return arrow says to correct any mismatch and check again. Other message details to check are bringing a workbook and pen, an indoor activity and available printed process maps. An access issue can be discussed through the usual course contact. This is a sample of key details, not a substitute for the complete classroom message.</desc><defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1A1512" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#D2181F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    </defs>
<g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="670" fill="#F7F4F1"/><text x="40" y="35" font-size="14" font-weight="700" fill="#6B625C" text-anchor="start">COMMUNICATION · CASE A</text><rect x="40" y="48" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="3"/><text x="40" y="86" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start">Send → restate → confirm</text><text x="40" y="123" font-size="20" font-weight="400" fill="#1A1512" text-anchor="start">Check the meaning together, using an agreed way to communicate.</text><circle cx="177" cy="178" r="21" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><text x="177" y="185" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">1</text><text x="177" y="225" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">SEND</text><circle cx="500" cy="178" r="21" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><text x="500" y="185" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">2</text><text x="500" y="225" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">RESTATE</text><circle cx="823" cy="178" r="21" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><text x="823" y="185" font-size="20" font-weight="700" fill="#1A1512" text-anchor="middle">3</text><text x="823" y="225" font-size="23" font-weight="700" fill="#1A1512" text-anchor="middle">CONFIRM</text><line x1="231" y1="178" x2="445" y2="178" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><line x1="554" y1="178" x2="768" y2="178" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(118 278) scale(1.25)"><circle cx="0" cy="0" r="9" fill="#D2181F" stroke="#1A1512" stroke-width="3"/><path d="M -15 35 v -10 a 15 15 0 0 1 30 0 v 10" fill="#D2181F" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="-7" y1="35" x2="-7" y2="49" stroke="#1A1512" stroke-width="3" /><line x1="7" y1="35" x2="7" y2="49" stroke="#1A1512" stroke-width="3" /></g><g transform="translate(441 278) scale(1.25)"><circle cx="0" cy="0" r="9" fill="#FFBC00" stroke="#1A1512" stroke-width="3"/><path d="M -15 35 v -10 a 15 15 0 0 1 30 0 v 10" fill="#FFBC00" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="-7" y1="35" x2="-7" y2="49" stroke="#1A1512" stroke-width="3" /><line x1="7" y1="35" x2="7" y2="49" stroke="#1A1512" stroke-width="3" /></g><g transform="translate(764 278) scale(1.25)"><circle cx="0" cy="0" r="9" fill="#D2181F" stroke="#1A1512" stroke-width="3"/><path d="M -15 35 v -10 a 15 15 0 0 1 30 0 v 10" fill="#D2181F" stroke="#1A1512" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="-7" y1="35" x2="-7" y2="49" stroke="#1A1512" stroke-width="3" /><line x1="7" y1="35" x2="7" y2="49" stroke="#1A1512" stroke-width="3" /></g><rect x="156" y="261" width="48" height="71" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><rect x="163" y="270" width="34" height="29" rx="2" fill="#EEE7E0" stroke="none" stroke-width="3"/><text x="180" y="292" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle">2</text><circle cx="191" cy="312" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><circle cx="180" cy="369" r="26" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><line x1="180" y1="369" x2="180.0" y2="348.72" stroke="#1A1512" stroke-width="2.5" /><line x1="180" y1="369" x2="168.06616993585044" y2="362.11" stroke="#1A1512" stroke-width="3" /><circle cx="180" cy="369" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><rect x="479" y="261" width="48" height="71" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><rect x="486" y="270" width="34" height="29" rx="2" fill="#EEE7E0" stroke="none" stroke-width="3"/><text x="503" y="292" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle">2</text><circle cx="514" cy="312" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><circle cx="503" cy="369" r="26" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><line x1="503" y1="369" x2="503.0" y2="348.72" stroke="#1A1512" stroke-width="2.5" /><line x1="503" y1="369" x2="491.06616993585044" y2="362.11" stroke="#1A1512" stroke-width="3" /><circle cx="503" cy="369" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><rect x="802" y="261" width="48" height="71" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><rect x="809" y="270" width="34" height="29" rx="2" fill="#EEE7E0" stroke="none" stroke-width="3"/><text x="826" y="292" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle">2</text><circle cx="837" cy="312" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><circle cx="826" cy="369" r="26" fill="#F7F4F1" stroke="#1A1512" stroke-width="3"/><line x1="826" y1="369" x2="826.0" y2="348.72" stroke="#1A1512" stroke-width="2.5" /><line x1="826" y1="369" x2="814.0661699358504" y2="362.11" stroke="#1A1512" stroke-width="3" /><circle cx="826" cy="369" r="2" fill="#1A1512" stroke="none" stroke-width="3"/><text x="177" y="424" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle">Thursday · Room 2</text><text x="177" y="452" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle">10:00–10:45</text><text x="500" y="424" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle">“Room 2, Thursday,</text><text x="500" y="452" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle">10:00–10:45?”</text><text x="823" y="424" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle">“Yes. Those details</text><text x="823" y="452" font-size="21" font-weight="700" fill="#1A1512" text-anchor="middle">are correct.”</text><circle cx="555" cy="285" r="18" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5"/><text x="555" y="292" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle">?</text><circle cx="877" cy="285" r="18" fill="#FFBC00" stroke="#1A1512" stroke-width="2.5"/><path d="M 867 287.0 l 6.4 6.4 l 14.0 -16.0" fill="none" stroke="#1A1512" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 823 474 V 500 H 500 V 475" fill="none" stroke="#D2181F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><text x="660" y="528" font-size="18" font-weight="700" fill="#D2181F" text-anchor="middle">Correct a mismatch, then check again.</text><line x1="40" y1="549" x2="960" y2="549" stroke="#C6BAB0" stroke-width="1.5" /><path d="M 52 569 h 21 l 13 13 v 31 h -34 Z" fill="#F7F4F1" stroke="#1A1512" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 73 569 v 13 h 13" fill="none" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="61" y1="595" x2="68" y2="595" stroke="#1A1512" stroke-width="2" /><line x1="61" y1="605" x2="64" y2="605" stroke="#1A1512" stroke-width="2" /><line x1="61" y1="615" x2="68" y2="615" stroke="#1A1512" stroke-width="2" /><path d="M 103 610 l 17 -35 l 6 3 l -17 35 Z" fill="#FFBC00" stroke="#1A1512" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="145" y="584" font-size="18" font-weight="400" fill="#1A1512" text-anchor="start">Also check: workbook + pen; indoor activity; printed maps available.</text><text x="145" y="612" font-size="18" font-weight="400" fill="#1A1512" text-anchor="start">An access issue can go through the usual course contact.</text><text x="960" y="645" font-size="15" font-weight="400" fill="#6B625C" text-anchor="end">A sample check-back of key details · the complete case message remains the source</text></g></svg>