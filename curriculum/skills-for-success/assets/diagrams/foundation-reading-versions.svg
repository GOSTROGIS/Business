<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">Find the notice that applies.</title><desc id="desc">Two document specimens show an earlier introductory-group draft with Room 3 and a version 2 notice that explicitly replaces it, names Room 2 and requires check-in first. A route below moves from the entrance to reception during 08:40–08:55, then to Room 2 after check-in.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="830" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">READING / VERSION + AUDIENCE</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Find the notice that applies.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Match the group and read the explicit replacement statement.</text><rect x="48" y="242" width="430" height="260" rx="7" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="242" width="10" height="260" rx="0" fill="#7A6B61" stroke="none" stroke-width="1" /><text x="78" y="287" font-size="24" font-weight="700" fill="#7A6B61" text-anchor="start" letter-spacing="0">EARLIER DRAFT</text><text x="78" y="337" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Introductory group</text><text x="78" y="378" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Room 3</text><text x="78" y="419" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Replaced</text><path d="M487 362 H687" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="584" y="312" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Explicitly</text><text x="584" y="343" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">replaces it</text><rect x="713" y="242" width="439" height="260" rx="7" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="713" y="242" width="10" height="260" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="743" y="287" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">VERSION 2</text><text x="743" y="337" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Introductory group</text><text x="743" y="378" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Room 2</text><text x="743" y="419" font-size="26" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Check in first</text><text x="48" y="565" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="1">FOLLOW THE CHECK-IN INSTRUCTION</text><circle cx="76" cy="626" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="76" y="635" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">1</text><text x="118" y="637" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Entrance</text><text x="118" y="677" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0"></text><line x1="308" y1="627" x2="394" y2="627" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><circle cx="456" cy="626" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="456" y="635" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">2</text><text x="498" y="637" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Reception</text><text x="498" y="677" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">08:40–08:55</text><line x1="688" y1="627" x2="774" y2="627" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><circle cx="836" cy="626" r="25" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="836" y="635" font-size="26" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">3</text><text x="878" y="637" font-size="31" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Room 2</text><text x="878" y="677" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">After check-in</text><line x1="48" y1="729" x2="1152" y2="729" stroke="#D8CBC1" stroke-width="2"/><text x="48" y="777" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Fictional classroom practice • matching audience and scope decide which update applies.</text></g></svg>