<title id="title">Whole packs and the complete fictional supply order</title>
<desc id="desc">Version 1 has 18 learners. The folder target is 20 including two spares. Seven folders are in stock and 13 more are needed. Three whole packs of five supply 15 folders, giving 22 altogether, two beyond the target. Folder, pen and label line costs are 26 dollars 25 cents, 19 dollars 80 cents and 12 dollars 60 cents. Goods total 58 dollars 65 cents, below the 60-dollar free-delivery threshold, so delivery adds 8 dollars 50 cents. The delivered order is 67 dollars 15 cents, exceeding the 65-dollar budget by 2 dollars 15 cents.</desc>
