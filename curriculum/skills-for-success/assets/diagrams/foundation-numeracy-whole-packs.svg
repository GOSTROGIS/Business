<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">Count the packs. Then check the order.</title><desc id="desc">A worked whole-pack order needs twenty folders including spares, has seven, and needs thirteen more. Three packs of five bring stock to twenty-two. Folders cost $26.25, pens $19.80 and labels $12.60, making goods $58.65. Because goods are below $60, delivery adds $8.50. The delivered cost is $67.15, or $2.15 over the $65 budget. A scaled budget bar shows the comparison.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1010" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">NUMERACY / WHOLE PACKS + BUDGET</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Count the packs. Then check the order.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Fictional version 1 order • folders, pens and labels</text><text x="48" y="236" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Folder target: 18 + 2 spares = 20</text><text x="48" y="283" font-size="31" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">7 in stock  →  13 to add</text><text x="48" y="330" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">13 ÷ 5 = 2.6 packs → 3 whole packs</text><path d="M56 386 H120 L135 401 H216 V497 H56Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M64 378 H128 L143 393 H224 V489 H64Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M72 370 H136 L151 385 H232 V481 H72Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M80 362 H144 L159 377 H240 V473 H80Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M88 354 H152 L167 369 H248 V465 H88Z" stroke="#1A1512" stroke-width="2" fill="#FFBC00"/><text x="151" y="543" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">5 folders</text><path d="M271 386 H335 L350 401 H431 V497 H271Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M279 378 H343 L358 393 H439 V489 H279Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M287 370 H351 L366 385 H447 V481 H287Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M295 362 H359 L374 377 H455 V473 H295Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M303 354 H367 L382 369 H463 V465 H303Z" stroke="#1A1512" stroke-width="2" fill="#FFBC00"/><text x="366" y="543" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">5 folders</text><path d="M486 386 H550 L565 401 H646 V497 H486Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M494 378 H558 L573 393 H654 V489 H494Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M502 370 H566 L581 385 H662 V481 H502Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M510 362 H574 L589 377 H670 V473 H510Z" stroke="#1A1512" stroke-width="2" fill="#FFFFFF"/><path d="M518 354 H582 L597 369 H678 V465 H518Z" stroke="#1A1512" stroke-width="2" fill="#FFBC00"/><text x="581" y="543" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">5 folders</text><rect x="756" y="246" width="396" height="321" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><text x="784" y="290" font-size="23" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">COMPLETE ORDER</text><text x="784" y="344" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Folders $26.25</text><text x="784" y="401" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">+ pens $19.80</text><text x="784" y="458" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">+ labels $12.60</text><text x="48" y="602" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">7 + 15 = 22 available: 2 beyond the target</text><text x="48" y="665" font-size="30" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Goods $58.65 &lt; $60 → delivery adds $8.50</text><rect x="48" y="710" width="924.9942857142858" height="70" rx="0" fill="#1A1512" stroke="none" stroke-width="1" /><rect x="972.9942857142858" y="710" width="134.05714285714288" height="70" rx="0" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="510.4971428571429" y="754" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Goods $58.65</text><text x="1040.0228571428572" y="754" font-size="24" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">$8.50</text><line x1="1073.142857142857" y1="695" x2="1073.142857142857" y2="806" stroke="#D2181F" stroke-width="4"/><text x="1073.142857142857" y="842" font-size="25" font-weight="700" fill="#D2181F" text-anchor="end" letter-spacing="0">Budget $65.00</text><text x="48" y="814" font-size="22" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">$0</text><text x="1152" y="814" font-size="22" font-weight="400" fill="#1A1512" text-anchor="end" letter-spacing="0">$70</text><text x="48" y="895" font-size="36" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Delivered: $67.15</text><text x="720" y="895" font-size="33" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">$2.15 over budget</text><text x="48" y="952" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Prices include the case’s taxes. Calculated order; approval is not supplied.</text></g></svg>