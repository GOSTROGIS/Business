acing="0">Numeracy</text><circle cx="211" cy="681" r="22" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="211" y="689" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">04</text><text x="211" y="733" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Digital</text><circle cx="990" cy="305" r="22" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="990" y="313" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">05</text><text x="990" y="357" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Problem solving</text><circle cx="1015" cy="493" r="22" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="1015" y="501" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">06</text><text x="1015" y="545" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Communication</text><circle cx="990" cy="681" r="22" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="990" y="689" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">07</text><text x="990" y="733" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Collaboration</text><circle cx="388" cy="849" r="22" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="388" y="857" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">08</text><text x="388" y="901" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Adaptability</text><circle cx="818" cy="849" r="22" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="818" y="857" font-size="22" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">09</text><text x="818" y="901" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Creativity and</text><text x="818" y="937" font-size="29" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">innovation</text><rect x="48" y="976" width="1104" height="64" rx="9" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><text x="600" y="1019" font-size="28" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Document use and continued learning connect across tasks.</text></g></svg>