<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">Nine skills. One meaningful purpose.</title><desc id="desc">Nine skill labels connect to a central learner purpose: Reading, Writing, Numeracy, Digital, Problem Solving, Communication, Collaboration, Adaptability, and Creativity and Innovation. The radial relationship shows that one meaningful task can use several skills. Document use and continued learning connect across tasks.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1080" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">SKILLS FOR SUCCESS / CONNECTIONS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Nine skills. One meaningful purpose.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">A task can draw on several skills at once.</text><line x1="600.0" y1="383.0" x2="600.0" y2="294.0" stroke="#D8CBC1" stroke-width="4"/><line x1="457.5994397208534" y1="467.7595932676094" x2="276.92618531441974" y2="356.88604643922685" stroke="#D8CBC1" stroke-width="4"/><line x1="438.2482249494602" y1="536.0354437923797" x2="259.8850810419166" y2="524.6561648022579" stroke="#D8CBC1" stroke-width="4"/><line x1="450.8615746575159" y1="608.2592292583802" x2="280.0455672881871" y2="691.2565246641836" stroke="#D8CBC1" stroke-width="4"/><line x1="742.4835316876049"