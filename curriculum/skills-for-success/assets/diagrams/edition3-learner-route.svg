<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1190" viewBox="0 0 1200 1190" role="img" aria-labelledby="title desc"><title id="title">Find your route through a chapter.</title><desc id="desc">A starting task branches to foundation practice or the core task. Foundation practice uses a model, guided examples and useful supports. The core task brings the skill into a meaningful purpose. Both paths lead to a fresh check using a new example of the same skill, then a next step: practise a part, use the skill again, or transfer it to another task.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1190" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">LEARNING / CHOOSE A USEFUL NEXT STEP</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Find your route through a chapter.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Begin with a useful task. Let the evidence guide the amount of practice.</text><rect x="330" y="232" width="540" height="132" rx="16" fill="#1A1512" stroke="none" stroke-width="1" /><text x="600" y="281" font-size="25" font-weight="700" fill="#FFBC00" text-anchor="middle" letter-spacing="0">STARTING TASK</text><text x="600" y="329" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">What can I already do?</text><path d="M600 364 V405 H307 V450 M600 405 H893 V450" stroke="#1A1512" stroke-width="3" fill="none"/><rect x="48" y="450" width="504" height="234" rx="14" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="48" y="450" width="69" height="234" rx="14" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="83" y="507" font-size="41" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">A</text><text x="142" y="503" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">FOUNDATION PRACTICE</text><text x="142" y="552" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Watch a model.</text><text x="142" y="594" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Try a guided example.</text><text x="142" y="636" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Choose useful supports.</text><rect x="648" y="450" width="504" height="234" rx="14" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><rect x="648" y="450" width="69" height="234" rx="14" fill="#FFBC00" stroke="none" stroke-width="1" /><text x="683" y="507" font-size="41" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">B</text><text x="742" y="503" font-size="26" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">CORE TASK</text><text x="742" y="552" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the purpose visible.</text><text x="742" y="594" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use the skill in context.</text><text x="742" y="636" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Check your own decisions.</text><path d="M300 684 V725 H600 M900 684 V725 H600 V765" stroke="#1A1512" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="248" y="790" width="704" height="132" rx="12" fill="#FFF0BE" stroke="#1A1512" stroke-width="2" /><text x="600" y="835" font-size="25" font-weight="700" fill="#D2181F" text-anchor="middle" letter-spacing="0">FRESH CHECK</text><text x="600" y="878" font-size="34" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">New example · same skill</text><line x1="600" y1="922" x2="600" y2="963" stroke="#1A1512" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="987" width="348" height="140" rx="9" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="2" /><text x="72" y="1034" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">PRACTISE A PART</text><text x="72" y="1075" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Return to one useful</text><text x="72" y="1106" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">step.</text><rect x="426" y="987" width="348" height="140" rx="9" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="2" /><text x="450" y="1034" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">USE IT AGAIN</text><text x="450" y="1075" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Build confidence and</text><text x="450" y="1106" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">fluency.</text><rect x="804" y="987" width="348" height="140" rx="9" fill="#FFFFFF" stroke="#D8CBC1" stroke-width="2" /><text x="828" y="1034" font-size="25" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">TRANSFER IT</text><text x="828" y="1075" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Try another task or</text><text x="828" y="1106" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">context.</text></g></svg>