<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Make the change visible in the file.</title><desc id="desc">Two files in a practice folder show the change from v01 to v02. Road-user cards remain ten prepared while checked increases from seven to nine and remaining decreases from three to one. Across all topics, prepared stays twenty-four, checked rises from sixteen to eighteen and remaining falls from eight to six. Both versions stay available for review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="980" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">DIGITAL / FOLDERS + VERSIONS</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Make the change visible in the file.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Open the file and check its contents. Keep both versions for review.</text><path d="M48 240 V207 H300 L327 232 H1152 V297 H48Z" stroke="#1A1512" stroke-width="2" fill="#FFBC00"/><text x="78" y="272" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">IS4S-practice-[learning-ID]</text><rect x="48" y="342" width="528" height="447" rx="10" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="76" y="393" font-size="47" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">v01</te