<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="cover-title cover-description">
<title id="cover-title">A place to put the nine skills to work</title>
<desc id="cover-description">An original editorial illustration brings a planning notebook, a tablet, a revised note, and a pencil together on an ink-coloured work surface. A gold connecting line moves between planning, trying and reviewing. Alongside the illustration, a clear index names Reading, Writing, Numeracy, Digital, Problem solving, Communication, Collaboration, Adaptability, and Creativity and innovation. The objects are a fictional learning scene, not a task sheet or calibrated measuring tool.</desc>
<defs>
  <pattern id="paper-lines" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/></pattern>
  <marker id="route-arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#FFBC00" stroke-width="1.8"/></marker>
</defs>
<rect width="1200" height="660" fill="#F7F4F1"/>
<path d="M0 0H762V660H0Z" fill="#1A1512"/>
<path d="M0 0H762V660H0Z" fill="url(#paper-lines)"/>
<path d="M762 0H770V660H762Z" fill="#FFBC00"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="44" y="51" font-size="17" letter-spacing="2.7" font-weight="700" fill="#FFBC00">PURPOSE / PRACTICE / PROGRESS</text>
  <path d="M44 69H714" stroke="#F7F4F1" stroke-opacity=".24"/>
  <path d="M85 130C89 101 137 95 194 95H519C641 95 710 135 710 249V414" fill="none" stroke="#FFBC00" stroke-width="4" marker-end="url(#route-arrow)"/>
  <circle cx="85" cy="130" r="7" fill="#FFBC00"/>
  <!-- A ruled planning notebook: a drawn learning object, not a reused icon. -->
  <g transform="translate(80 149) rotate(-8 170 183)">
    <path d="M17 12H337V371H17Z" fill="#8D8276"/>
    <rect x="0" y="0" width="327" height="360" rx="5" fill="#F7F4F1"/>
    <path d="M35 0V360" stroke="#D8CFC5" stroke-width="2"/>
    <path d="M35 0H327V13H35Z" fill="#D2181F"/>
    <g fill="#1A1512">
      <circle cx="17" cy="35" r="5"/><circle cx="17" cy="87" r="5"/><circle cx="17" cy="139" r="5"/><circle cx="17" cy="191" r="5"/><circle cx="17" cy="243" r="5"/><circle cx="17" cy="295" r="5"/><circle cx="17" cy="337" r="5"/>
    </g>
    <text x="58" y="60" font-size="16" letter-spacing="2" fill="#B5141B" font-weight="700">A USEFUL QUESTION</text>
    <text x="56" y="109" font-size="42" fill="#1A1512" font-weight="700">Make a plan.</text>
    <path d="M58 129H286" stroke="#1A1512" stroke-width="2"/>
    <g stroke="#A99D90" stroke-width="1.2"><path d="M58 191H286M58 235H286M58 279H286M58 323H286"/></g>
    <text x="58" y="174" font-size="22" fill="#1A1512">Find the facts.</text>
    <text x="58" y="218" font-size="22" fill="#1A1512">Choose a next step.</text>
    <text x="58" y="262" font-size="22" fill="#1A1512">Check the result.</text>
    <path d="M60 302L69 310L86 289" fill="none" stroke="#D2181F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 301H244" stroke="#73675E" stroke-width="2"/>
  </g>
  <!-- Tablet with a purposeful three-step trial, rather than a decorative app grid. -->
  <g transform="translate(423 139) rotate(7 126 170)">
    <rect x="0" y="0" width="252" height="342" rx="22" fill="#D2181F"/>
    <rect x="8" y="8" width="236" height="326" rx="17" fill="#1A1512" stroke="#F7F4F1" stroke-width="2"/>
    <rect x="20" y="32" width="212" height="272" rx="6" fill="#FFFFFF"/>
    <path d="M99 19H153" stroke="#8B8178" stroke-width="3" stroke-linecap="round"/>
    <circle cx="126" cy="319" r="6" fill="none" stroke="#F7F4F1" stroke-width="2"/>
    <text x="41" y="66" font-size="14" letter-spacing="2" fill="#B5141B" font-weight="700">PUT IT TO WORK</text>
    <text x="39" y="110" font-size="35" fill="#1A1512" font-weight="700">Try. Check.</text>
    <text x="39" y="151" font-size="39" fill="#1A1512" font-weight="700">Improve.</text>
    <path d="M42 174H209" stroke="#D8CFC5" stroke-width="2"/>
    <path d="M53 205V267H204" fill="none" stroke="#1A1512" stroke-width="2"/>
    <path d="M73 246L115 225L151 232L195 195" fill="none" stroke="#D2181F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="73" cy="246" r="5" fill="#1A1512"/><circle cx="115" cy="225" r="5" fill="#1A1512"/><circle cx="151" cy="232" r="5" fill="#1A1512"/><circle cx="195" cy="195" r="8" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/>
    <text x="42" y="289" font-size="11" fill="#55504B">ILLUSTRATIVE PRACTICE</text>
  </g>
  <!-- A revision note overlaps both tools: learning connects the objects. -->
  <g transform="translate(313 455) rotate(-3 190 72)">
    <path d="M0 0H359L387 29V137H0Z" fill="#FFF8E6"/>
    <path d="M359 0V29H387" fill="#E6D8B2"/>
    <path d="M20 24H25V113H20Z" fill="#D2181F"/>
    <text x="44" y="43" font-size="16" letter-spacing="1.6" fill="#B5141B" font-weight="700">NOTICE THE DIFFERENCE</text>
    <text x="43" y="82" font-size="30" fill="#1A1512" font-weight="700">What changed?</text>
    <path d="M44 106H273" stroke="#8B8178" stroke-width="1.5"/>
    <path d="M304 94L319 109L348 78" fill="none" stroke="#1A1512" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- A pencil supplies a physical workbench detail without nine boxed symbols. -->
  <g transform="translate(45 529) rotate(-8 115 20)">
    <path d="M0 0H218L251 17L218 34H0Z" fill="#FFBC00"/>
    <path d="M218 0L251 17L218 34Z" fill="#D8C9B8"/>
    <path d="M240 11L251 17L240 23Z" fill="#1A1512"/>
    <path d="M12 8H215M12 26H215" stroke="#9E7400" stroke-width="1.5"/>
    <path d="M0 0H18V34H0Z" fill="#D2181F"/>
  </g>
  <path d="M44 615H714" stroke="#F7F4F1" stroke-opacity=".24"/>
  <text x="44" y="645" font-size="18" fill="#F7F4F1">Bring what you know. Build what comes next.</text>
  <!-- An editorial index keeps all nine names clear and searchable. -->
  <text x="814" y="55" font-size="17" font-weight="700" letter-spacing="2.3" fill="#B5141B">THE NINE SKILLS</text>
  <text x="810" y="113" font-size="49" font-weight="700" fill="#1A1512">Connected.</text>
  <g font-size="25" fill="#1A1512">
    <text x="860" y="165">Reading</text><text x="860" y="213">Writing</text><text x="860" y="261">Numeracy</text><text x="860" y="309">Digital</text><text x="860" y="357">Problem solving</text><text x="860" y="405">Communication</text><text x="860" y="453">Collaboration</text><text x="860" y="501">Adaptability</text><text x="860" y="549">Creativity and innovation</text>
  </g>
  <g font-size="17" fill="#B5141B" font-weight="700">
    <text x="815" y="164">01</text><text x="815" y="212">02</text><text x="815" y="260">03</text><text x="815" y="308">04</text><text x="815" y="356">05</text><text x="815" y="404">06</text><text x="815" y="452">07</text><text x="815" y="500">08</text><text x="815" y="548">09</text>
  </g>
  <path d="M814 181H1157M814 229H1157M814 277H1157M814 325H1157M814 373H1157M814 421H1157M814 469H1157M814 517H1157" stroke="#D8CFC5" stroke-width="1"/>
  <path d="M814 588H1157" stroke="#D2181F" stroke-width="4"/>
  <text x="814" y="622" font-size="18" fill="#55504B">One useful task. Many ways to grow.</text>
</g>
</svg>
