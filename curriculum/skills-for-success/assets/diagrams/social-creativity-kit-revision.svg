<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Show the change in the kit itself.</title><desc id="desc">Two Number Check folders show an inspectable revision. Version 1 has four items: one data card, one worked example and two blank sheets. Version 2 has five: one data card, two worked examples and two blanks. A further check must make the slip instruction visible and retest; used sheets stay with the learner and two blank sheets are restocked.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="980" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">CREATIVITY / VERSION + REVISION</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Show the change in the kit itself.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the useful features and revise what the test exposed.</text><text x="48" y="250" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">VERSION 1</text><path d="M48 302 V275 H260 L287 302 H576 V715 H48Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><text x="76" y="358" font-size="34" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">N · Number Check</text><text x="76" y="417" font-size="47" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">4 items</text><rect x="76" y="457" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="140" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">D</text><rect x="231" y="457" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="295" y="511" font-size="25" font-weight="700" fill="#D2181F" text-anchor="middle" letter-spacing="0">E</text><rect x="386" y="457" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="450" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Blank</text><rect x="76" y="565" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="140" y="619" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Blank</text><text x="76" y="688" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">1 data · 1 example · 2 blanks</text><text x="624" y="250" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">VERSION 2</text><path d="M624 302 V275 H836 L863 302 H1152 V715 H624Z" stroke="#1A1512" stroke-width="3" fill="#FFBC00"/><text x="652" y="358" font-size="34" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">N · Number Check</text><text x="652" y="417" font-size="47" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">5 items</text><rect x="652" y="457" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="716" y="511" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">D</text><rect x="807" y="457" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="871" y="511" font-size="25" font-weight="700" fill="#D2181F" text-anchor="middle" letter-spacing="0">E</text><rect x="962" y="457" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="1026" y="511" font-size="25" font-weight="700" fill="#D2181F" text-anchor="middle" letter-spacing="0">E</text><rect x="652" y="565" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="716" y="619" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Blank</text><rect x="807" y="565" width="128" height="83" rx="5" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="871" y="619" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Blank</text><text x="652" y="688" font-size="24" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">1 data · 2 examples · 2 blanks</text><rect x="48" y="764" width="1104" height="147" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><text x="78" y="811" font-size="24" font-weight="700" fill="#FFBC00" text-anchor="start" letter-spacing="0">CHECK NEEDED</text><text x="78" y="854" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Make the slip instruction visible, then retest.</text><text x="78" y="891" font-size="25" font-weight="400" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Used sheets stay with the learner. Restock two blank sheets.</text><text x="48" y="953" font-size="24" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Version 2 adds one worked example. The current contents must be easy to identify.</text></g></svg>