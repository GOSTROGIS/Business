<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc"><title id="title">Number Check kit revision from four items to five</title><desc id="desc">Version 1 contains one data table, one worked example and two blank sheets: four items. Version 2 adds a second worked example for five items, labels the new version and puts the check-needed slip instruction on its visible face with a marked pocket. D means data table, E means worked example, and unlettered pages are blank sheets. Used sheets stay with the learner; the kit is restocked with two blanks before reuse. The revision still needs a new test.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1A1512" stroke-opacity=".12" stroke-width="3"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#F7F4F1" stroke="none" stroke-width="2" /><rect x="40" y="35" width="7" height="48" rx="0" fill="#D2181F" stroke="none" stroke-width="2" /><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start" letter-spacing="2">CREATIVITY AND INNOVATION / WORKED EXAMPLE</text><text x="65" y="90" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start" >Revise the kit. Show what changed.</text><text x="65" y="151" font-size="21" fill="#73675E" font-weight="700" text-anchor="start" >VERSION 1</text><text x="555" y="151" font-size="21" fill="#D2181F" font-weight="700" t