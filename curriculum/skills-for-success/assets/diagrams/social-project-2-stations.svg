<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Project 2 station activities and individual tablet turns</title><desc id="desc">Every pair needs a 20-minute tablet activity and a 20-minute printed activity. The activities may run at the same time for different pairs. Within a tablet station block, learner 1 controls the device for ten minutes, learner 2 controls it for ten minutes, and five minutes remain for checking, saving and moving. Ten plus ten plus five makes a 25-minute block. This concept schematic does not supply the changed seven-pair rotation or resource calculations.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><marker id="ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="600" rx="0" fill="#F7F4F1" stroke="none" stroke-width="0"/><rect x="40" y="34" width="7" height="52" rx="0" fill="#D2181F" stroke="none" stroke-width="0"/><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start">INTEGRATED PROJECT 2 / CONCEPT SCHEMATIC</text><text x="65" y="91" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start">Two activities. A turn for each learner.</text><rect x="177" y="149" width="165" height="132" rx="12" fill="#1A1512" stroke="#1A1512" stroke-width="3"/><rect x="189" y="161" width="141" height="105" rx="3" fill="#F7F4F1" stroke="#1A1512" stroke-width="2"/><circle cx="260" cy="274" r="3" fill="#F7F4F1" stroke="#F7F4F1" stroke-width="1"/><rect x="215" y="181" width="89" height="63" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="2"/><path d="M226 200 L289 200" fill="none" stroke="#73675E" stroke-width="2" /><path d="M226 214 L277 214" fill="none" stroke="#73675E" stroke-width="2" /><path d="M226 228 L285 228" fill="none" stroke="#73675E" stroke-width="2" /><path d="M657 149 H804 L822 167 V281 H657 Z" fill="#FFFFFF" stroke="#1A1512" stroke-width="2.5" /><path d="M804 149 V167 H822" fill="none" stroke="#1A1512" stroke-width="2" /><path d="M681 188 L787 188" fill="none" stroke="#73675E" stroke-width="3" /><path d="M681 208 L777 208" fill="none" stroke="#73675E" stroke-width="3" /><path d="M681 228 L787 228" fill="none" stroke="#73675E" stroke-width="3" /><path d="M681 248 L761 248" fill="none" stroke="#73675E" stroke-width="3" /><path d="M370 190 L627 190" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#ink)"/><path d="M627 249 L370 249" fill="none" stroke="#1A1512" stroke-width="3" marker-end="url(#ink)"/><text x="500" y="225" font-size="20" fill="#D2181F" font-weight="700" text-anchor="middle">BOTH ACTIVITIES</text><text x="260" y="317" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">TABLET</text><text x="260" y="346" font-size="22" fill="#1A1512" font-weight="400" text-anchor="middle">20-minute activity</text><text x="740" y="317" font-size="23" fill="#1A1512" font-weight="700" text-anchor="middle">PRINTED</text><text x="740" y="346" font-size="22" fill="#1A1512" font-weight="400" text-anchor="middle">20-minute activity</text><text x="140" y="386" font-size="18" fill="#D2181F" font-weight="700" text-anchor="start">INSIDE ONE TABLET STATION BLOCK</text><rect x="140" y="405" width="288" height="97" rx="0" fill="#1A1512" stroke="#1A1512" stroke-width="2"/><rect x="428" y="405" width="288" height="97" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="2"/><rect x="716" y="405" width="144" height="97" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2"/><text x="284" y="442" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">10 min</text><text x="284" y="478" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="middle">Learner 1 controls</text><text x="572" y="442" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">10 min</text><text x="572" y="478" font-size="21" fill="#FFFFFF" font-weight="400" text-anchor="middle">Learner 2 controls</text><text x="788" y="434" font-size="27" fill="#1A1512" font-weight="700" text-anchor="middle">5 min</text><text x="788" y="461" font-size="18" fill="#1A1512" font-weight="400" text-anchor="middle">Check · save</text><text x="788" y="485" font-size="18" fill="#1A1512" font-weight="400" text-anchor="middle">move</text><text x="500" y="539" font-size="28" fill="#1A1512" font-weight="700" text-anchor="middle">10 + 10 + 5 = 25 minutes</text><path d="M40 557 L960 557" fill="none" stroke="#1A1512" stroke-width="1" /><text x="40" y="584" font-size="17" fill="#73675E" font-weight="400" text-anchor="start">Concept schematic · Use the case constraints to plan the pair assignments.</text><text x="960" y="584" font-size="17" fill="#1A1512" font-weight="700" text-anchor="end">ACCESS IS4S</text></g></svg>
