<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">One shared station. Two individual turns.</title><desc id="desc">Tablet and printed activities each need twenty minutes. A proportional tablet-station bar separates ten minutes controlled by learner 1, ten controlled by learner 2 and five for checking, saving and moving, totalling twenty-five minutes. Each learner needs an individual turn; station time and activity time are different constraints.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1010" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">INTEGRATED PROJECT 2 / ACTIVITY + INDIVIDUAL TURN</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">One shared station. Two individual turns.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Both activities are required; a partner’s tool turn does not replace yours.</text><rect x="48" y="239" width="528" height="275" rx="14" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="77" y="289" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">TABLET</text><rect x="79" y="323" width="141" height="137" rx="14" fill="#1A1512" stroke="none" stroke-width="1" /><rect x="91" y="336" width="117" height="103" rx="4" fill="#F7F4F1" stroke="none" stroke-width="1" /><circle cx="149" cy="449" r="5" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="255" y="374" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">20-minute</text><text x="255" y="415" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">activity</text><rect x="624" y="239" width="528" height="275" rx="14" fill="#FFFFFF" stroke="#1A1512" stroke-width="2" /><text x="653" y="289" font-size="28" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">PRINTED</text><path d="M663 327 H733 L771 365 V450 H663 Z" stroke="#1A1512" stroke-width="3" fill="#FFFFFF"/><path d="M733 327 V365 H771" stroke="#1A1512" stroke-width="3" fill="none"/><line x1="680" y1="369" x2="744" y2="369" stroke="#D8CBC1" stroke-width="8"/><line x1="680" y1="398" x2="744" y2="398" stroke="#D8CBC1" stroke-width="8"/><text x="831" y="374" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">20-minute</text><text x="831" y="415" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">activity</text><text x="48" y="586" font-size="24" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">INSIDE ONE TABLET STATION BLOCK</text><rect x="48" y="621" width="441.59999999999997" height="150" rx="0" fill="#1A1512" stroke="#1A1512" stroke-width="2" /><text x="268.79999999999995" y="666" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">10 min</text><text x="268.79999999999995" y="711" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Learner 1</text><text x="268.79999999999995" y="748" font-size="25" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">controls</text><rect x="489.59999999999997" y="621" width="441.59999999999997" height="150" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="2" /><text x="710.4" y="666" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">10 min</text><text x="710.4" y="711" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Learner 2</text><text x="710.4" y="748" font-size="25" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">controls</text><rect x="931.1999999999999" y="621" width="220.79999999999998" height="150" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="2" /><text x="1041.6" y="666" font-size="34" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">5 min</text><text x="1041.6" y="711" font-size="27" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Check · save</text><text x="1041.6" y="748" font-size="25" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">move</text><text x="48" y="850" font-size="43" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">10 + 10 + 5 = 25 minutes</text><text x="48" y="923" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Use the case constraints to plan pair assignments. The activity and the station block</text><text x="48" y="957" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">describe different amounts of time.</text></g></svg>