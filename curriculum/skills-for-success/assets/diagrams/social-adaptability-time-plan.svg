<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="title desc"><title id="title">A proportional revised learning-folder plan</title><desc id="desc">Each bar uses the same scale. Original Thursday: 35 minutes digital, 25 drafting, 15 review and 15 buffer, totalling 90. Revised Thursday: 25 drafting, 10 source-label review and 25 digital, totalling 60. Monday has 10 minutes digital and a separate five-minute paper reflection review, both before noon. The actual digital allocation remains 35 minutes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1A1512"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#D2181F"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="12" stroke="#1A1512" stroke-opacity=".12" stroke-width="3"/></pattern></defs><g font-family="Arial, Helvetica, sans-serif" stroke-linejoin="round" stroke-linecap="round"><rect x="0" y="0" width="1000" height="580" rx="0" fill="#F7F4F1" stroke="none" stroke-width="2" /><rect x="40" y="35" width="7" height="48" rx="0" fill="#D2181F" stroke="none" stroke-width="2" /><text x="65" y="49" font-size="15" fill="#D2181F" font-weight="700" text-anchor="start" letter-spacing="2">ADAPTABILITY / WORKED EXAMPLE</text><text x="65" y="90" font-size="34" fill="#1A1512" font-weight="700" text-anchor="start" >Keep the goal. Move the work.</text><text x="40" y="156" font-size="17" fill="#73675E" font-weight="700" text-anchor="start" >ORIGINAL</text><text x="40" y="182" font-size="23" fill="#1A1512" font-weight="700" text-anchor="start" >THU</text><rect x="150" y="135" width="315" height="75" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width=