<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Keep the goal. Move the work.</title><desc id="desc">Proportional time bars compare an original ninety-minute Thursday plan with a revised sixty-minute session. The original has thirty-five minutes digital work, twenty-five drafting, fifteen reviewing and fifteen buffer. The revision has twenty-five drafting, ten reviewing and twenty-five digital. Monday adds ten minutes digital and five paper reflection in separate periods before noon. Digital practice remains thirty-five minutes.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#1A1512"/></marker><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M-2 12 L12 -2 M2 16 L16 2" stroke="#7A6B61" stroke-width="1.5"/></pattern></defs><rect width="1200" height="1000" fill="#F7F4F1"/><g font-family="Arial,Helvetica,sans-serif"><rect x="48" y="42" width="44" height="5" rx="0" fill="#D2181F" stroke="none" stroke-width="1" /><text x="108" y="54" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="2">ADAPTABILITY / TIME + PRIORITIES</text><text x="48" y="126" font-size="49" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Keep the goal. Move the work.</text><text x="48" y="164" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Every bar uses the same scale; changing time does not erase an outcome.</text><text x="48" y="272" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">ORIGINAL</text><text x="48" y="321" font-size="39" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">THU</text><rect x="229" y="250" width="350" height="88" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.5" /><text x="404.0" y="284" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Digital</text><text x="404.0" y="319" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">35 min</text><rect x="579" y="250" width="250" height="88" rx="0" fill="#1A1512" stroke="#1A1512" stroke-width="1.5" /><text x="704.0" y="284" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Draft</text><text x="704.0" y="319" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">25 min</text><rect x="829" y="250" width="150" height="88" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5" /><text x="904.0" y="284" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Review</text><text x="904.0" y="319" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">15 min</text><rect x="979" y="250" width="150" height="88" rx="0" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><text x="1054.0" y="284" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Buffer</text><text x="1054.0" y="319" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">15 min</text><text x="1129" y="380" font-size="28" font-weight="700" fill="#1A1512" text-anchor="end" letter-spacing="0">90 minutes</text><text x="48" y="532" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">REVISED</text><text x="48" y="581" font-size="39" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">THU</text><rect x="229" y="510" width="250" height="88" rx="0" fill="#1A1512" stroke="#1A1512" stroke-width="1.5" /><text x="354.0" y="544" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Draft</text><text x="354.0" y="579" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">25 min</text><rect x="479" y="510" width="100" height="88" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5" /><text x="529.0" y="544" font-size="25" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">Review</text><text x="529.0" y="579" font-size="24" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">10 min</text><rect x="579" y="510" width="250" height="88" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.5" /><text x="704.0" y="544" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Digital</text><text x="704.0" y="579" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">25 min</text><rect x="829" y="510" width="300" height="88" rx="0" fill="url(#hatch)" stroke="#7A6B61" stroke-width="1.5" /><text x="979" y="547" font-size="28" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">30 minutes</text><text x="979" y="582" font-size="25" font-weight="400" fill="#1A1512" text-anchor="middle" letter-spacing="0">removed</text><text x="829" y="640" font-size="28" font-weight="700" fill="#1A1512" text-anchor="end" letter-spacing="0">60-minute session</text><path d="M700 395 C700 451 1100 431 1100 487" stroke="#D2181F" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="752" font-size="23" font-weight="700" fill="#D2181F" text-anchor="start" letter-spacing="0">FOLLOW-UP</text><text x="48" y="801" font-size="39" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">MON</text><rect x="229" y="727" width="100" height="78" rx="0" fill="#D2181F" stroke="#1A1512" stroke-width="1.5" /><text x="279" y="778" font-size="35" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">10</text><rect x="329" y="727" width="50" height="78" rx="0" fill="#FFBC00" stroke="#1A1512" stroke-width="1.5" /><text x="354" y="778" font-size="32" font-weight="700" fill="#1A1512" text-anchor="middle" letter-spacing="0">5</text><text x="420" y="758" font-size="29" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">10 min digital + 5 min paper reflection</text><text x="420" y="801" font-size="25" font-weight="400" fill="#1A1512" text-anchor="start" letter-spacing="0">Separate periods · finished before noon</text><rect x="48" y="869" width="1104" height="80" rx="10" fill="#FFFFFF" stroke="#1A1512" stroke-width="1.5" /><text x="78" y="919" font-size="32" font-weight="700" fill="#1A1512" text-anchor="start" letter-spacing="0">Digital practice remains 25 + 10 = 35 minutes.</text></g></svg>